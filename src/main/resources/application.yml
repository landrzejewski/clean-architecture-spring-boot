spring:
  datasource:
    url: jdbc:h2:mem:payments
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  messages:
    basename: exceptions
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  modulith:
    events:
      # niedokończone publikacje (listener rzucił wyjątek / aplikacja padła) są ponawiane przy starcie
      republish-outstanding-events-on-restart: true
payments:
  card-number-length: 16
  exchange-rates:
    provider: fixed          # fixed | nbp
  import:
    enabled: false
    directory: import
orders:
  saga:
    step-timeout: 30s        # po tym czasie krok bez odpowiedzi jest ponawiany
    max-attempts: 3          # po tylu próbach krok uznajemy za nieudany (kompensacja)
    check-interval: 5s
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
---
spring:
  config:
    activate:
      on-profile: jdbc
logging:
  level:
    org.springframework.jdbc.core: debug
