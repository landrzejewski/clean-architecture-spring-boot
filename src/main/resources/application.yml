spring:
  mongodb:
    # model odczytu (CQRS); serverSelectionTimeoutMS - szybki błąd, gdy MongoDB nie działa
    uri: mongodb://localhost:27017/payments-read?serverSelectionTimeoutMS=2000
  datasource:
    url: jdbc:h2:mem:payments
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always          # schema.sql - tabele event store
  messages:
    basename: exceptions
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  modulith:
    events:
      # niedokończone publikacje (listener rzucił wyjątek / aplikacja padła) są ponawiane przy starcie
      republish-outstanding-events-on-restart: true
payments:
  card-number-length: 16
  snapshot-frequency: 10     # migawka co N zdarzeń
  exchange-rates:
    provider: fixed          # fixed | nbp
  import:
    enabled: false
    directory: import
orders:
  payments:
    mode: async              # async | sync
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
