server:
  port: 8081
spring:
  application:
    name: payments-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: jdbc:h2:mem:payments
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  messages:
    basename: exceptions
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  modulith:
    events:
      # niedokończone publikacje (listener rzucił wyjątek / aplikacja padła) są ponawiane przy starcie
      republish-outstanding-events-on-restart: true
payments:
  card-number-length: 16
  exchange-rates:
    provider: fixed          # fixed | nbp
  import:
    enabled: false
    directory: import
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
---
spring:
  config:
    activate:
      on-profile: jdbc
logging:
  level:
    org.springframework.jdbc.core: debug
