<header>Czysta architektura w praktyce</header>
<h1 id="jak-pracujemy-z-repozytorium">Jak pracujemy z repozytorium</h1>
<ul>
<li>Jedna domena przez całe szkolenie: <strong>karty i płatności</strong>, potem <strong>zamówienia</strong> i <strong>wysyłki</strong>.</li>
<li>Każdy branch to <strong>jeden koncept</strong> zbudowany na poprzednim.<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">git checkout 06-rest-adapter
git diff 05-spring-as-detail..06-rest-adapter --<span class="hljs-built_in">stat</span>
</code></pre>
</li>
<li>Na każdym branchu <code>README.md</code>: cel, problem z poprzedniego kroku, co się zmieniło, kiedy <strong>nie</strong> stosować, pytania.</li>
<li>Decyzje w <code>docs/adr</code>, model C4 w <code>docs/c4/workspace.dsl</code>.</li>
<li>Każda reguła ma test, który jej pilnuje: <code>./mvnw test</code>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>00 → 01 → … → 15 ─┬─► 16 (mikroserwis)
                  ├─► 17 → 18 → 19 (CQRS, ES)
                  └─► 20 → 21 (saga)
</code></pre>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="5" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="podstawowe-poj%C4%99cia">Podstawowe pojęcia</h1>
<ul>
<li><strong>Reguły biznesowe</strong> definiują pojęcia i polityki niezbędne do działania biznesu.</li>
<li><strong>Proces biznesowy</strong> to seria powtarzalnych kroków prowadzących do celu biznesowego.</li>
<li><strong>Logika biznesowa</strong> to część aplikacji realizująca przyjęte reguły biznesowe.</li>
<li><strong>Architektura</strong> określa najważniejsze komponenty, ich odpowiedzialność i wzajemne relacje. Jest szablonem rozwiązania na poziomie aplikacji lub systemu.</li>
</ul>
<blockquote>
<p>Poprawna implementacja logiki biznesowej sprowadza się zwykle do dwóch rzeczy: <strong>niskiego sprzężenia</strong> (low coupling) i <strong>wysokiej spójności</strong> (high cohesion).</p>
</blockquote>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="6" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="skutki-%C5%BAle-dobranej-architektury">Skutki źle dobranej architektury</h1>
<ul>
<li>Każda zmiana „rozlewa się” po wielu klasach i warstwach.</li>
<li>Reguły biznesowe są ukryte w kontrolerach, serwisach, zapytaniach SQL i triggerach.</li>
<li>Testy są wolne, kruche i wymagają całej infrastruktury.</li>
<li>Wymiana technologii (bazy, kolejki, frameworka) oznacza przepisanie logiki.</li>
<li>Zespół boi się zmian, a koszt każdej funkcji rośnie z czasem.</li>
</ul>
<p><strong>Wymagania niefunkcjonalne</strong> (dostępność 24/7, 1000 równoczesnych użytkowników, 200 transakcji na minutę)<br />
również kształtują architekturę. Wrócimy do nich przy CQRS i mikroserwisach.</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="7" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch00-layered-anemicspan-punkt-startowy"><span class="branch">00-layered-anemic</span> Punkt startowy</h1>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Service</span> <span class="hljs-meta">@Transactional</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CardService</span> {
  <span class="hljs-keyword">public</span> <span class="hljs-type">CardEntity</span> <span class="hljs-title function_">addTransaction</span><span class="hljs-params">(String number,
      BigDecimal amount, String currency, String type)</span> {
    <span class="hljs-type">var</span> <span class="hljs-variable">card</span> <span class="hljs-operator">=</span> repo.findByNumber(number).orElseThrow();
    <span class="hljs-keyword">if</span> (!card.getCurrencyCode().equals(currency)) …
    <span class="hljs-keyword">if</span> (type.equals(<span class="hljs-string">&quot;OUT&quot;</span>)) {
      <span class="hljs-keyword">if</span> (card.getBalance().compareTo(amount) &lt; <span class="hljs-number">0</span>) …
      card.setBalance(card.getBalance().subtract(amount));
    } …
</code></pre>
</div>
<div>
<ul>
<li><code>Controller → Service → Repository</code></li>
<li>encja JPA = model domeny = kontrakt REST</li>
<li>logika w <code>if</code>-ach serwisu (<strong>Transaction Script</strong>)</li>
<li><code>ZonedDateTime.now()</code>, <code>Random</code>, <code>System.out</code> w logice</li>
<li>test reguły wymaga <code>@SpringBootTest</code></li>
</ul>
<p><strong>Ćwiczenie:</strong> dodaj 2% prowizji za płatność w obcej walucie.</p>
</div>
</div>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="8" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="model-anemiczny-vs-bogaty">Model anemiczny vs bogaty</h1>
<table>
<thead>
<tr>
<th></th>
<th>Anemiczny</th>
<th>Bogaty (DDD)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Encje</td>
<td>struktury danych (gettery/settery)</td>
<td>zachowania + niezmienniki</td>
</tr>
<tr>
<td>Logika</td>
<td>serwisy (Transaction Script)</td>
<td>agregaty, encje, Value Objects</td>
</tr>
<tr>
<td>Repozytoria</td>
<td>DAO dla każdej tabeli</td>
<td>dla agregatów (jest ich mniej)</td>
</tr>
<tr>
<td>Serwisy</td>
<td>„grube”</td>
<td>lekkie, orkiestrujące</td>
</tr>
<tr>
<td>Testy</td>
<td>integracyjne</td>
<td>jednostkowe, w milisekundach</td>
</tr>
</tbody>
</table>
<p><strong>Domain Driven Design</strong> zakłada, że obiekty i ich zachowania wiernie odwzorowują domenę problemu.</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="9" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch01-rich-domainspan-agregat-i-value-objects"><span class="branch">01-rich-domain</span> Agregat i Value Objects</h1>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">final</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Card</span> {

  <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">registerTransaction</span><span class="hljs-params">(Transaction t)</span> {
    validate(t);      <span class="hljs-comment">// waluta, ważność, saldo</span>
    commit(t);        <span class="hljs-comment">// zmiana salda</span>
    events.add(<span class="hljs-keyword">new</span> <span class="hljs-title class_">TransactionRegistered</span>(number, t));
  }

  <span class="hljs-keyword">public</span> <span class="hljs-type">List</span>&lt;TransactionRegistered&gt; <span class="hljs-title function_">pullEvents</span><span class="hljs-params">()</span> { … }
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">Money</span><span class="hljs-params">(BigDecimal amount, Currency currency)</span> {
  <span class="hljs-keyword">public</span> Money {
    <span class="hljs-keyword">if</span> (amount.signum() &lt; <span class="hljs-number">0</span>) <span class="hljs-keyword">throw</span> …;
    amount = amount.setScale(…);  <span class="hljs-comment">// 10 == 10.00</span>
  }
}
</code></pre>
</div>
<div>
<ul>
<li><strong>Agregat</strong> to granica spójności: stan zmienia się tylko przez metody biznesowe.</li>
<li><strong>Value Object</strong>: niezmienny, porównywany po wartości, waliduje się sam.</li>
<li><strong>Zdarzenie domenowe</strong>: fakt w czasie przeszłym.</li>
<li>Czysta Java: bez Springa, JPA i bazy.</li>
</ul>
</div>
</div>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="10" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="kontrakty-ioc-i-wstrzykiwanie-zale%C5%BCno%C5%9Bci">Kontrakty, IoC i wstrzykiwanie zależności</h1>
<ul>
<li><strong>Kontrakt (interfejs, API)</strong> to abstrakcja definiująca sposób interakcji współpracujących elementów i ukrywająca szczegóły implementacji.</li>
<li><strong>Inwersja kontroli (IoC)</strong> przenosi odpowiedzialność za sterowanie wykonaniem na zewnątrz.</li>
<li><strong>Wstrzykiwanie zależności</strong>: zależności są tworzone i podawane z zewnątrz:
<ul>
<li>ręcznie (konstruktor), <span class="branch">02</span></li>
<li>wzorce, np. Factory, <span class="branch">04</span></li>
<li>kontener (Spring, CDI). <span class="branch">05</span></li>
</ul>
</li>
<li><strong>DIP</strong>: moduły wysokiego poziomu nie zależą od niskiego poziomu. Obie strony zależą od abstrakcji, a abstrakcję definiuje <strong>strona, która jej potrzebuje</strong>.</li>
</ul>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="11" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch02-use-cases-and-portsspan-porty-i-adaptery"><span class="branch">02-use-cases-and-ports</span> Porty i adaptery</h1>
<div class="flow">
<div class="box">REST / CLI / main()</div><div class="arrow">→</div>
<div class="box">port wejściowy<br /><code>AddTransactionUseCase</code></div><div class="arrow">→</div>
<div class="box">use case<br /><code>AddTransactionService</code></div><div class="arrow">→</div>
<div class="box">domena<br /><code>Card</code></div>
</div>
<div class="flow" style="margin-top:14px">
<div class="box">use case</div><div class="arrow">→</div>
<div class="box">porty wyjściowe<br /><code>CardRepository</code> · <code>DateTimeProvider</code> · <code>TransactionEventPublisher</code></div><div class="arrow">←</div>
<div class="box">adaptery<br />in-memory, konsola</div>
</div>
<ul>
<li>Komendy walidują się same (<code>AddTransactionCommand</code>).</li>
<li>Model wyjściowy (<code>CardView</code>) chroni agregat przed wyciekiem.</li>
<li>Composition root w <code>main()</code>: DI bez frameworka.</li>
<li>Test use case'u z fake'ami portów, z kontrolą czasu.</li>
</ul>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="12" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="architektura-warstwowa-n-tier">Architektura warstwowa (n-tier)</h1>
<ul>
<li>Komponenty zorganizowane w warstwy techniczne: prezentacja, logika, dane.</li>
<li>Komunikacja w jednym kierunku, z góry w dół.</li>
<li><strong>Logika zależy od persystencji.</strong> Zmiana bazy dotyka reguł biznesowych.</li>
<li>Prosta, znana i wystarczająca dla aplikacji z małą ilością logiki.</li>
</ul>
<div class="flow" style="margin-top:20px">
<div class="box">Presentation</div><div class="arrow">↓</div>
<div class="box">Business</div><div class="arrow">↓</div>
<div class="box warn">Persistence</div>
</div>
<p class="small">herbertograca.com/2017/08/03/layered-architecture</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="13" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="czysta-architektura">Czysta architektura</h1>
<div class="columns">
<div>
<div class="rings">
  <div class="r4">Frameworks &amp; Drivers</div>
  <div class="r3">Interface Adapters</div>
  <div class="r2">Use Cases</div>
  <div class="r1">Entities</div>
</div>
</div>
<div>
<ul>
<li>W centrum logika biznesowa, niezależna od bibliotek, frameworków i infrastruktury.</li>
<li>Wokół niej kolejne warstwy, m.in. adaptery łączące ze światem zewnętrznym.</li>
<li><strong>Reguła zależności</strong>: zależności w kodzie wskazują wyłącznie do środka.</li>
<li>Przepływ sterowania może iść na zewnątrz (presenter), ale zależność dalej wskazuje do środka (DIP).</li>
</ul>
<p class="small">blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html</p>
</div>
</div>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="14" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch03-architectures-comparedspan-jeden-use-case-cztery-style"><span class="branch">03-architectures-compared</span> Jeden use case, cztery style</h1>
<table>
<thead>
<tr>
<th></th>
<th>Warstwowa</th>
<th>Onion</th>
<th>Heksagonalna</th>
<th>Czysta</th>
</tr>
</thead>
<tbody>
<tr>
<td>Kierunek zależności</td>
<td>w dół, do bazy</td>
<td>do środka</td>
<td>do środka</td>
<td>do środka</td>
</tr>
<tr>
<td>Interfejs repozytorium</td>
<td>warstwa danych</td>
<td>domain services</td>
<td>port wyjściowy</td>
<td>gateway w use cases</td>
</tr>
<tr>
<td>Akcent</td>
<td>podział techniczny</td>
<td>pierścienie modelu</td>
<td>porty i wymienne adaptery</td>
<td>granice, presenter</td>
</tr>
<tr>
<td>Reguła ArchUnit</td>
<td><code>layeredArchitecture()</code></td>
<td><code>onionArchitecture()</code></td>
<td><code>noClasses()…</code></td>
<td>warstwy-pierścienie</td>
</tr>
</tbody>
</table>
<p>Onion, heksagonalna i czysta różnią się głównie nazewnictwem. <strong>Reguła zależności jest ta sama.</strong></p>
<p><strong>Ćwiczenie „blog”, część 1:</strong> domena i warstwa aplikacji bloga w czystej Javie.</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-class="lead" data-theme="training" data-lang="pl" lang="pl" class="lead" data-marpit-pagination="15" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--class:lead;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>

<h1 id="modu%C5%82-2">Moduł 2</h1>
<h2 id="implementacja-czystej-architektury">Implementacja czystej architektury</h2>
<p><span class="branch">04</span> <span class="branch">05</span> <span class="branch">06</span> <span class="branch">07</span> <span class="branch">08</span> <span class="branch">09</span></p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="16" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="programowanie-aspektowe">Programowanie aspektowe</h1>
<ul>
<li>Uzupełnia OOP: oddziela logikę biznesową od zadań pobocznych (transakcje, logowanie, bezpieczeństwo, pomiar czasu).</li>
<li>Najczęściej realizowane wzorcem <strong>Proxy</strong>.</li>
</ul>
<div class="columns">
<div>
<p><span class="branch">04-cross-cutting-by-hand</span></p>
<ul>
<li>Decorator: osobna klasa per interfejs</li>
<li>JDK dynamic proxy + łańcuch interceptorów</li>
<li><code>@Atomic</code>, <code>@Timer</code> deklarują intencję bez technologii</li>
<li>Factory + Facade = composition root</li>
</ul>
</div>
<div>
<p><span class="branch">05-spring-as-detail</span></p>
<ul>
<li><code>@Configuration</code> = composition root</li>
<li>Spring AOP zamiast własnych proxy</li>
<li><code>AspectOrder</code>: retry → timer → atomic</li>
<li>ArchUnit: rdzeń bez <code>org.springframework..</code></li>
</ul>
</div>
</div>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="17" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="spring-jako-szczeg%C3%B3%C5%82">Spring jako szczegół</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Configuration</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PaymentsConfiguration</span> {

  <span class="hljs-meta">@Bean</span>
  <span class="hljs-keyword">public</span> <span class="hljs-type">AddTransactionUseCase</span> <span class="hljs-title function_">addTransactionUseCase</span><span class="hljs-params">(DateTimeProvider clock,
      TransactionEventPublisher publisher, CardRepository cards)</span> {
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">AddTransactionService</span>(clock, publisher, cards);  <span class="hljs-comment">// zwykła klasa</span>
  }
}
</code></pre>
<ul>
<li>Domena i use case'y <strong>bez adnotacji Springa</strong>. Testy z modułu 1 działają bez zmian.</li>
<li>Adaptery mogą znać framework (<code>@Adapter</code> = <code>@Component</code>).</li>
<li>Pułapki proxy: self-invocation, metody <code>public</code>, klasy nie-<code>final</code>.</li>
</ul>
<blockquote>
<p>Kompromis: wiele zespołów świadomie akceptuje <code>@Transactional</code> w warstwie aplikacji. Ważne, żeby to była decyzja (ADR), a nie przypadek.</p>
</blockquote>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="18" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch06-rest-adapterspan-adapter-wej%C5%9Bciowy-rest"><span class="branch">06-rest-adapter</span> Adapter wejściowy REST</h1>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@PostMapping(&quot;api/cards/{number}/transactions&quot;)</span>
<span class="hljs-type">ResponseEntity</span>&lt;TransactionIdResponse&gt; <span class="hljs-title function_">addTransaction</span><span class="hljs-params">(
    <span class="hljs-meta">@PathVariable</span> String number,
    <span class="hljs-meta">@Validated</span> <span class="hljs-meta">@RequestBody</span> AddTransactionRequest request)</span> {
  <span class="hljs-type">var</span> <span class="hljs-variable">id</span> <span class="hljs-operator">=</span> addTransaction.handle(mapper.toCommand(number, request));
  <span class="hljs-keyword">return</span> ResponseEntity.created(fromRequest(id)).body(…);
}
</code></pre>
</div>
<div>
<ul>
<li>Osobny kontrakt REST (DTO), niezależny od domeny.</li>
<li>Trzy poziomy walidacji: format (DTO), kompletność (komenda), reguły (domena).</li>
<li><code>IN</code>/<code>OUT</code> (API) ↔ <code>INFLOW</code>/<code>PAYMENT</code> (domena).</li>
<li>Wyjątki → <strong>Problem Details</strong> (RFC 9457), i18n.</li>
<li><code>@WebMvcTest</code> + <code>@MockitoBean</code> portu.</li>
</ul>
</div>
</div>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="19" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch07-persistence-adapterspan-persystencja-i-mapowanie"><span class="branch">07-persistence-adapter</span> Persystencja i mapowanie</h1>
<ul>
<li>Model JPA (<code>CardEntity</code>) oddzielony od agregatu i ukryty w adapterze (package-private).</li>
<li>Agregat odtwarzany przez <code>Card.restore()</code> bez walidacji i bez zdarzeń.</li>
<li>Transakcję otwiera use case (<code>@Atomic</code>), adapter jej wymaga (<code>MANDATORY</code>).</li>
<li>Optimistic locking (<code>@Version</code>) → wyjątek <strong>portu</strong> <code>CardModifiedConcurrentlyException</code> → <code>@Retry</code>.</li>
</ul>

<thead>
<tr>
<th>Strategia mapowania</th>
<th>Przykład w repo</th>

</tr>
<tr>

</tr>
<tr>
<td>pełne (model per operacja)</td>

</tr>

</tr>

<header>Czysta architektura w praktyce</header>
<h1 id="architektura-jako-kod-archunit">Architektura jako kod (ArchUnit)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@ArchTest</span>
<span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">ArchRule</span> <span class="hljs-variable">core_is_framework_free</span> <span class="hljs-operator">=</span> noClasses()
    .that().resideInAnyPackage(<span class="hljs-string">&quot;..domain..&quot;</span>, <span class="hljs-string">&quot;..application..&quot;</span>)
    .should().dependOnClassesThat()
    .resideInAnyPackage(<span class="hljs-string">&quot;org.springframework..&quot;</span>, <span class="hljs-string">&quot;jakarta.persistence..&quot;</span>);

<span class="hljs-meta">@ArchTest</span>
<span class="hljs-keyword">static</span> <span class="hljs-keyword">final</span> <span class="hljs-type">ArchRule</span> <span class="hljs-variable">adapters_are_independent</span> <span class="hljs-operator">=</span> slices()
    .matching(<span class="hljs-string">&quot;..payments.adapters.(*)..&quot;</span>).should().notDependOnEachOther();
</code></pre>
<ul>
<li>Reguły warstw, <code>onionArchitecture()</code>, deterministyczna domena (bez <code>now()</code>), brak cykli, konwencje.</li>
<li><code>FreezingArchRule</code> pozwala wprowadzać reguły w istniejącym projekcie stopniowo.</li>
<li>jMolecules (<code>@AggregateRoot</code>, <code>@ValueObject</code>) + <code>jmolecules-archunit</code>.</li>
</ul>
<p><strong>Ćwiczenie „blog”, część 2:</strong> adaptery REST i JPA, testy, reguły ArchUnit.</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="24" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="bounded-context-i-style-system%C3%B3w">Bounded Context i style systemów</h1>
<ul>
<li><strong>Bounded Context</strong>: aplikacja podzielona na konteksty z własnym modelem (płatności, zamówienia, wysyłki). Komunikują się przez dobrze określony interfejs.</li>
<li><strong>Monolit</strong>: rozwijany, testowany i wdrażany jako całość. Łatwy na początku, trudny od pewnego rozmiaru.</li>
<li><strong>Modularny monolit</strong>: niezależne moduły z odpowiedzialnością i publicznym kontraktem, wdrażane razem.</li>
<li><strong>SOA</strong>: rozproszone usługi z kontraktami, które mogą współdzielić dane i są integrowane przez ESB.</li>
<li><strong>Mikroserwisy</strong>: niezależne usługi, które <strong>nie współdzielą danych</strong> i komunikują się wyłącznie przez API.</li>
</ul>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="25" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch10-second-context-naivespan-drugi-kontekst-%E2%80%9Ena-skr%C3%B3ty"><span class="branch">10-second-context-naive</span> Drugi kontekst „na skróty”</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// orders.application.PlaceOrderService (wersja naiwna)</span>
<span class="hljs-type">var</span> <span class="hljs-variable">card</span> <span class="hljs-operator">=</span> cardRepository.findByNumber(command.cardNumber()).orElseThrow();
<span class="hljs-type">var</span> <span class="hljs-variable">transaction</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Transaction</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">TransactionId</span>(), clock.now(), command.total(), PAYMENT);
card.registerTransaction(transaction);       <span class="hljs-comment">// zamówienia same obciążają kartę!</span>
cardRepository.save(card);
</code></pre>
<ul>
<li><code>orders</code> zna wnętrze <code>payments</code>: <code>CardRepository</code>, <code>Card</code>, <code>Transaction</code>.</li>
<li>Ominięty use case: brak przeliczania walut, zdarzeń i retry.</li>
<li><code>payments</code> pokazuje zamówienia karty, więc powstaje <strong>cykl</strong>.</li>
<li>Wspólny model (<code>Money</code>, <code>CardNumber</code>) skleja konteksty.</li>
</ul>
<p><code>ContextBoundariesTest</code> jest celowo wyłączony. Usuń <code>@Disabled</code>.</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="26" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch11-language-encapsulationspan-hermetyzacja-%C5%9Brodkami-j%C4%99zyka"><span class="branch">11-language-encapsulation</span> Hermetyzacja środkami języka</h1>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">PaymentsApi</span> {
  <span class="hljs-type">PaymentResult</span> <span class="hljs-title function_">pay</span><span class="hljs-params">(PaymentRequest request)</span>;
}

<span class="hljs-keyword">public</span> <span class="hljs-keyword">sealed</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">PaymentResult</span> {
  <span class="hljs-keyword">record</span> <span class="hljs-title class_">Completed</span><span class="hljs-params">(String paymentId)</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PaymentResult</span> {}
  <span class="hljs-keyword">record</span> <span class="hljs-title class_">Rejected</span><span class="hljs-params">(String reason)</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PaymentResult</span> {}
}

<span class="hljs-keyword">switch</span> (paymentsApi.pay(request)) {
  <span class="hljs-keyword">case</span> Completed c -&gt; order.markPaid(c.paymentId());
  <span class="hljs-keyword">case</span> Rejected r -&gt; order.reject(r.reason());
}
</code></pre>
</div>
<div>
<ul>
<li>Wąski publiczny kontrakt: pakiet <code>payments.api</code>.</li>
<li>Implementacja package-private (<code>PaymentsApiAdapter</code>).</li>
<li><code>sealed</code> wymusza obsługę wszystkich przypadków.</li>
<li>Własne VO zamówień: <code>Price</code>, <code>CardReference</code>.</li>
<li>Jedna transakcja na moduł.</li>
<li><strong>Ograniczenie</strong>: Java nie ukryje podpakietów. Granicę pilnuje tylko test.</li>
</ul>
</div>
</div>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="27" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch12-maven-modulesspan-i-span-classbranch13-jpmsspan"><span class="branch">12-maven-modules</span> i <span class="branch">13-jpms</span></h1>
<div class="columns">
<div>
<p><strong>Moduły Maven</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>common
payments-api   ← kontrakt
payments       → common, payments-api
orders         → common, payments-api
app            → payments, orders
</code></pre>
<p>Import <code>payments.domain</code> w <code>orders</code>: <em>package does not exist</em>.</p>
</div>
<div>
<p><strong>JPMS</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">open <span class="hljs-keyword">module</span> pl.fullstackdeveloper.payments {
  <span class="hljs-keyword">requires</span> pl.fullstackdeveloper.payments.api;
  <span class="hljs-keyword">requires</span> spring.context;
  <span class="hljs-comment">// brak exports: wnętrze niewidoczne</span>
}
</code></pre>
<p><code>exports</code> daje dostęp w kompilacji, <code>opens</code> daje refleksję. Spring Boot uruchamia się z classpath, więc JPMS działa głównie w kompilacji.</p>
</div>
</div>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="28" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch14-module-communicationspan-komunikacja-modu%C5%82%C3%B3w"><span class="branch">14-module-communication</span> Komunikacja modułów</h1>
<ul>
<li>Zamówienia definiują <strong>własny port</strong> <code>Payments</code> i własny wynik <code>PaymentOutcome</code>.</li>
<li>Kontrakt płatności zna tylko adapter: <strong>Anti-Corruption Layer</strong> (<code>PaymentsTranslator</code>).</li>
<li>Ten sam use case działa z dwoma adapterami:
<ul>
<li>synchronicznym: <code>PaymentsApi.pay()</code>,</li>
<li>asynchronicznym: <code>PaymentRequested</code> → <code>PaymentProcessed</code>, korelacja przez <code>reference</code>.</li>
</ul>
</li>
</ul>
<p><strong>Programowanie przez zdarzenia</strong> (wzorzec Observer) rozluźnia powiązania: komponenty komunikują się, choć niewiele o sobie wiedzą.</p>
<blockquote>
<p>Słaby punkt: zdarzenie w pamięci ginie przy awarii między commitem a publikacją.</p>
</blockquote>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="29" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch15-spring-modulithspan-modularny-monolit-ze-spring-modulith"><span class="branch">15-spring-modulith</span> Modularny monolit ze Spring Modulith</h1>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@ApplicationModule(allowedDependencies =
    {&quot;payments::api&quot;, &quot;common&quot;})</span>
<span class="hljs-keyword">package</span> pl.fullstackdeveloper.orders;

<span class="hljs-meta">@ApplicationModuleListener</span>   <span class="hljs-comment">// async + nowa tx</span>
<span class="hljs-type">void</span> <span class="hljs-title function_">on</span><span class="hljs-params">(PaymentProcessed event)</span> { … }

ApplicationModules.of(Application.class).verify();
</code></pre>
</div>
<div>
<ul>
<li>Moduły to pakiety najwyższego poziomu, weryfikowane testem.</li>
<li><strong>Event Publication Registry</strong>: zdarzenie zapisane w tej samej transakcji co zmiana (<strong>transactional outbox</strong>) i ponawiane.</li>
<li><code>@ApplicationModuleTest</code> + <code>Scenario</code>: test modułu w izolacji.</li>
<li><code>Documenter</code>: diagramy C4 z kodu.</li>
</ul>
</div>
</div>
<table>
<thead>
<tr>
<th></th>
<th>Maven</th>
<th>JPMS</th>
<th>Modulith</th>
</tr>
</thead>
<tbody>
<tr>
<td>kiedy</td>
<td>kompilacja</td>
<td>kompilacja</td>
<td>testy</td>
</tr>
<tr>
<td>koszt</td>
<td>pom-y</td>
<td><code>module-info</code>, refleksja</td>
<td>niski</td>
</tr>
</tbody>
</table>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="30" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="mikroserwisy-zalety-i-wyzwania">Mikroserwisy: zalety i wyzwania</h1>
<div class="columns">
<div>
<p><strong>Zalety</strong></p>
<ul>
<li>modularność i reużywalność</li>
<li>skalowalność i optymalne zużycie zasobów</li>
<li>niezawodność i wysoka dostępność</li>
<li>łatwość rozwoju pojedynczej usługi</li>
</ul>
</div>
<div>
<p><strong>Wyzwania</strong></p>
<ul>
<li>złożoność na poziomie makro: infrastruktura, utrzymanie, synchronizacja stanu i procesów</li>
<li>koszty: ludzie, sprzęt, utrzymanie</li>
<li>sieć: wydajność i awarie</li>
<li>kontrakty i ich wersjonowanie</li>
</ul>
</div>
</div>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="31" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch16-extract-microservicespan-wydzielenie-us%C5%82ugi"><span class="branch">16-extract-microservice</span> Wydzielenie usługi</h1>
<div class="flow">
<div class="box">orders-service :8082</div><div class="arrow">⇄ Kafka (outbox) ⇄</div>
<div class="box">payments-service :8081</div>
</div>
<ul>
<li>W zamówieniach zmieniają się <strong>tylko adaptery</strong>. Domena i use case'y bez zmian (<code>git diff</code> pokazuje tylko przeniesienia).</li>
<li>Sync: <code>HttpPaymentsAdapter</code> + <code>@Retryable</code> + <code>@ConcurrencyLimit</code> (Spring Framework 7).</li>
<li>Async: eksternalizacja zdarzeń Modulith do Kafki oraz inbox.</li>
<li>Kontrakt <code>payments-api</code> + pliki <code>contracts/*.json</code> sprawdzane po obu stronach.</li>
<li>Kontrakt sieciowy musi być prosty: płaski JSON zamiast hierarchii <code>sealed</code>.</li>
</ul>
<p><strong>Ćwiczenie „blog”, część 3:</strong> kontekst notifications jako moduł Modulith.</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="32" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="model-c4">Model C4</h1>
<ul>
<li>Opisuje architekturę i ułatwia dzielenie się wiedzą o niej.</li>
<li>Cztery poziomy szczegółowości:
<ol>
<li><strong>Context</strong>: system, użytkownicy, systemy zewnętrzne (NBP)</li>
<li><strong>Container</strong>: aplikacje i magazyny danych (<code>payments-service</code>, <code>orders-service</code>, Kafka, bazy)</li>
<li><strong>Component</strong>: moduły (<code>payments</code>, <code>orders</code>, <code>payments::api</code>)</li>
<li><strong>Code</strong>: klasy (zwykle generowane, nie rysowane)</li>
</ol>
</li>
<li>W repo: <code>docs/c4/workspace.dsl</code> (Structurizr DSL) aktualizowany w <code>02</code>, <code>10</code>, <code>14</code>, <code>15</code>, <code>16</code>, oraz <code>docs/modulith</code> generowane przez <code>Documenter</code>.</li>
<li>Decyzje zapisujemy w <code>docs/adr</code>.</li>
</ul>
<p class="small">c4model.com · docker run -p 8080:8080 -v $(pwd)/docs/c4:/usr/local/structurizr structurizr/lite</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-class="lead" data-theme="training" data-lang="pl" lang="pl" class="lead" data-marpit-pagination="33" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--class:lead;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>

<h1 id="modu%C5%82-4">Moduł 4</h1>
<h2 id="wzorce-zaawansowane">Wzorce zaawansowane</h2>
<p><span class="branch">17</span> <span class="branch">18</span> <span class="branch">19</span> <span class="branch">20</span> <span class="branch">21</span></p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="34" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="cqs-i-cqrs">CQS i CQRS</h1>
<ul>
<li><strong>Command Query Separation</strong> (B. Meyer, 1986): metoda albo zmienia stan i nic nie zwraca (command), albo zwraca dane i nie zmienia stanu (query).</li>
<li><strong>CQRS</strong> (G. Young, U. Dahan): ta sama zasada na poziomie klas, komponentów i systemu.</li>
</ul>
<table>
<thead>
<tr>
<th>Element</th>
<th>Rola</th>
</tr>
</thead>
<tbody>
<tr>
<td>Command</td>
<td>intencja użytkownika, np. <code>AddTransactionCommand</code></td>
</tr>
<tr>
<td>Command Bus / Handler</td>
<td>routing, walidacja, zmiana agregatu, zapis</td>
</tr>
<tr>
<td>Event</td>
<td>zmiana, która zaszła, np. <code>TransactionAdded</code></td>
</tr>
<tr>
<td>Event Handler</td>
<td>aktualizacja bazy odczytu</td>
</tr>
<tr>
<td>Read Database</td>
<td>model zoptymalizowany pod odczyt</td>
</tr>
</tbody>
</table>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="35" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch17-cqrs-lightspan-dwa-modele-jedna-baza"><span class="branch">17-cqrs-light</span> Dwa modele, jedna baza</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">AddTransactionUseCase</span>
        <span class="hljs-keyword">extends</span> <span class="hljs-title class_">CommandHandler</span>&lt;AddTransactionCommand, TransactionId&gt; { }

<span class="hljs-keyword">public</span> <span class="hljs-keyword">record</span> <span class="hljs-title class_">GetCardSummaryQuery</span><span class="hljs-params">(String cardNumber)</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">Query</span>&lt;Optional&lt;CardSummary&gt;&gt; { }

<span class="hljs-comment">// kontroler</span>
bus.send(<span class="hljs-keyword">new</span> <span class="hljs-title class_">AddTransactionCommand</span>(…));
bus.ask(<span class="hljs-keyword">new</span> <span class="hljs-title class_">GetCardSummaryQuery</span>(number));
</code></pre>
<ul>
<li>Strona zapisu: agregat, niezmienniki, <code>CardRepository</code> <strong>bez</strong> <code>findAll</code>.</li>
<li>Strona odczytu: projekcje SQL (<code>JdbcClient</code>), liczenie po stronie bazy, bez ładowania agregatu.</li>
<li>Nowy widok (<code>/transactions</code>) bez zmian w modelu zapisu.</li>
</ul>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="36" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch18-cqrs-read-storespan-osobny-magazyn-odczytu"><span class="branch">18-cqrs-read-store</span> Osobny magazyn odczytu</h1>
<div class="flow">
<div class="box">komenda</div><div class="arrow">→</div><div class="box">agregat</div><div class="arrow">→</div>
<div class="box">baza zapisu + outbox</div><div class="arrow">→ po commicie →</div>
<div class="box">projekcja</div><div class="arrow">→</div><div class="box">MongoDB</div><div class="arrow">←</div><div class="box">zapytanie</div>
</div>
<ul>
<li>Dokument <code>card_summaries</code>: saldo policzone z góry, transakcje osadzone.</li>
<li>Projekcja <strong>idempotentna</strong> (deduplikacja po <code>transactionId</code>) i odporna na kolejność (upsert).</li>
<li><strong>Spójność ostateczna</strong>: odczyt tuż po zapisie może być nieaktualny.</li>
<li>Model odczytu można odbudować w każdej chwili (<code>/api/admin/projections/cards/rebuild</code>).</li>
</ul>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="37" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="event-sourcing">Event Sourcing</h1>
<ul>
<li>W CQRS zdarzenia synchronizują bazę zapisu i odczytu.</li>
<li><strong>Event Sourcing</strong> idzie dalej: stan aplikacji odtwarzamy ze zdarzeń w magazynie zwanym <strong>Event Store</strong>.</li>
<li>Zdarzenia są źródłem prawdy, a stan jest pochodną.</li>
</ul>
<div class="columns">
<div>
<p><strong>Zyski</strong></p>
<ul>
<li>pełny audyt i historia</li>
<li>stan na dowolny moment</li>
<li>nowe widoki z całej historii (replay)</li>
</ul>
</div>
<div>
<p><strong>Koszty</strong></p>
<ul>
<li>wersjonowanie zdarzeń (upcasting)</li>
<li>brak „poprawiania” historii</li>
<li>obowiązkowe modele odczytu</li>
<li>RODO a niezmienny log</li>
</ul>
</div>
</div>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="38" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch19-event-sourcingspan-agregat-ze-zdarze%C5%84"><span class="branch">19-event-sourcing</span> Agregat ze zdarzeń</h1>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">registerTransaction</span><span class="hljs-params">(Transaction t)</span> {
  validate(t);
  record(<span class="hljs-keyword">new</span> <span class="hljs-title class_">TransactionRegistered</span>(number, t));
}

<span class="hljs-keyword">private</span> <span class="hljs-type">void</span> <span class="hljs-title function_">apply</span><span class="hljs-params">(CardEvent event)</span> {
  <span class="hljs-keyword">switch</span> (event) {
    <span class="hljs-keyword">case</span> CardIssued i -&gt; { …; balance = zero(currency); }
    <span class="hljs-keyword">case</span> TransactionRegistered r -&gt; { balance = …; }
  }
  version++;
}
</code></pre>
</div>
<div>
<ul>
<li><code>card_events</code>: append-only, PK <code>(stream_id, version)</code> = optimistic concurrency.</li>
<li>Migawki co N zdarzeń (<code>card_snapshots</code>).</li>
<li>Jawny format zapisu <code>CardIssued.v1</code>.</li>
<li>Port <code>CardRepository</code> i use case'y <strong>bez zmian</strong>.</li>
<li>Testy given (zdarzenia) / when (komenda) / then (zdarzenia).</li>
</ul>
</div>
</div>
<p><strong>Ćwiczenie „blog”, część 4:</strong> CQRS i projekcje dla bloga.</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="39" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="wzorzec-saga">Wzorzec Saga</h1>
<ul>
<li>Proces biznesowy przechodzący przez wiele modułów lub usług z osobnymi transakcjami.</li>
<li>Zamiast transakcji rozproszonej: <strong>sekwencja lokalnych transakcji</strong> + <strong>kompensacje</strong>.</li>
<li>Kompensacja jest <strong>semantyczna</strong> (zwrot środków), a nie techniczny rollback.</li>
<li>Kompensujemy ukończone kroki w <strong>odwrotnej kolejności</strong>.</li>
<li>Wymagania praktyczne:
<ul>
<li>idempotentne kroki (at-least-once),</li>
<li>trwały stan procesu (recovery po restarcie),</li>
<li>timeouty i ponawianie,</li>
<li>plan na nieudaną kompensację.</li>
</ul>
</li>
</ul>
<p class="small">blog.couchbase.com/saga-pattern-implement-business-transactions-using-microservices-part-2</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="40" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch20-saga-orchestrationspan-orkiestracja"><span class="branch">20-saga-orchestration</span> Orkiestracja</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>CHARGE_PAYMENT ──ok──► SCHEDULE_SHIPMENT ──ok──► CONFIRMED / COMPLETED
     │ rejected                 │ rejected
     ▼                          ▼
  REJECTED              REFUND_PAYMENT ──► CANCELLED / COMPENSATED
</code></pre>
<ul>
<li><code>OrderSagaOrchestrator</code> wysyła polecenia i reaguje na odpowiedzi.</li>
<li><code>OrderSaga</code>: trwały stan, stos ukończonych kroków, liczba prób.</li>
<li>Stan + polecenie w jednej transakcji (outbox).</li>
<li>Idempotentność: <code>ProcessedMessages</code> w płatnościach, ignorowanie odpowiedzi, na które saga nie czeka.</li>
<li><code>SagaTimeoutScheduler</code>: ponowienie, a po limicie kompensacja.</li>
</ul>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="41" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="span-classbranch21-saga-choreographyspan-choreografia"><span class="branch">21-saga-choreography</span> Choreografia</h1>
<table>
<thead>
<tr>
<th></th>
<th>Orkiestracja</th>
<th>Choreografia</th>
</tr>
</thead>
<tbody>
<tr>
<td>proces</td>
<td>jedna klasa</td>
<td>rozproszony po listenerach</td>
</tr>
<tr>
<td>stan</td>
<td>jawny (<code>order_sagas</code>)</td>
<td>niejawny (statusy + lokalne kopie)</td>
</tr>
<tr>
<td>komunikaty</td>
<td>polecenia + odpowiedzi</td>
<td>fakty</td>
</tr>
<tr>
<td>zależności</td>
<td>orkiestrator zna uczestników</td>
<td>wspólny moduł <code>events</code></td>
</tr>
<tr>
<td>timeouty, monitoring</td>
<td>wbudowane</td>
<td>trzeba dobudować</td>
</tr>
</tbody>
</table>
<ul>
<li>Bez modułu <code>events</code> powstałby cykl <code>orders → payments → shipping → orders</code>.</li>
<li>Kolejność zdarzeń nie jest gwarantowana: ponawianie nieudanych publikacji.</li>
</ul>
<p><strong>Ćwiczenie końcowe:</strong> rozproszona saga provisioningu infrastruktury (5 kroków, 2 serwisy, AC1–AC6).</p>
<footer>Łukasz Andrzejewski · szkolenie Clean Architecture</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="Czysta architektura w praktyce" data-footer="Łukasz Andrzejewski · szkolenie Clean Architecture" data-theme="training" data-lang="pl" lang="pl" data-marpit-pagination="42" style="--paginate:true;--header:Czysta architektura w praktyce;--footer:Łukasz Andrzejewski · szkolenie Clean Architecture;--theme:training;--lang:pl;" data-marpit-pagination-total="43">
<header>Czysta architektura w praktyce</header>
<h1 id="podsumowanie">Podsumowanie</h1>
<ol>
<li>Zacznij od <strong>modelu domeny</strong> i reguły zależności. Framework to szczegół.</li>
<li>Porty i adaptery dają <strong>wymienność</strong> i <strong>szybkie testy</strong>.</li>
<li>Granice pilnuj <strong>automatycznie</strong> (ArchUnit, Modulith, build).</li>
<li><strong>Modularny monolit</strong> to dobry punkt docelowy. Mikroserwis to wymiana adapterów, a nie przepisanie domeny.</li>
<li>CQRS, Event Sourcing i saga rozwiązują konkretne problemy, ale <strong>mają swoją cenę</strong>.</li>
<li>Każda decyzja to kompromis. Zapisuj ją w <strong>ADR</strong>.</li>
</ol>
