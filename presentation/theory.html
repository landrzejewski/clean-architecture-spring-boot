</div>
<div class="takeaway">
<p>Style się nie wykluczają. Często REST lub GraphQL obsługuje klientów zewnętrznych, a gRPC lub messaging służy do komunikacji między usługami.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="47" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="kontrakt-us%C5%82ugi-sieciowej">Kontrakt usługi sieciowej</h1>
<p>Kontrakt sieciowy to opis, dzięki któremu dwie niezależne strony mogą się porozumieć bez znajomości swoich implementacji. Powinien być na tyle precyzyjny, żeby dało się na jego podstawie wygenerować kod albo sprawdzić zgodność implementacji.</p>
<div class="cols">
<div>
<p>Kontrakt opisuje:</p>
<ul>
<li><strong>operacje</strong> lub zasoby udostępniane przez usługę,</li>
<li><strong>typy danych</strong> wejściowych i wyjściowych,</li>
<li><strong>błędy</strong> i ich znaczenie,</li>
<li><strong>sposób dostępu</strong>: transport, adres, zabezpieczenia.</li>
</ul>
<table>
<thead>
<tr>
<th>Styl</th>
<th>Opis kontraktu</th>
</tr>
</thead>
<tbody>
<tr>
<td>SOAP</td>
<td>WSDL i XML Schema</td>
</tr>
<tr>
<td>REST</td>
<td>OpenAPI (dawniej WADL)</td>
</tr>
<tr>
<td>GraphQL</td>
<td>schemat w języku SDL</td>
</tr>
<tr>
<td>gRPC</td>
<td>plik <code>.proto</code></td>
</tr>
<tr>
<td>messaging</td>
<td>AsyncAPI, Schema Registry</td>
</tr>
</tbody>
</table>
</div>
<div>
<div class="card">
<h2 id="code-first">Code-first</h2>
<p>Najpierw powstaje kod, a kontrakt jest z niego <strong>generowany</strong>. Pozwala to szybko zacząć, ale łatwo przypadkiem zmienić kontrakt, np. zmieniając nazwę pola w klasie.</p>
</div>
<div class="card good mt">
<h2 id="contract-first">Contract-first</h2>
<p>Najpierw powstaje kontrakt, a kod (często generowany) jest do niego dopasowywany. Wymaga to dyscypliny, ale kontrakt jest wynikiem świadomej decyzji, a obie strony mogą pracować równolegle.</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="48" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="formaty-danych-i-data-binding">Formaty danych i data binding</h1>
<p>Dane przesyłane przez sieć trzeba zamienić z obiektów na tekst lub bajty, a po drugiej stronie z powrotem na obiekty. Format wpływa na czytelność, rozmiar komunikatów, szybkość przetwarzania i sposób wprowadzania zmian w kontrakcie.</p>
<table>
<thead>
<tr>
<th></th>
<th>XML</th>
<th>JSON</th>
<th>Protobuf</th>
</tr>
</thead>
<tbody>
<tr>
<td>charakter</td>
<td>tekstowy, obszerny, z przestrzeniami nazw</td>
<td>tekstowy, zwięzły, oparty na składni obiektów JavaScript</td>
<td>binarny, zwarty</td>
</tr>
<tr>
<td>schemat</td>
<td>XML Schema (XSD)</td>
<td>JSON Schema, OpenAPI (opcjonalnie)</td>
<td>plik <code>.proto</code> (obowiązkowo)</td>
</tr>
<tr>
<td>data binding w Javie</td>
<td>JAXB, sterowany adnotacjami</td>
<td>Jackson, JSON-B</td>
<td>klasy generowane z kontraktu</td>
</tr>
<tr>
<td>zalety</td>
<td>walidacja, podpisy cyfrowe, dojrzałe standardy</td>
<td>popularność, czytelność, prostota</td>
<td>mały rozmiar, szybkość, kontrolowana ewolucja</td>
</tr>
<tr>
<td>typowe użycie</td>
<td>SOAP, integracje korporacyjne</td>
<td>REST, GraphQL, messaging</td>
<td>gRPC, messaging o dużej przepustowości</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>Data binding</strong>, czyli serializacja i deserializacja, należy do adaptera. Klasy z adnotacjami mapowania to DTO protokołu, a nie model domeny.</li>
<li>Gdy typ nie pasuje do domyślnego mapowania (brak konstruktora bezargumentowego, Value Objects), stosuje się <strong>adaptery typów</strong>, np. <code>XmlAdapter</code> w JAXB.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="49" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="protok%C3%B3%C5%82-to-adapter">Protokół to adapter</h1>
<p>Wszystko, co powiedzieliśmy o portach i adapterach, dotyczy także komunikacji sieciowej. Każdy protokół to osobny adapter tego samego use case'u.</p>
<div class="chain">
<div class="stackcol">
<div class="box">kontroler REST</div>
<div class="box">endpoint SOAP</div>
<div class="box">usługa gRPC</div>
<div class="box">resolver GraphQL</div>
<div class="box">listener komunikatów</div>
</div>
<div class="arr">→</div>
<div class="box soft">komenda<span class="sub">„dodaj transakcję”</span></div>
<div class="arr">→</div>
<div class="box core">port wejściowy<span class="sub"><code>AddTransactionUseCase</code></span></div>
<div class="arr">→</div>
<div class="box core">domena</div>
</div>
<ul>
<li>Adapter tłumaczy <strong>format</strong> (DTO na komendę), <strong>język</strong> (<code>IN</code>/<code>OUT</code> w API na wpływ i płatność w domenie) i <strong>błędy</strong> (wyjątek domenowy na kod HTTP, SOAP Fault albo status gRPC).</li>
<li>Po stronie wyjściowej jest tak samo: klient HTTP, stub gRPC czy producent komunikatów są ukryte za portem aplikacji.</li>
<li>Nowy protokół oznacza nowy adapter, a nie zmianę logiki biznesowej.</li>
</ul>
<div class="takeaway">
<p>Przy każdym protokole warto zapytać: jak wygląda kontrakt, jak zgłasza się błędy i jak wprowadza się zmiany?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="50" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="web-services-za%C5%82o%C5%BCenia-i-standardy">Web services: założenia i standardy</h1>
<p>Web services to funkcjonalność udostępniana przez sieć wraz z zestawem standardów, które pozwalają ją opisać, wyszukać i wywołać niezależnie od platformy.</p>
<div class="cols">
<div>
<p><strong>Założenia</strong></p>
<ul>
<li>komunikacja w środowisku <strong>heterogenicznym</strong>: różne języki, systemy i producenci oprogramowania,</li>
<li>niezależność od platformy sprzętowej, programowej i transportowej,</li>
<li>modularność i możliwość wielokrotnego użycia usług.</li>
</ul>
<p><strong>Typowy scenariusz</strong></p>
<ol>
<li>dostawca publikuje opis usługi (WSDL) w rejestrze,</li>
<li>konsument wyszukuje usługę i pobiera jej opis,</li>
<li>konsument wysyła żądanie w formacie SOAP,</li>
<li>dostawca przetwarza żądanie i odsyła odpowiedź SOAP.</li>
</ol>
</div>
<div>
<div class="stack">
<div class="dark">wyszukiwanie: rejestr UDDI</div>
<div>opis i kontrakt: WSDL i XML Schema</div>
<div>komunikacja: SOAP</div>
<div class="hot">transport: HTTP/HTTPS, JMS, SMTP</div>
</div>
<p class="small mt">Rejestry UDDI nie przyjęły się w praktyce. Plik WSDL przekazuje się zwykle bezpośrednio albo udostępnia pod adresem usługi.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="51" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="wsdl-kontrakt-us%C5%82ugi-w-xml">WSDL: kontrakt usługi w XML</h1>
<p>Dokument WSDL jest kontraktem między dostawcą a konsumentem usługi. Opisuje operacje oraz wszystko, co jest potrzebne do ich wywołania: dane wejściowe, wyniki, błędy i sposób dostępu, bez ujawniania szczegółów implementacji.</p>
<div class="cols-wide">
<div>
<table>
<thead>
<tr>
<th>Element (WSDL 1.1)</th>
<th>Co opisuje</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>definitions</code></td>
<td>element główny i przestrzenie nazw</td>
</tr>
<tr>
<td><code>types</code></td>
<td>typy danych zdefiniowane w XML Schema</td>
</tr>
<tr>
<td><code>message</code></td>
<td>komunikaty przesyłane w ramach usługi</td>
</tr>
<tr>
<td><code>portType</code></td>
<td>operacje usługi, czyli jej interfejs</td>
</tr>
<tr>
<td><code>binding</code></td>
<td>protokół i kodowanie użyte do wywołania operacji</td>
</tr>
<tr>
<td><code>service</code> / <code>port</code></td>
<td>usługę i adres, pod którym jest dostępna</td>
</tr>
</tbody>
</table>
</div>
<div class="card">
<h2 id="cz%C4%99%C5%9B%C4%87-abstrakcyjna-i-konkretna">Część abstrakcyjna i konkretna</h2>
<p>Elementy <code>types</code>, <code>message</code> i <code>portType</code> określają, <strong>co</strong> usługa robi.</p>
<p>Elementy <code>binding</code> i <code>service</code> określają, <strong>jak i gdzie</strong> można ją wywołać.</p>
<p>Ten sam interfejs można więc udostępnić przez różne transporty. To podział na port i adapter, zapisany w XML.</p>
<p class="small">W WSDL 2.0 zmieniono nazwy: <code>portType</code> na <code>interface</code>, a <code>port</code> na <code>endpoint</code>.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="52" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="komunikat-soap">Komunikat SOAP</h1>
<p>SOAP to protokół, który określa format wiadomości wymienianych między dostawcą a konsumentem usługi. Wiadomości zapisuje się w XML i każda ma taką samą strukturę.</p>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">soap:Envelope</span>
    <span class="hljs-attr">xmlns:soap</span>=<span class="hljs-string">&quot;http://www.w3.org/2003/05/soap-envelope&quot;</span>
    <span class="hljs-attr">xmlns:p</span>=<span class="hljs-string">&quot;urn:example:payments:v1&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">soap:Header</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">p:CorrelationId</span>&gt;</span>9c1e…<span class="hljs-tag">&lt;/<span class="hljs-name">p:CorrelationId</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">soap:Header</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">soap:Body</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">p:AddTransaction</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">p:cardNumber</span>&gt;</span>1111222233334444<span class="hljs-tag">&lt;/<span class="hljs-name">p:cardNumber</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">p:amount</span> <span class="hljs-attr">currency</span>=<span class="hljs-string">&quot;PLN&quot;</span>&gt;</span>100.00<span class="hljs-tag">&lt;/<span class="hljs-name">p:amount</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">p:type</span>&gt;</span>PAYMENT<span class="hljs-tag">&lt;/<span class="hljs-name">p:type</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">p:AddTransaction</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">soap:Body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">soap:Envelope</span>&gt;</span>
</code></pre>
</div>
<div>
<ul>
<li><strong>Envelope</strong> to element główny, który określa wersję protokołu.</li>
<li><strong>Header</strong> zawiera opcjonalne metadane: dane zabezpieczeń, identyfikator korelacji, informacje o transakcji lub routingu.</li>
<li><strong>Body</strong> zawiera właściwą treść: wywołanie operacji albo jej wynik.</li>
<li><strong>Fault</strong> to standardowy sposób zgłaszania błędu. Wskazuje, czy błąd leży po stronie nadawcy, czy odbiorcy, i zawiera szczegóły.</li>
</ul>
<p>SOAP jest protokołem <strong>operacji</strong>. Nazwa wywoływanej operacji znajduje się w treści wiadomości, a HTTP służy wyłącznie do jej przesłania (zwykle metodą POST na jeden adres).</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="53" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="po%C5%9Brednicy-rozszerzenia-i-dane-binarne">Pośrednicy, rozszerzenia i dane binarne</h1>
<p>Wiadomość SOAP zawiera wszystkie potrzebne informacje, więc w drodze do odbiorcy może przechodzić przez pośredników. Jest to źródłem zarówno siły SOAP w środowiskach korporacyjnych, jak i jego złożoności.</p>
<div class="cols">
<div>
<p><strong>Pośrednicy i handlery</strong></p>
<ul>
<li>nadawca i odbiorca nie są ze sobą bezpośrednio powiązani,</li>
<li>po drodze wiadomość może przetworzyć dowolna liczba pośredników, którzy odczytują i modyfikują nagłówki,</li>
<li>pośrednicy weryfikują podpisy i uprawnienia, eliminują powtórzone żądania, pilnują kolejności i prowadzą audyt,</li>
<li>łańcuch handlerów działa podobnie jak aspekty, tylko na poziomie wiadomości.</li>
</ul>
<p>Rozszerzenia z rodziny WS-*: <strong>WS-Security</strong>, WS-Addressing, WS-ReliableMessaging, WS-AtomicTransaction.</p>
</div>
<div>
<p><strong>Przesyłanie danych binarnych</strong> (obrazów, dokumentów, nagrań)</p>
<table>
<thead>
<tr>
<th>Sposób</th>
<th>Cechy</th>
</tr>
</thead>
<tbody>
<tr>
<td>base64 w treści</td>
<td>proste, ale zwiększa rozmiar o około jedną trzecią i wymaga kodowania po obu stronach; nadaje się tylko do małych danych</td>
</tr>
<tr>
<td>SwA</td>
<td>załączniki MIME przesyłane razem z wiadomością</td>
</tr>
<tr>
<td>DIME</td>
<td>format opracowany przez Microsoft, dziś nieużywany</td>
</tr>
<tr>
<td><strong>MTOM / XOP</strong></td>
<td>dane binarne poza dokumentem XML, w treści tylko odnośnik; obecny standard</td>
</tr>
</tbody>
</table>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="54" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="soap-w-javie-jax-ws">SOAP w Javie: JAX-WS</h1>
<p>JAX-WS (Java API for XML Web Services, obecnie Jakarta XML Web Services) zastąpiło starsze JAX-RPC. Pozwala tworzyć i wywoływać usługi SOAP tak, jakby były zwykłymi obiektami Javy.</p>
<div class="cols">
<div>
<ul>
<li>Klient i usługa korzystają z obiektów pośredniczących generowanych na podstawie WSDL: <strong>stub</strong> po stronie klienta i <strong>tie</strong> po stronie usługi.</li>
<li><strong>JAX-WS runtime</strong> zamienia wywołania metod na komunikaty SOAP i odwrotnie.</li>
<li>Treść komunikatów mapuje na obiekty <strong>JAXB</strong>. Dane binarne można przesyłać przez <strong>MTOM</strong> i określić próg rozmiaru, od którego trafiają do załącznika.</li>
<li>JAX-WS obsługuje oba podejścia: <strong>code-first</strong> (z adnotacji powstaje WSDL) i <strong>contract-first</strong> (z WSDL powstają klasy).</li>
</ul>
</div>
<div>
<table>
<thead>
<tr>
<th>Adnotacja</th>
<th>Element WSDL</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>@WebService</code></td>
<td><code>portType</code>, <code>service</code>, <code>port</code></td>
</tr>
<tr>
<td><code>@WebMethod</code></td>
<td>operacja</td>
</tr>
<tr>
<td><code>@WebParam</code>, <code>@WebResult</code></td>
<td>części komunikatów</td>
</tr>
<tr>
<td><code>@Oneway</code></td>
<td>operacja bez odpowiedzi</td>
</tr>
</tbody>
</table>
<div class="grid3">
<div class="box soft">klient</div><div></div><div class="box soft">usługa</div>
<div class="box">stub</div><div></div><div class="box">tie</div>
<div class="box dash">JAX-WS runtime</div><div class="arr">⇄ SOAP ⇄</div><div class="box dash">JAX-WS runtime</div>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="55" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="rest-styl-architektoniczny-a-nie-protok%C3%B3%C5%82">REST: styl architektoniczny, a nie protokół</h1>
<p>REST (Representational State Transfer) opisał Roy Fielding w rozprawie doktorskiej z 2000 roku. Wyjaśnił w niej, dlaczego sieć WWW tak dobrze się skaluje, i sformułował zestaw ograniczeń (constraints), które można zastosować przy projektowaniu API.</p>
<table>
<thead>
<tr>
<th>Ograniczenie</th>
<th>Na czym polega i co daje</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>client–server</strong></td>
<td>klient nie zna sposobu przechowywania danych ani logiki serwera, a serwer nie zna sposobu prezentacji; obie strony rozwijają się niezależnie</td>
</tr>
<tr>
<td><strong>stateless</strong></td>
<td>każde żądanie zawiera wszystkie informacje potrzebne do jego obsługi, więc może je obsłużyć dowolna instancja serwera</td>
</tr>
<tr>
<td><strong>cacheable</strong></td>
<td>odpowiedź określa, czy i jak długo można ją przechowywać, co zmniejsza obciążenie serwera</td>
</tr>
<tr>
<td><strong>uniform interface</strong></td>
<td>wszystkie zasoby obsługuje się w ten sam sposób, co upraszcza komunikację i zmniejsza powiązania</td>
</tr>
<tr>
<td><strong>layered system</strong></td>
<td>pośrednicy (proxy, gateway, CDN) są niewidoczni dla klienta</td>
</tr>
<tr>
<td>code on demand (opcjonalne)</td>
<td>serwer może przesłać klientowi kod do wykonania</td>
</tr>
</tbody>
</table>
<div class="takeaway">
<p>REST nie wymaga konkretnego protokołu, ale w praktyce prawie zawsze korzysta z HTTP lub HTTPS.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="56" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="zasoby-i-uniform-interface">Zasoby i uniform interface</h1>
<p>Podstawowym pojęciem w REST jest zasób, czyli wszystko, co warto nazwać i udostępnić: karta, transakcja, zamówienie. Klient nie wywołuje operacji, tylko odczytuje i zmienia stan zasobów za pomocą stałego zestawu metod.</p>
<div class="cols">
<div>
<p><strong>Zasób</strong></p>
<ul>
<li>ma unikalny identyfikator, czyli <strong>URI</strong>,</li>
<li>jest niezależny od <strong>reprezentacji</strong>: tę samą kartę można przesłać jako JSON, XML lub YAML,</li>
<li>jego stan zmienia się wyłącznie za pomocą predefiniowanych metod.</li>
</ul>
<p><strong>Elementy uniform interface</strong></p>
<ol>
<li>identyfikacja zasobów za pomocą URI,</li>
<li>zmiana zasobów przez przesyłanie ich reprezentacji,</li>
<li>komunikaty, które same się opisują,</li>
<li>hipermedia jako mechanizm sterowania stanem aplikacji (HATEOAS).</li>
</ol>
</div>
<div>
<p><strong>Use case'y wyrażone jako zasoby</strong></p>
<table>
<thead>
<tr>
<th>Intencja</th>
<th>Żądanie</th>
</tr>
</thead>
<tbody>
<tr>
<td>wydaj kartę</td>
<td><code>POST /cards</code></td>
</tr>
<tr>
<td>dodaj transakcję</td>
<td><code>POST /cards/{n}/transactions</code></td>
</tr>
<tr>
<td>pokaż kartę</td>
<td><code>GET /cards/{n}</code></td>
</tr>
<tr>
<td>historia transakcji</td>
<td><code>GET /cards/{n}/transactions?page=0</code></td>
</tr>
<tr>
<td>anuluj zamówienie</td>
<td><code>POST /orders/{id}/cancellation</code></td>
</tr>
</tbody>
</table>
<p class="small">Nie każda intencja to operacja CRUD. Proces, np. anulowanie zamówienia, również może być zasobem z własnym stanem.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="57" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="hateoas-i-richardson-maturity-model">HATEOAS i Richardson Maturity Model</h1>
<p>HATEOAS (Hypermedia as the Engine of Application State) oznacza, że odpowiedź zawiera nie tylko stan zasobu, ale też odnośniki do możliwych dalszych działań. Klient porusza się po API podobnie jak użytkownik po stronach WWW.</p>
<div class="cols">
<div>
<ul>
<li>Klient przekazuje dane w treści żądania, parametrach, nagłówkach i URI.</li>
<li>Serwer zwraca stan zasobu w treści, kodzie odpowiedzi i nagłówkach, a do tego <strong>linki</strong> do dostępnych akcji, np. „zapłać” albo „anuluj”.</li>
<li>Klient nie musi znać reguł biznesowych, np. tego, kiedy zamówienie można opłacić. Wystarczy, że sprawdzi, czy odpowiedź zawiera odpowiedni link.</li>
</ul>
</div>
<div>
<p><strong>Richardson Maturity Model</strong></p>
<table>
<thead>
<tr>
<th>Poziom</th>
<th>Cecha API</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>jeden adres i jedna metoda, czyli zdalne wywołania przez HTTP, jak w SOAP</td>
</tr>
<tr>
<td>1</td>
<td>osobne zasoby z własnymi URI</td>
</tr>
<tr>
<td>2</td>
<td>metody i kody statusu HTTP używane zgodnie z przeznaczeniem</td>
</tr>
<tr>
<td>3</td>
<td>hipermedia określają dostępne przejścia między stanami</td>
</tr>
</tbody>
</table>
<p class="small">Większość API określanych jako REST w praktyce kończy na poziomie 2.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="58" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="bezstanowo%C5%9B%C4%87-i-cache">Bezstanowość i cache</h1>
<p>Te dwa ograniczenia REST mają największy wpływ na skalowalność. Razem pozwalają obsłużyć duży ruch przy stosunkowo prostej infrastrukturze.</p>
<div class="cols">
<div>
<p><strong>Bezstanowość</strong></p>
<ul>
<li>serwer nie przechowuje stanu sesji w pamięci; stan jest po stronie klienta albo zapisany w zasobach,</li>
<li>każde żądanie zawiera wszystko, co jest potrzebne do jego obsługi,</li>
<li>instancje serwera są wymienne, więc skalowanie poziome polega na dodaniu kolejnych instancji,</li>
<li>dane uwierzytelniające, np. token, są przesyłane z każdym żądaniem.</li>
</ul>
</div>
<div>
<p><strong>Cache i żądania warunkowe</strong></p>
<ul>
<li>nagłówek <code>Cache-Control</code> określa, czy i jak długo można przechowywać odpowiedź,</li>
<li><code>ETag</code> oznacza wersję reprezentacji. Klient przesyła ją w nagłówku <code>If-None-Match</code>, a jeśli zasób się nie zmienił, dostaje <code>304 Not Modified</code> bez treści,</li>
<li><code>If-Match</code> przy zapisie realizuje <strong>optimistic locking</strong> na poziomie HTTP: jeśli wersja się zmieniła, serwer odpowiada <code>412 Precondition Failed</code>.</li>
</ul>
</div>
</div>
<div class="takeaway">
<p><code>ETag</code> może odpowiadać numerowi wersji agregatu w bazie danych. Konflikt równoległych zmian staje się wtedy jawną częścią kontraktu API.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="59" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="protok%C3%B3%C5%82-http">Protokół HTTP</h1>
<p>HTTP to synchroniczny i bezstanowy protokół typu request–response. Klient i serwer wymieniają komunikaty, które w wersji HTTP/1.1 mają postać tekstową.</p>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-http"><span class="hljs-keyword">POST</span> <span class="hljs-string">/api/cards/1111222233334444/transactions</span> <span class="hljs-meta">HTTP/1.1</span>
<span class="hljs-attribute">Host</span><span class="hljs-punctuation">: </span>payments.example
<span class="hljs-attribute">Content-Type</span><span class="hljs-punctuation">: </span>application/json
<span class="hljs-attribute">Accept</span><span class="hljs-punctuation">: </span>application/json, application/problem+json

<span class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;OUT&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;amount&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">100</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;currencyCode&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;PLN&quot;</span><span class="hljs-punctuation">}</span>
</span></code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-http"><span class="hljs-meta">HTTP/1.1</span> <span class="hljs-number">201</span> Created
<span class="hljs-attribute">Location</span><span class="hljs-punctuation">: </span>/api/cards/1111222233334444/transactions/7f3c…
<span class="hljs-attribute">Content-Type</span><span class="hljs-punctuation">: </span>application/json

<span class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;7f3c…&quot;</span><span class="hljs-punctuation">}</span>
</span></code></pre>
</div>
<div>
<p>Każdy komunikat składa się z trzech części:</p>
<ul>
<li><strong>linii początkowej</strong>: w żądaniu jest to metoda i URI, a w odpowiedzi kod statusu z opisem,</li>
<li><strong>nagłówków</strong>, czyli metadanych opisujących treść i komunikację (typ, rozmiar, kodowanie, język, cache, autoryzacja),</li>
<li><strong>treści</strong> oddzielonej od nagłówków pustą linią.</li>
</ul>
<p>HTTP/2 i HTTP/3 zachowują tę samą semantykę (metody, nagłówki, kody statusu), ale zmieniają sposób przesyłania danych: używają binarnych ramek i wielu równoległych strumieni w jednym połączeniu.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="60" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="metody-http">Metody HTTP</h1>
<p>Metoda określa, co klient chce zrobić z zasobem. Dla niezawodności komunikacji najważniejsze są dwie cechy metod: bezpieczeństwo i idempotentność.</p>
<table>
<thead>
<tr>
<th>Metoda</th>
<th>Przeznaczenie</th>
<th>Bezpieczna</th>
<th>Idempotentna</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>GET</code></td>
<td>pobranie reprezentacji zasobu</td>
<td>tak</td>
<td>tak</td>
</tr>
<tr>
<td><code>HEAD</code></td>
<td>jak <code>GET</code>, ale bez treści odpowiedzi (np. sprawdzenie, czy zasób istnieje)</td>
<td>tak</td>
<td>tak</td>
</tr>
<tr>
<td><code>OPTIONS</code></td>
<td>sprawdzenie, jakie metody i opcje obsługuje zasób</td>
<td>tak</td>
<td>tak</td>
</tr>
<tr>
<td><code>PUT</code></td>
<td>zapisanie pełnej reprezentacji pod wskazanym URI, czyli utworzenie lub zastąpienie zasobu</td>
<td>nie</td>
<td>tak</td>
</tr>
<tr>
<td><code>DELETE</code></td>
<td>usunięcie zasobu</td>
<td>nie</td>
<td>tak</td>
</tr>
<tr>
<td><code>POST</code></td>
<td>przetworzenie danych przez zasób, np. utworzenie zasobu podrzędnego</td>
<td>nie</td>
<td><strong>nie</strong></td>
</tr>
<tr>
<td><code>PATCH</code></td>
<td>zmiana części zasobu</td>
<td>nie</td>
<td><strong>nie</strong> (nie jest to gwarantowane)</td>
</tr>
</tbody>
</table>
<ul>
<li>Metoda <strong>bezpieczna</strong> nie zmienia stanu serwera. Metoda <strong>idempotentna</strong> daje ten sam efekt niezależnie od tego, ile razy zostanie wykonana.</li>
<li>Od idempotentności zależy, czy klient może bezpiecznie ponowić żądanie po timeoucie. W przypadku <code>POST</code> stosuje się <strong>klucz idempotentności</strong> (nagłówek <code>Idempotency-Key</code>), żeby ponowna próba nie utworzyła drugiej płatności.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="61" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="kody-statusu-jako-cz%C4%99%C5%9B%C4%87-kontraktu">Kody statusu jako część kontraktu</h1>
<p>Kod statusu informuje klienta o wyniku i podpowiada, jak zareagować: wyświetlić wynik, poprawić żądanie, poinformować użytkownika albo spróbować ponownie.</p>
<div class="cols">
<div>
<table>
<thead>
<tr>
<th>Kod</th>
<th>Znaczenie</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>200 OK</code></td>
<td>sukces, odpowiedź zawiera wynik</td>
</tr>
<tr>
<td><code>201 Created</code></td>
<td>utworzono zasób, jego adres jest w nagłówku <code>Location</code></td>
</tr>
<tr>
<td><code>202 Accepted</code></td>
<td>żądanie przyjęto do przetworzenia asynchronicznego</td>
</tr>
<tr>
<td><code>204 No Content</code></td>
<td>sukces, odpowiedź nie ma treści</td>
</tr>
<tr>
<td><code>304 Not Modified</code></td>
<td>kopia w cache klienta jest aktualna</td>
</tr>
</tbody>
</table>
</div>
<div>
<table>
<thead>
<tr>
<th>Kod</th>
<th>Znaczenie</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>400 Bad Request</code></td>
<td>żądanie ma niepoprawny format</td>
</tr>
<tr>
<td><code>404 Not Found</code></td>
<td>zasób nie istnieje</td>
</tr>
<tr>
<td><code>406</code> / <code>415</code></td>
<td>serwer nie obsługuje żądanego formatu odpowiedzi / formatu żądania</td>
</tr>
<tr>
<td><code>409</code> / <code>412</code></td>
<td>konflikt stanu lub wersji zasobu</td>
</tr>
<tr>
<td><code>422 Unprocessable Content</code></td>
<td>żądanie jest poprawne, ale narusza regułę biznesową</td>
</tr>
<tr>
<td><code>503</code> / <code>504</code></td>
<td>zależność jest niedostępna / przekroczono czas oczekiwania</td>
</tr>
</tbody>
</table>
</div>
</div>
<div class="takeaway">
<p>Trzy poziomy walidacji przekładają się bezpośrednio na kody statusu: błąd formatu to 400, brak agregatu to 404, a naruszenie reguły biznesowej to 422. O wyborze kodu decyduje adapter, a nie domena.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="62" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="content-negotiation-i-problem-details">Content negotiation i Problem Details</h1>
<p>Jedna usługa obsługuje klientów, którzy oczekują różnych formatów i języków. HTTP pozwala to uzgodnić, a dla odpowiedzi z błędami istnieje standardowy format.</p>
<div class="cols">
<div>
<p><strong>Content negotiation</strong></p>
<table>
<thead>
<tr>
<th>Nagłówek</th>
<th>Co uzgadnia</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Accept</code>, <code>Content-Type</code></td>
<td>format treści: JSON, XML, CSV</td>
</tr>
<tr>
<td><code>Accept-Language</code></td>
<td>język, np. komunikatów o błędach</td>
</tr>
<tr>
<td><code>Accept-Encoding</code></td>
<td>kompresję: gzip, br</td>
</tr>
</tbody>
</table>
<p>Serwer wybiera format preferowany przez klienta. Jeśli nie obsługuje żadnego z nich, odpowiada <code>406 Not Acceptable</code>.</p>
</div>
<div>
<p><strong>Problem Details (RFC 9457)</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-http"><span class="hljs-meta">HTTP/1.1</span> <span class="hljs-number">422</span> Unprocessable Content
<span class="hljs-attribute">Content-Type</span><span class="hljs-punctuation">: </span>application/problem+json
<span class="hljs-attribute">Content-Language</span><span class="hljs-punctuation">: </span>pl

<span class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;https://payments.example/problems/insufficient-funds&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;title&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Brak wystarczających środków&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;status&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">422</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;detail&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Saldo karty jest niższe niż kwota płatności&quot;</span>
<span class="hljs-punctuation">}</span>
</span></code></pre>
<p>Wspólny format błędów pozwala klientom obsługiwać je jednakowo we wszystkich usługach.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="63" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="dobre-praktyki-projektowania-rest">Dobre praktyki projektowania REST</h1>
<p>Ograniczenia Fieldinga definiują, czym jest REST. Praktyka dodała do nich konwencje, dzięki którym API jest przewidywalne i łatwe w użyciu.</p>
<div class="cols">
<div>
<p><strong>Zasoby i adresy</strong></p>
<ul>
<li>identyfikatory są krótkie, zrozumiałe i osadzone w kontekście,</li>
<li>składają się z <strong>rzeczowników</strong>, bo rodzaj operacji określa metoda HTTP,</li>
<li>wskazują kolekcję albo jej element; nie miesza się liczby pojedynczej i mnogiej,</li>
<li>relacje między zasobami wyraża się jako <strong>podzasoby</strong> (sub-resources),</li>
<li>filtrowanie, sortowanie, paginację i grupowanie obsługuje się <strong>parametrami zapytania</strong> (query params),</li>
<li>zasoby mają odpowiednią <strong>granularność</strong>: nie są ani jednym „workiem na wszystko”, ani setkami drobnych elementów.</li>
</ul>
</div>
<div>
<p><strong>Komunikacja</strong></p>
<ul>
<li>metody HTTP są używane zgodnie z przeznaczeniem, a kody statusu odpowiadają wynikowi,</li>
<li>format danych jest jawnie podany w nagłówkach, a domyślnym formatem jest JSON,</li>
<li>odpowiedź z błędem zawiera właściwy kod statusu oraz treść z kodem błędu i opisem,</li>
<li>poprawne odpowiedzi na <code>GET</code> można cache'ować,</li>
<li>API <strong>wersjonuje się od pierwszego dnia</strong>,</li>
<li>HATEOAS stosuje się tam, gdzie klient powinien sam odkrywać dostępne akcje.</li>
</ul>
<p class="small">Jeśli infrastruktura przepuszcza tylko metody <code>GET</code> i <code>POST</code>, stosuje się nagłówek <code>X-HTTP-Method-Override</code>.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="64" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="rest-w-javie-i-por%C3%B3wnanie-z-soap">REST w Javie i porównanie z SOAP</h1>
<p>W Javie usługi REST tworzy się deklaratywnie: adnotacje łączą metody zwykłych klas z adresami i metodami HTTP, a resztą zajmuje się framework.</p>
<div class="cols">
<div>
<ul>
<li><strong>JAX-RS</strong> (Jakarta RESTful Web Services) wiąże metody z URI, wstrzykuje dane żądania (parametry ścieżki, parametry zapytania, nagłówki), konwertuje treść na obiekty, mapuje wyjątki na odpowiedzi (<code>ExceptionMapper</code>) i obsługuje content negotiation. Najpopularniejsze implementacje to Jersey i RESTEasy.</li>
<li><strong>Spring MVC</strong> i Spring WebFlux oferują podobny model w ekosystemie Springa.</li>
<li>Do opisu API służył kiedyś <strong>WADL</strong> (dialekt XML opisujący zasoby i relacje). Dziś używa się <strong>OpenAPI</strong>, generowanego z kodu albo tworzonego przed implementacją.</li>
</ul>
</div>
<div>
<table>
<thead>
<tr>
<th></th>
<th>SOAP</th>
<th>REST</th>
</tr>
</thead>
<tbody>
<tr>
<td>model</td>
<td>operacje</td>
<td>zasoby</td>
</tr>
<tr>
<td>kontrakt</td>
<td>formalny, obowiązkowy</td>
<td>opcjonalny</td>
</tr>
<tr>
<td>format</td>
<td>XML</td>
<td>dowolny, zwykle JSON</td>
</tr>
<tr>
<td>stan</td>
<td>możliwa komunikacja stanowa</td>
<td>bezstanowy</td>
</tr>
<tr>
<td>cache HTTP</td>
<td>nie</td>
<td>tak</td>
</tr>
<tr>
<td>mocne strony</td>
<td>obsługa starszych systemów, formalny kontrakt, standardy WS-*, narzędzia</td>
<td>prostota, skalowalność, wydajność, różne formaty, popularność</td>
</tr>
</tbody>
</table>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="65" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="graphql-klient-decyduje-o-kszta%C5%82cie-odpowiedzi">GraphQL: klient decyduje o kształcie odpowiedzi</h1>
<p>GraphQL powstał w firmie Facebook w 2012 roku, a w 2015 roku został udostępniony publicznie. Był odpowiedzią na ograniczenia API opartych na zasobach w aplikacjach z wieloma ekranami i różnymi klientami. W GraphQL to klient określa, jakie dane chce otrzymać.</p>
<div class="cols">
<div>
<p><strong>Problemy, które rozwiązuje</strong></p>
<ul>
<li><strong>over-fetching</strong>: endpoint zwraca więcej pól, niż potrzebuje dany ekran,</li>
<li><strong>under-fetching</strong>: jeden ekran wymaga kilku wywołań, np. najpierw karty, potem transakcji, a na końcu kursów walut,</li>
<li><strong>wielu klientów</strong> (web, aplikacje mobilne, partnerzy) o różnych potrzebach korzysta z jednego backendu.</li>
</ul>
</div>
<div>
<p><strong>Założenia</strong></p>
<ul>
<li>jeden endpoint obsługuje wszystkie operacje,</li>
<li>serwer udostępnia spójny <strong>schemat</strong> opisujący typy i relacje między nimi,</li>
<li>klient wskazuje pola, a serwer zwraca dokładnie te pola,</li>
<li>powiązane dane pobiera się w <strong>jednym</strong> wywołaniu.</li>
</ul>
</div>
</div>
<div class="chain">
<div class="box soft">klient<span class="sub">karta, saldo i trzy ostatnie transakcje</span></div>
<div class="arr">→</div>
<div class="box core">serwer GraphQL<span class="sub">jedno żądanie</span></div>
<div class="arr">→</div>
<div class="stackcol"><div class="box">model odczytu kart</div><div class="box">kursy walut</div></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="66" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="schemat-graphql-jako-kontrakt">Schemat GraphQL jako kontrakt</h1>
<p>Schemat opisuje wszystkie typy, pola i relacje oraz definiuje dostępne operacje: zapytania, mutacje i subskrypcje. Jest kontraktem między klientem a serwerem.</p>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-graphql"><span class="hljs-keyword">type</span> Card <span class="hljs-punctuation">{</span>
  <span class="hljs-symbol">number</span><span class="hljs-punctuation">:</span> ID<span class="hljs-punctuation">!</span>
  <span class="hljs-symbol">balance</span><span class="hljs-punctuation">:</span> Money<span class="hljs-punctuation">!</span>
  transactions<span class="hljs-punctuation">(</span><span class="hljs-symbol">last</span><span class="hljs-punctuation">:</span> Int <span class="hljs-punctuation">=</span> <span class="hljs-number">10</span><span class="hljs-punctuation">)</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span>Transaction<span class="hljs-punctuation">!</span><span class="hljs-punctuation">]</span><span class="hljs-punctuation">!</span>
<span class="hljs-punctuation">}</span>

<span class="hljs-keyword">type</span> <span class="hljs-keyword">Query</span> <span class="hljs-punctuation">{</span> card<span class="hljs-punctuation">(</span><span class="hljs-symbol">number</span><span class="hljs-punctuation">:</span> ID<span class="hljs-punctuation">!</span><span class="hljs-punctuation">)</span><span class="hljs-punctuation">:</span> Card <span class="hljs-punctuation">}</span>

<span class="hljs-keyword">type</span> <span class="hljs-keyword">Mutation</span> <span class="hljs-punctuation">{</span>
  addTransaction<span class="hljs-punctuation">(</span><span class="hljs-symbol">input</span><span class="hljs-punctuation">:</span> AddTransactionInput<span class="hljs-punctuation">!</span><span class="hljs-punctuation">)</span><span class="hljs-punctuation">:</span> AddTransactionResult<span class="hljs-punctuation">!</span>
<span class="hljs-punctuation">}</span>

<span class="hljs-keyword">union</span> AddTransactionResult <span class="hljs-punctuation">=</span> TransactionAdded <span class="hljs-punctuation">|</span> InsufficientFunds

<span class="hljs-keyword">type</span> <span class="hljs-keyword">Subscription</span> <span class="hljs-punctuation">{</span> transactionRegistered<span class="hljs-punctuation">(</span><span class="hljs-symbol">card</span><span class="hljs-punctuation">:</span> ID<span class="hljs-punctuation">!</span><span class="hljs-punctuation">)</span><span class="hljs-punctuation">:</span> Transaction<span class="hljs-punctuation">!</span> <span class="hljs-punctuation">}</span>
</code></pre>
</div>
<div>
<ul>
<li><strong>System typów</strong> obejmuje typy skalarne (także własne, np. kwotę), typy obiektowe, enumy, listy, typy non-null (<code>!</code>), typy wejściowe (input), interfejsy i unie (union).</li>
<li>Dzięki typom schemat precyzyjnie opisuje strukturę domeny, a błędy w zapytaniach są wykrywane, zanim zapytanie zostanie wykonane.</li>
<li>Serwer <strong>sprawdza każde zapytanie względem schematu</strong> przed jego realizacją.</li>
<li>Unia wyników pozwala opisać błąd biznesowy, np. brak środków, jako zwykły element kontraktu, a nie wyjątek.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="67" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="query-mutation-i-subscription">Query, Mutation i Subscription</h1>
<p>GraphQL rozróżnia trzy rodzaje operacji. Podział na odczyt i zapis jest jawnie zapisany w schemacie, podobnie jak w zasadzie CQS.</p>
<div class="cols-3">
<div class="card">
<h2 id="query">Query</h2>
<p>Odczyt danych. Klient wskazuje potrzebne pola, a serwer zwraca tylko je, co ogranicza ilość przesyłanych danych.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-graphql"><span class="hljs-punctuation">{</span> card<span class="hljs-punctuation">(</span><span class="hljs-symbol">number</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;1111…&quot;</span><span class="hljs-punctuation">)</span> <span class="hljs-punctuation">{</span>
    balance <span class="hljs-punctuation">{</span> amount currency <span class="hljs-punctuation">}</span>
    transactions<span class="hljs-punctuation">(</span><span class="hljs-symbol">last</span><span class="hljs-punctuation">:</span> <span class="hljs-number">3</span><span class="hljs-punctuation">)</span> <span class="hljs-punctuation">{</span>
      amount <span class="hljs-keyword">type</span> <span class="hljs-punctuation">}</span> <span class="hljs-punctuation">}</span> <span class="hljs-punctuation">}</span>
</code></pre>
</div>
<div class="card warm">
<h2 id="mutation">Mutation</h2>
<p>Tworzenie, zmiana i usuwanie danych, czyli operacje, które zmieniają stan systemu.</p>
<p>Mutacja może zwrócić zmienione dane, dzięki czemu klient od razu zna nowy stan.</p>
<p>Za poprawność i spójność zmiany odpowiada serwer, a konkretnie use case i model domeny.</p>
</div>
<div class="card good">
<h2 id="subscription">Subscription</h2>
<p>Serwer <strong>wysyła</strong> dane do klienta, gdy wystąpi określone zdarzenie. Zwykle odbywa się to przez WebSocket.</p>
<p>Klient nie musi cyklicznie odpytywać serwera (polling), a aplikacja może na bieżąco reagować na zmiany.</p>
<p>Subskrypcje dobrze współpracują z Domain Events.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="68" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="graphql-po-stronie-serwera">GraphQL po stronie serwera</h1>
<p>Z zewnątrz GraphQL to jeden endpoint, ale wewnątrz każde pole schematu ma własną funkcję, która dostarcza jego wartość. Taki model dobrze pasuje do architektury portów i adapterów.</p>
<div class="cols">
<div>
<ul>
<li>Funkcja dostarczająca wartość pola to <strong>resolver</strong>.</li>
<li>Resolver mutacji jest <strong>adapterem wejściowym</strong>: zamienia dane wejściowe na komendę i wywołuje port use case'u.</li>
<li>Resolvery zapytań mogą korzystać z <strong>read modelu</strong>, czyli modelu przygotowanego specjalnie do odczytu.</li>
<li><strong>Introspekcja</strong> pozwala klientowi pobrać opis schematu. Na jej podstawie działają generatory dokumentacji, eksploratory API, generatory typów i podpowiedzi w IDE.</li>
<li><strong>Federacja</strong> pozwala połączyć schematy wielu usług w jeden graf.</li>
</ul>
</div>
<div class="card bad">
<h2 id="problem-n1-przenosi-si%C4%99-na-serwer">Problem N+1 przenosi się na serwer</h2>
<p>Klient wysyła jedno żądanie, ale naiwnie napisane resolvery wykonują jedno zapytanie do bazy o listę kart i osobne zapytanie o transakcje każdej karty.</p>
<p>Rozwiązaniem jest <strong>batching</strong>: resolvery zbierają potrzebne identyfikatory, a dane są pobierane jednym zapytaniem i zapamiętywane na czas obsługi żądania (wzorzec DataLoader).</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="69" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="graphql-zalety-i-koszty">GraphQL: zalety i koszty</h1>
<p>GraphQL rozwiązuje rzeczywiste problemy API opartych na zasobach, ale zwiększa złożoność po stronie serwera i utrudnia niektóre rzeczy, które w REST są proste.</p>
<div class="cols">
<div>
<p><strong>Zalety w porównaniu z REST</strong></p>
<ul class="pros">
<li>jeden endpoint zamiast wielu</li>
<li>powiązane dane w jednym wywołaniu, bez wielu round-tripów do serwera</li>
<li>silnie typowany schemat, który jest jednocześnie dokumentacją API</li>
<li>klient określa kształt odpowiedzi, więc nie pobiera zbędnych danych</li>
<li>zmiany bez numerów wersji: nowe pola się dodaje, a stare oznacza dyrektywą <code>@deprecated</code></li>
</ul>
</div>
<div>
<p><strong>Koszty</strong></p>
<ul class="cons">
<li>trudniej korzystać z cache HTTP, bo zapytania zwykle wysyła się metodą POST na jeden adres</li>
<li>dowolność zapytań wymaga limitów głębokości i kosztu, inaczej łatwo przeciążyć serwer</li>
<li>uprawnienia trzeba sprawdzać na poziomie pojedynczych pól</li>
<li>błędy często są zwracane w odpowiedzi 200, w tablicy <code>errors</code></li>
<li>serwer jest bardziej złożony</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>GraphQL najlepiej sprawdza się jako API dla interfejsów użytkownika (Backend for Frontend, BFF), gdy wielu klientów potrzebuje różnych widoków tych samych danych.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="70" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="grpc-zdalne-wywo%C5%82ania-w-nowoczesnym-wydaniu">gRPC: zdalne wywołania w nowoczesnym wydaniu</h1>
<p>gRPC wywodzi się z wewnętrznego systemu RPC firmy Google. W 2015 roku został udostępniony jako open source, a dziś rozwija się w ramach CNCF. Wraca do stylu operacji znanego z RPC i SOAP, ale stawia na wydajność, streaming i obsługę wielu języków.</p>
<div class="cols">
<div>
<ul>
<li>Działa w podejściu <strong>contract-first</strong>: interfejs usługi definiuje się w pliku <code>.proto</code>.</li>
<li>Na podstawie kontraktu generuje się kod klienta i serwera w wielu językach programowania.</li>
<li>Dane są przesyłane w binarnym formacie <strong>Protocol Buffers</strong>.</li>
<li>Jako transport wykorzystuje <strong>HTTP/2</strong>.</li>
</ul>
</div>
<div>
<p><strong>Co daje HTTP/2</strong></p>
<ul>
<li><strong>multipleksowanie</strong>: wiele równoległych strumieni w jednym połączeniu TCP, bez czekania na zakończenie wcześniejszych żądań,</li>
<li><strong>kompresję nagłówków</strong>, która zmniejsza narzut każdego wywołania,</li>
<li>binarne ramki i kontrolę przepływu,</li>
<li>długotrwałe strumienie w obu kierunkach, które umożliwiają streaming dużych lub wieloczęściowych danych.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="71" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="plik-proto-jako-kontrakt">Plik <code>.proto</code> jako kontrakt</h1>
<p>Plik <code>.proto</code> definiuje strukturę komunikatów i metody usług. Jest jedynym źródłem prawdy (single source of truth) o API, niezależnym od implementacji i języka programowania.</p>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-proto">syntax = <span class="hljs-string">&quot;proto3&quot;</span>;
<span class="hljs-keyword">package</span> payments.v1;

<span class="hljs-keyword">service </span><span class="hljs-title class_">Payments</span> {
  <span class="hljs-function"><span class="hljs-keyword">rpc</span> Pay (PayRequest) <span class="hljs-keyword">returns</span> (PayReply)</span>;
  <span class="hljs-function"><span class="hljs-keyword">rpc</span> WatchTransactions (WatchRequest)
      <span class="hljs-keyword">returns</span> (stream TransactionEvent)</span>;
}

<span class="hljs-keyword">message </span><span class="hljs-title class_">PayRequest</span> {
  <span class="hljs-type">string</span> reference     = <span class="hljs-number">1</span>;
  <span class="hljs-type">string</span> card_number   = <span class="hljs-number">2</span>;
  <span class="hljs-type">string</span> amount        = <span class="hljs-number">3</span>;  <span class="hljs-comment">// kwota dziesiętna jako tekst</span>
  <span class="hljs-type">string</span> currency_code = <span class="hljs-number">4</span>;
}
</code></pre>
</div>
<div>
<ul>
<li><strong>Usługa</strong> (<code>service</code>) grupuje metody. Każda metoda ma określony typ żądania i typ odpowiedzi.</li>
<li><strong>Komunikaty</strong> (<code>message</code>) określają strukturę danych przesyłanych między klientem a serwerem.</li>
<li>Pola mogą być typami skalarnymi, zagnieżdżonymi komunikatami, listami (<code>repeated</code>), mapami (<code>map</code>), enumami lub wariantami (<code>oneof</code>).</li>
<li>Generatory tworzą na podstawie kontraktu silnie typowane klasy klienta i serwera, co ogranicza ryzyko niezgodności.</li>
<li>Wersję API często umieszcza się w nazwie pakietu, np. <code>payments.v1</code>.</li>
</ul>
<p class="small">Protobuf nie ma wbudowanego typu dziesiętnego. Kwoty przesyła się jako tekst albo jako parę: część całkowita i część ułamkowa.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="72" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="protocol-buffers-i-zmiany-kontraktu">Protocol Buffers i zmiany kontraktu</h1>
<p>Protobuf to binarny format serializacji, mniejszy i szybszy od JSON. Z punktu widzenia architektury najważniejsze jest to, że pozwala bezpiecznie zmieniać kontrakt.</p>
<div class="cols">
<div>
<ul>
<li>W komunikacie przesyłanym przez sieć nie ma nazw pól, są tylko ich <strong>numery</strong>. To numer pola, a nie jego nazwa, stanowi właściwy kontrakt.</li>
<li>Odbiorca <strong>pomija nieznane pola</strong>, a brakującym przypisuje wartości domyślne. Dzięki temu starszy klient współpracuje z nowszym serwerem i odwrotnie.</li>
<li>Precyzyjne typy zwiększają niezawodność komunikacji.</li>
<li>Sztywny kontrakt utrudnia jednak pracę z danymi o zmiennej strukturze.</li>
</ul>
</div>
<div>
<p><strong>Zasady bezpiecznych zmian</strong></p>
<table>
<thead>
<tr>
<th>Zmiana</th>
<th>Czy jest zgodna wstecz?</th>
</tr>
</thead>
<tbody>
<tr>
<td>dodanie pola z nowym numerem</td>
<td>tak</td>
</tr>
<tr>
<td>zmiana nazwy pola</td>
<td>tak w przesyłanych danych, ale wymaga zmian w kodzie</td>
</tr>
<tr>
<td>usunięcie pola i zarezerwowanie jego numeru (<code>reserved</code>)</td>
<td>tak</td>
</tr>
<tr>
<td>ponowne użycie numeru usuniętego pola</td>
<td><strong>nie</strong>: dane zostaną błędnie odczytane</td>
</tr>
<tr>
<td>zmiana typu pola</td>
<td>zwykle <strong>nie</strong></td>
</tr>
</tbody>
</table>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="73" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="tryby-wywo%C5%82a%C5%84-w-grpc">Tryby wywołań w gRPC</h1>
<p>Dzięki HTTP/2 gRPC obsługuje nie tylko klasyczny schemat żądanie–odpowiedź, ale też strumienie danych w jedną lub w obie strony. To istotna przewaga nad REST i SOAP.</p>
<table>
<thead>
<tr>
<th>Tryb</th>
<th>Przebieg</th>
<th>Przykład</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>unary</strong></td>
<td>klient wysyła jedno żądanie i otrzymuje jedną odpowiedź</td>
<td>obciążenie karty</td>
</tr>
<tr>
<td><strong>server streaming</strong></td>
<td>klient wysyła jedno żądanie, a serwer odsyła wiele komunikatów</td>
<td>podgląd transakcji karty na żywo</td>
</tr>
<tr>
<td><strong>client streaming</strong></td>
<td>klient wysyła wiele komunikatów, a serwer odpowiada raz</td>
<td>import paczki transakcji z pliku</td>
</tr>
<tr>
<td><strong>bidirectional streaming</strong></td>
<td>obie strony wysyłają komunikaty jednocześnie i niezależnie</td>
<td>bieżąca ocena ryzyka napływających transakcji</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>Stuby</strong> klienta i serwera są generowane z plików <code>.proto</code>. Nie trzeba ręcznie pisać kodu komunikacji, a wywołania są silnie typowane, w wersji blokującej i asynchronicznej.</li>
<li>Każde wywołanie może mieć <strong>deadline</strong>, który można przekazywać dalej w łańcuchu usług. Dzięki temu kolejne usługi wiedzą, ile czasu zostało na odpowiedź.</li>
<li><strong>Metadane</strong>, odpowiednik nagłówków HTTP, przenoszą dane uwierzytelniające, identyfikatory korelacji i informacje do tracingu.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="74" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="obs%C5%82uga-b%C5%82%C4%99d%C3%B3w-w-grpc">Obsługa błędów w gRPC</h1>
<p>gRPC używa ustandaryzowanych kodów statusu, wspólnych dla wszystkich języków programowania. Dzięki temu klienci napisani w różnych technologiach mogą reagować na błędy w ten sam sposób.</p>
<div class="cols">
<div>
<ul>
<li>Każda odpowiedź ma <strong>kod statusu</strong> i opcjonalny komunikat.</li>
<li>Rozszerzony model błędów (<code>google.rpc.Status</code>) pozwala dołączyć <strong>szczegóły</strong>: które pole jest niepoprawne, który warunek nie został spełniony, po jakim czasie ponowić próbę.</li>
<li>Kod statusu podpowiada klientowi, co zrobić: poprawić żądanie, poinformować użytkownika albo ponowić wywołanie.</li>
<li>Wyjątki domenowe zamienia na kody statusu adapter, tak samo jak w przypadku HTTP.</li>
</ul>
</div>
<div>
<table>
<thead>
<tr>
<th>Status</th>
<th>Znaczenie</th>
<th>Odpowiednik HTTP</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>INVALID_ARGUMENT</code></td>
<td>niepoprawne dane wejściowe</td>
<td>400</td>
</tr>
<tr>
<td><code>NOT_FOUND</code></td>
<td>zasób nie istnieje</td>
<td>404</td>
</tr>
<tr>
<td><code>FAILED_PRECONDITION</code></td>
<td>stan systemu nie pozwala wykonać operacji</td>
<td>400 (w REST często 422)</td>
</tr>
<tr>
<td><code>ABORTED</code></td>
<td>konflikt równoległych zmian</td>
<td>409</td>
</tr>
<tr>
<td><code>UNAVAILABLE</code></td>
<td>usługa jest chwilowo niedostępna, można ponowić</td>
<td>503</td>
</tr>
<tr>
<td><code>DEADLINE_EXCEEDED</code></td>
<td>przekroczono deadline</td>
<td>504</td>
</tr>
</tbody>
</table>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="75" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="grpc-kiedy-warto-a-kiedy-nie">gRPC: kiedy warto, a kiedy nie</h1>
<p>gRPC jest wydajny i precyzyjny, ale wymaga narzędzi i infrastruktury, które nie zawsze są dostępne.</p>
<div class="cols">
<div class="card good">
<h2 id="zalety">Zalety</h2>
<ul class="pros">
<li>wysoka wydajność i małe opóźnienia dzięki binarnym komunikatom</li>
<li>wbudowany streaming w obu kierunkach</li>
<li>silnie typowane kontrakty generowane z plików <code>.proto</code>, więc niezgodności wykrywa kompilator</li>
<li>generowane biblioteki klienckie dla wielu języków</li>
<li>deadline'y i metadane wbudowane w protokół</li>
</ul>
</div>
<div class="card bad">
<h2 id="ograniczenia">Ograniczenia</h2>
<ul class="cons">
<li>binarnych komunikatów nie da się czytać bez narzędzi, co utrudnia debugowanie</li>
<li>ograniczona obsługa w przeglądarkach: gRPC-Web wymaga dodatkowego proxy</li>
<li>trzeba poznać składnię Protocol Buffers i proces generowania kodu</li>
<li>niektóre firewalle i serwery proxy źle obsługują ruch HTTP/2</li>
<li>sztywny kontrakt utrudnia pracę z danymi o zmiennej strukturze</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>gRPC najlepiej sprawdza się w komunikacji wewnętrznej między usługami, gdy liczy się wydajność, a obie strony są rozwijane w tej samej organizacji.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="76" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="messaging-queue-i-topic">Messaging: queue i topic</h1>
<p>W komunikacji asynchronicznej nadawca i odbiorca nie komunikują się bezpośrednio. Pośredniczy między nimi broker (Message-Oriented Middleware), który przyjmuje komunikaty i dostarcza je odbiorcom.</p>
<div class="cols">
<div>
<ul>
<li>Nadawca i odbiorca nie muszą działać w tym samym czasie. To tzw. <strong>temporal decoupling</strong>.</li>
<li>Broker przechowuje komunikaty, gdy odbiorca nie nadąża z ich przetwarzaniem albo jest chwilowo niedostępny.</li>
<li><strong>JMS</strong> (Java Message Service) to standardowe API Javy do wysyłania i odbierania komunikatów. <strong>MDB</strong> (Message-Driven Bean) to komponent EJB uruchamiany po nadejściu komunikatu.</li>
<li>Komunikat JMS składa się z <strong>nagłówków</strong> (identyfikator, korelacja, adres odpowiedzi, czas ważności), <strong>właściwości</strong> i <strong>treści</strong> (tekst, bajty, mapa, obiekt).</li>
</ul>
</div>
<div>
<div class="card">
<h2 id="queue-point-to-point">Queue (point-to-point)</h2>
<p>Każdy komunikat trafia do <strong>jednego</strong> odbiorcy. Odbiorcy rywalizują o komunikaty, co pozwala rozłożyć pracę na wiele instancji.</p>
<p>Typowe zastosowanie: <strong>polecenia</strong>, np. „obciąż kartę”.</p>
</div>
<div class="card good mt">
<h2 id="topic-publish%E2%80%93subscribe">Topic (publish–subscribe)</h2>
<p>Każdy subskrybent otrzymuje <strong>własną kopię</strong> komunikatu.</p>
<p>Typowe zastosowanie: <strong>zdarzenia</strong>, np. „płatność przetworzona”, na które reaguje kilka niezależnych modułów.</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="77" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="kafka-log-zdarze%C5%84">Kafka: log zdarzeń</h1>
<p>Kafka działa inaczej niż klasyczny broker z kolejkami. Topic jest trwałym, uporządkowanym logiem, z którego komunikaty nie znikają po odczytaniu.</p>
<div class="cols">
<div>
<ul>
<li>Topic dzieli się na <strong>partycje</strong>. Każda partycja to uporządkowany ciąg komunikatów.</li>
<li><strong>Klucz</strong> komunikatu wyznacza partycję. Kolejność jest zachowana tylko <strong>w obrębie klucza</strong>. Jeśli kluczem jest identyfikator zamówienia, zdarzenia dotyczące jednego zamówienia zostaną odczytane w kolejności ich zapisu.</li>
<li><strong>Consumer groups</strong>: w ramach jednej grupy partycje są rozdzielane między instancje (jak w queue), a każda grupa otrzymuje wszystkie komunikaty (jak w topicu).</li>
<li>Konsument sam zarządza swoją pozycją w logu (offsetem), więc może ponownie przetworzyć historię od dowolnego miejsca.</li>
</ul>
</div>
<div>
<table>
<thead>
<tr>
<th></th>
<th>Klasyczna kolejka</th>
<th>Log (Kafka)</th>
</tr>
</thead>
<tbody>
<tr>
<td>po odczytaniu</td>
<td>komunikat jest usuwany</td>
<td>pozostaje do końca okresu retencji</td>
</tr>
<tr>
<td>kolejność</td>
<td>zwykle w obrębie kolejki</td>
<td>w obrębie partycji, czyli klucza</td>
</tr>
<tr>
<td>ponowne przetworzenie</td>
<td>niemożliwe</td>
<td>możliwe</td>
</tr>
<tr>
<td>skalowanie odbiorców</td>
<td>competing consumers</td>
<td>partycje i consumer groups</td>
</tr>
<tr>
<td>typowa gwarancja</td>
<td>at-least-once</td>
<td>at-least-once</td>
</tr>
</tbody>
</table>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="78" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="asynchroniczno%C5%9B%C4%87-na-granicy-z-klientem">Asynchroniczność na granicy z klientem</h1>
<p>Przy przetwarzaniu asynchronicznym klient nie otrzymuje wyniku od razu, tylko potwierdzenie przyjęcia żądania.</p>
<div class="grid4">
<div class="box soft">klient składa zamówienie</div><div class="arr">→</div>
<div class="box core">zamówienie zapisane<span class="sub">wysłano polecenie „płatność zlecona”</span></div><div class="arr">→</div>
<div class="box warm">klient dostaje 202 Accepted<span class="sub">i adres zasobu ze statusem</span></div><div class="arr">→</div>
<div class="box dash">broker dostarcza polecenie</div>
<div></div><div></div><div></div><div></div><div></div><div></div><div class="arr center">↓</div>
<div class="box good">status zamówienia: opłacone lub odrzucone</div><div class="arr">←</div>
<div class="box">zamówienia odbierają zdarzenie</div><div class="arr">←</div>
<div class="box">zdarzenie „płatność przetworzona”</div><div class="arr">←</div>
<div class="box">usługa płatności obciąża kartę</div>
</div>
<div class="cols">
<div>
<p><strong>Jak klient poznaje wynik?</strong></p>
<ul>
<li><strong>polling</strong> zasobu ze statusem,</li>
<li><strong>webhook</strong>: usługa wywołuje adres podany przez klienta,</li>
<li><strong>SSE</strong> lub <strong>WebSocket</strong>: serwer wysyła zmiany do przeglądarki,</li>
<li><strong>subscription</strong> w GraphQL, <strong>server streaming</strong> w gRPC.</li>
</ul>
</div>
<div>
<p><strong>Polecenie czy zdarzenie?</strong></p>
<ul>
<li><strong>polecenie</strong> („płatność zlecona”) ma określonego adresata, od którego oczekujemy reakcji,</li>
<li><strong>zdarzenie</strong> („płatność przetworzona”) informuje o fakcie, a nadawca nie wie, kto na nie zareaguje,</li>
<li><strong>korelacja</strong>: odbiorca odsyła identyfikator z polecenia, więc płatności nie muszą wiedzieć, czym jest zamówienie.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="79" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
