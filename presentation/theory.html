</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="2" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="logika-biznesowa-w-centrum-systemu">Logika biznesowa w centrum systemu</h1>
<p>System informatyczny powstaje po to, żeby realizować reguły biznesu. Framework, baza danych, protokół komunikacji czy podział na usługi to tylko środki techniczne, które z czasem się zmieniają.</p>
<div class="chain">
<div class="box core">reguły biznesowe</div><div class="arr">→</div>
<div class="box soft">use case'y</div><div class="arr">→</div>
<div class="box">porty (kontrakty)</div><div class="arr">→</div>
<div class="box">adaptery</div><div class="arr">→</div>
<div class="box warm">technologie i inne systemy</div>
</div>
<ul>
<li>Reguły biznesowe zmieniają się rzadziej niż technologia i stanowią unikalną wiedzę firmy. Biblioteki i frameworki są dostępne dla wszystkich i z czasem się starzeją.</li>
<li>Dobra architektura umieszcza logikę w środku, a resztę układa wokół niej tak, żeby można ją było wymienić bez zmiany reguł.</li>
<li>Ta zasada obowiązuje na każdym poziomie: w pojedynczej klasie, w module aplikacji i w systemie złożonym z wielu usług.</li>
</ul>
<div class="takeaway">
<p>Przykład, do którego będziemy wracać: system <strong>kart płatniczych</strong> (dodawanie transakcji, przeliczanie walut, prowizje) oraz współpracujące z nim <strong>zamówienia</strong> i <strong>wysyłki</strong>.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="3" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="regu%C5%82a-biznesowa-proces-biznesowy-logika-biznesowa">Reguła biznesowa, proces biznesowy, logika biznesowa</h1>
<p>Te trzy pojęcia często się ze sobą myli, choć każde oznacza coś innego.</p>
<div class="cols-3">
<div class="card">
<h2 id="regu%C5%82a-biznesowa">Reguła biznesowa</h2>
<p>Zasada, według której działa firma. Obowiązuje niezależnie od systemu informatycznego, na przykład jako zapis w regulaminie.</p>
<p>Przykłady: „płatność nie może przekroczyć salda karty”, „płatność w obcej walucie jest obciążona prowizją 2%”.</p>
</div>
<div class="card warm">
<h2 id="proces-biznesowy">Proces biznesowy</h2>
<p>Powtarzalny ciąg kroków prowadzący do celu biznesowego. Często obejmuje kilka działów lub systemów.</p>
<p>Przykład: przyjęcie zamówienia, obciążenie karty, zlecenie wysyłki, potwierdzenie dla klienta.</p>
</div>
<div class="card good">
<h2 id="logika-biznesowa">Logika biznesowa</h2>
<p>Część aplikacji, która realizuje reguły i kroki procesów: sprawdza saldo, pobiera kurs waluty, nalicza prowizję, zmienia stan danych.</p>
</div>
</div>
<div class="takeaway">
<p>Stawka VAT jest regułą biznesową. Sposób naliczania podatku na pozycjach faktury, z zaokrągleniami i sumowaniem, to logika biznesowa. Reguły ustala biznes, a logikę piszą programiści, którzy muszą ją dostosowywać do każdej zmiany reguł.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="4" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="dwa-tempa-zmian-biznes-i-technologia">Dwa tempa zmian: biznes i technologia</h1>
<p>Logika biznesowa i technologia zmieniają się z różnych powodów. Jeśli są ze sobą splecione, każda zmiana po jednej stronie wymusza zmiany po drugiej.</p>
<div class="cols">
<div>
<p><strong>Logika biznesowa zmienia się, gdy:</strong></p>
<ul>
<li>zmieniają się przepisy, rynek, oferta lub strategia firmy,</li>
<li>pojawiają się klienci z nowymi wymaganiami,</li>
<li>zespół lepiej rozumie dziedzinę, w której działa firma.</li>
</ul>
<p>Logika powinna być czytelna i łatwa do przetestowania, bo zmienia się często, a błędy w niej są kosztowne.</p>
</div>
<div>
<p><strong>Technologia zmienia się, gdy:</strong></p>
<ul>
<li>biblioteka lub framework traci wsparcie,</li>
<li>trzeba wymienić bazę danych albo dodać nowy kanał dostępu (aplikację mobilną, integrację z partnerem),</li>
<li>rosną wymagania wydajnościowe.</li>
</ul>
<p>Takie zmiany nie powinny wymagać modyfikacji reguł, bo reguły pozostały takie same.</p>
</div>
</div>
<div class="takeaway">
<p>Elementy, które zmieniają się z różnych powodów i w różnym tempie, należy od siebie oddzielić. To zasada pojedynczej odpowiedzialności zastosowana do całej aplikacji. Jej naruszenie widać wtedy, gdy reguły są rozproszone po kontrolerach, zapytaniach SQL i triggerach.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="5" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="sprz%C4%99%C5%BCenie-i-sp%C3%B3jno%C5%9B%C4%87">Sprzężenie i spójność</h1>
<p>Większość dobrych praktyk projektowych sprowadza się do dwóch celów: niskiego sprzężenia między elementami i wysokiej spójności wewnątrz nich.</p>
<div class="cols">
<div class="card">
<h2 id="sprz%C4%99%C5%BCenie-coupling">Sprzężenie (coupling)</h2>
<p>Określa, w jakim stopniu zmiana jednego elementu wymusza zmiany w innych. Sprzężenie rośnie, gdy elementy:</p>
<ul>
<li>znają nawzajem swoją wewnętrzną budowę,</li>
<li>współdzielą dane, typy lub transakcje,</li>
<li>muszą działać w tym samym czasie.</li>
</ul>
<p>Przy wysokim sprzężeniu drobna zmiana pociąga za sobą zmiany w wielu miejscach.</p>
</div>
<div class="card good">
<h2 id="sp%C3%B3jno%C5%9B%C4%87-cohesion">Spójność (cohesion)</h2>
<p>Określa, w jakim stopniu elementy jednej jednostki służą wspólnemu celowi. Wysoka spójność oznacza, że:</p>
<ul>
<li>to, co zmienia się razem, znajduje się w jednym miejscu,</li>
<li>jednostka ma jedną, jasno nazwaną odpowiedzialność,</li>
<li>każdą regułę można znaleźć w jednym miejscu.</li>
</ul>
<p>Przy niskiej spójności powstają klasy i moduły, które robią wszystko po trochu.</p>
</div>
</div>
<div class="takeaway">
<p>Model domeny, porty i adaptery, moduły i usługi to narzędzia, które służą tym samym celom, tylko na coraz wyższym poziomie.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="6" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="kontrakt-interfejs-na-ka%C5%BCdym-poziomie">Kontrakt: interfejs na każdym poziomie</h1>
<p>Interfejs (API) określa, co można zrobić z danym elementem, i ukrywa, w jaki sposób zostało to zrealizowane. Dopóki kontrakt się nie zmienia, obie strony mogą rozwijać się niezależnie.</p>
<table>
<thead>
<tr>
<th>Poziom</th>
<th>Granica</th>
<th>Przykład kontraktu</th>
</tr>
</thead>
<tbody>
<tr>
<td>obiekt</td>
<td>metody publiczne</td>
<td><code>Card.registerTransaction(...)</code> zamiast publicznego settera salda</td>
</tr>
<tr>
<td>komponent</td>
<td>interfejs w kodzie</td>
<td><code>CardRepository</code>, <code>AddTransactionUseCase</code></td>
</tr>
<tr>
<td>moduł</td>
<td>publiczny pakiet lub artefakt</td>
<td>API modułu płatności i publikowane przez niego zdarzenia</td>
</tr>
<tr>
<td>usługa sieciowa</td>
<td>opis protokołu</td>
<td>WSDL, OpenAPI, schemat GraphQL, plik <code>.proto</code></td>
</tr>
<tr>
<td>proces asynchroniczny</td>
<td>format komunikatu</td>
<td>schemat zdarzenia publikowanego w brokerze</td>
</tr>
</tbody>
</table>
<ul>
<li>Im dalej od środka systemu, tym więcej klientów korzysta z kontraktu i tym droższa jest jego zmiana.</li>
<li>Dlatego kontrakty zewnętrzne opisuje się formalnie i wersjonuje.</li>
</ul>
<div class="takeaway">
<p>Dobry kontrakt jest wąski, używa pojęć zrozumiałych dla odbiorcy i nie ujawnia szczegółów implementacji, takich jak struktura tabel czy nazwy klas frameworka.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="7" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="wzorce-projektowe-i-fasada">Wzorce projektowe i fasada</h1>
<p>Wzorzec projektowy to nazwane i sprawdzone rozwiązanie problemu, który powtarza się w podobnych sytuacjach. Pojęcie wprowadził architekt Christopher Alexander (1977), a do programowania obiektowego przenieśli je autorzy książki <em>Design Patterns</em> (1994), nazywani „bandą czworga” (GoF).</p>
<div class="cols-wide">
<div>
<ul>
<li>Największą zaletą wzorców jest <strong>wspólny słownik</strong>. Zdanie „to jest fasada modułu” mówi więcej niż opis kilku klas.</li>
<li>Wzorzec stosuje się wtedy, gdy rozwiązuje rzeczywisty problem, a nie dla samej zasady.</li>
<li><strong>Fasada</strong> udostępnia jeden prosty punkt wejścia do całego podsystemu. Klient zna tylko fasadę, więc wie mniej o wnętrzu podsystemu i jest z nim słabiej powiązany. Publiczne API modułu jest w praktyce fasadą.</li>
</ul>
</div>
<div>
<table>
<thead>
<tr>
<th>Wzorzec</th>
<th>Gdzie się pojawi</th>
</tr>
</thead>
<tbody>
<tr>
<td>Facade</td>
<td>publiczne API modułu</td>
</tr>
<tr>
<td>Adapter</td>
<td>porty i adaptery</td>
</tr>
<tr>
<td>Proxy, Decorator</td>
<td>aspekty, klienci usług zdalnych</td>
</tr>
<tr>
<td>Observer</td>
<td>zdarzenia</td>
</tr>
<tr>
<td>Factory</td>
<td>tworzenie i odtwarzanie obiektów</td>
</tr>
<tr>
<td>Strategy</td>
<td>wymienne implementacje</td>
</tr>
</tbody>
</table>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="8" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="inversion-of-control-i-dependency-injection">Inversion of Control i Dependency Injection</h1>
<p>Klasa, która sama tworzy swoje zależności, jest z nimi na stałe związana. Nie da się wtedy podmienić implementacji ani przetestować klasy w izolacji. Rozwiązaniem jest przekazanie tej odpowiedzialności na zewnątrz.</p>
<div class="cols">
<div>
<p><strong>Inversion of Control (IoC)</strong> oznacza, że obiekt nie zarządza sam swoim cyklem życia ani przebiegiem programu. Robi to za niego ktoś z zewnątrz, zgodnie z zasadą „nie dzwoń do nas, to my zadzwonimy”.</p>
<p><strong>Dependency Injection (DI)</strong> to najczęstsza realizacja IoC. Zależności są tworzone i konfigurowane poza klasą, a następnie do niej przekazywane, zwykle przez konstruktor.</p>
</div>
<div>
<p>Zależności można dostarczać:</p>
<ul>
<li><strong>ręcznie</strong>, składając obiekty w jednym miejscu programu,</li>
<li><strong>za pomocą wzorców</strong>, np. fabryki, która buduje cały graf obiektów,</li>
<li><strong>za pomocą kontenera</strong> (Spring, CDI), który zarządza też cyklem życia komponentów.</li>
</ul>
<p>Miejsce, w którym składa się graf obiektów, nazywa się <strong>composition root</strong>. Tylko tam znane są konkretne implementacje.</p>
</div>
</div>
<div class="takeaway">
<p>Dzięki temu sprzężenie maleje, implementacje można wymieniać, a w testach łatwo podstawić prostą, kontrolowaną wersję zależności.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="9" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="dependency-inversion-principle">Dependency Inversion Principle</h1>
<p>Dependency Injection odpowiada na pytanie, jak dostarczyć zależność. Dependency Inversion Principle (DIP) odpowiada na pytanie, w którą stronę zależność powinna być skierowana.</p>
<div class="cols">
<div>
<div class="vchain">
<div class="box bad">logika → klasa repozytorium JPA<span class="sub">reguły zależą od szczegółu technicznego</span></div>
<div class="arr">↓ odwracamy kierunek</div>
<div class="box good">logika → <code>CardRepository</code> ← adapter JPA<span class="sub">obie strony zależą od abstrakcji</span></div>
</div>
</div>
<div>
<ul>
<li>Moduły wysokiego poziomu (reguły) nie powinny zależeć od modułów niskiego poziomu (baza danych, sieć). Obie strony powinny zależeć od abstrakcji.</li>
<li>Abstrakcje nie powinny zależeć od szczegółów, tylko szczegóły od abstrakcji.</li>
<li>Kluczowe jest to, <strong>kto jest właścicielem</strong> interfejsu. Definiuje go strona, która go potrzebuje (logika), a nie strona, która go implementuje (infrastruktura).</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>Wywołanie biegnie od logiki do bazy danych, ale zależność w kodzie jest skierowana odwrotnie: od adaptera bazy do logiki. Na tej obserwacji opierają się wszystkie architektury, w których logika znajduje się w centrum.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="10" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="co-oferuje-kontener-di">Co oferuje kontener DI</h1>
<p>Kontener taki jak Spring czy CDI nie tylko tworzy obiekty. Pozwala też dodawać do nich zachowanie i wybierać jedną z kilku implementacji tego samego interfejsu.</p>
<div class="cols">
<div class="card">
<h2 id="interceptor-czy-decorator">Interceptor czy Decorator?</h2>
<p><strong>Interceptor</strong> obsługuje zadania techniczne, niezależne od typu obiektu: transakcje, logowanie, pomiar czasu. Przypisuje się go do metod adnotacją i nie musi znać ich interfejsu.</p>
<p><strong>Decorator</strong> implementuje ten sam interfejs co obiekt, który opakowuje. Rozszerza konkretne operacje biznesowe (np. dolicza prowizję), a następnie przekazuje wywołanie do oryginalnego obiektu.</p>
</div>
<div class="card good">
<h2 id="wyb%C3%B3r-implementacji">Wybór implementacji</h2>
<p>Gdy interfejs ma kilka implementacji, kontener musi wiedzieć, którą wstrzyknąć. Służą do tego:</p>
<ul>
<li><strong>kwalifikatory</strong> (<code>@Qualifier</code>), czyli adnotacje wskazujące wariant,</li>
<li><strong>alternatywy</strong> (<code>@Alternative</code>) i profile, czyli inne implementacje dla różnych środowisk,</li>
<li><strong>warunki</strong> (np. <code>@ConditionalOnProperty</code>), dzięki którym o wyborze decyduje konfiguracja.</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>Ten sam mechanizm pozwala później przełączać technologie: repozytorium JPA lub JDBC, stałe kursy walut lub kursy pobierane z API NBP.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="11" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="cross-cutting-concerns-i-aop">Cross-cutting concerns i AOP</h1>
<p>Transakcje, logowanie, pomiar czasu, retry i kontrola dostępu dotyczą wielu use case'ów, ale nie są logiką biznesową. Programowanie aspektowe (AOP) pozwala zdefiniować je raz i stosować deklaratywnie.</p>
<div class="cols-wide">
<div>
<ul>
<li>Bez takiego wydzielenia kod techniczny powtarza się w wielu klasach i przeplata z regułami, przez co trudniej go czytać i zmieniać.</li>
<li>Aspekt wyraża intencję, np. „ta operacja ma być atomowa” albo „przy konflikcie spróbuj ponownie”, i nie wiąże logiki z konkretną technologią.</li>
<li>AOP realizuje się najczęściej za pomocą wzorca <strong>Proxy</strong>. Obiekt pośredniczący przechwytuje wywołanie, wykonuje dodatkowe czynności i przekazuje wywołanie dalej.</li>
<li><strong>Kolejność aspektów ma znaczenie.</strong> Retry musi obejmować całą transakcję. W przeciwnym razie ponowna próba zostałaby wykonana w transakcji, która została już wycofana.</li>
</ul>
</div>
<div>
<div class="stack">
<div class="dark">wywołujący</div>
<div class="down">↓</div>
<div>proxy: retry</div>
<div>proxy: pomiar czasu</div>
<div>proxy: transakcja</div>
<div class="down">↓</div>
<div class="hot">use case (sama logika)</div>
</div>
<p class="small mt">Ograniczenia proxy: wywołanie metody z wnętrza tej samej klasy omija pośrednika (self-invocation), a przechwytywane metody i klasy nie mogą być finalne.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="12" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="programowanie-przez-zdarzenia">Programowanie przez zdarzenia</h1>
<p>Zamiast bezpośrednio wywoływać kolejne komponenty, obiekt ogłasza, że coś się wydarzyło. Zainteresowane komponenty same na to reagują. To wzorzec Observer, który skutecznie zmniejsza powiązania między elementami.</p>
<div class="cols">
<div>
<ul>
<li>Nadawca nie wie, ilu jest odbiorców ani kto obsłuży zdarzenie. Nowego odbiorcę można dodać bez zmiany nadawcy.</li>
<li>Zdarzenie opisuje <strong>fakt, który już nastąpił</strong>, np. „transakcja zarejestrowana” albo „płatność przetworzona”, i zawiera dane potrzebne odbiorcom.</li>
<li>Tę samą ideę stosuje się wewnątrz modelu domeny, między modułami jednej aplikacji i między usługami komunikującymi się przez broker.</li>
</ul>
</div>
<div class="card warm">
<h2 id="cena-lu%C5%BAnych-powi%C4%85za%C5%84">Cena luźnych powiązań</h2>
<ul>
<li>Przebiegu operacji nie widać już bezpośrednio w kodzie. Trudniej odpowiedzieć na pytanie, co się stanie po jej wykonaniu.</li>
<li>Błędy odbiorców trzeba obsługiwać osobno, bo nadawca zakończył już pracę.</li>
<li>Zdarzenie przechowywane tylko w pamięci może zginąć, jeśli awaria nastąpi po zapisie danych, a przed publikacją zdarzenia.</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>Problemem gubionych zdarzeń zajmiemy się przy integracji usług. Rozwiązuje go wzorzec Transactional Outbox.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="13" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="domain-driven-design">Domain-Driven Design</h1>
<p>Skoro logika biznesowa jest najcenniejszą częścią systemu, warto wyrazić ją w kodzie wprost. Domain-Driven Design (Eric Evans, 2003) to podejście, w którym obiekty i ich zachowania wiernie odwzorowują dziedzinę problemu.</p>
<div class="cols">
<div>
<p>Założenia DDD:</p>
<ul>
<li><strong>model domeny</strong> jest centralną częścią oprogramowania, a nie dodatkiem do bazy danych,</li>
<li>programiści współpracują z <strong>ekspertami domenowymi</strong> od początku projektu,</li>
<li>najpierw trzeba zrozumieć problem biznesowy, a dopiero potem go implementować,</li>
<li>model rozwija się razem z wiedzą zespołu o dziedzinie.</li>
</ul>
</div>
<div>
<div class="card">
<h2 id="strategic-design">Strategic design</h2>
<p>Dotyczy podziału dużego problemu: wyznaczenia kontekstów (Bounded Contexts), ich granic i relacji między nimi.</p>
</div>
<div class="card good mt">
<h2 id="tactical-design">Tactical design</h2>
<p>Dotyczy budowy modelu wewnątrz kontekstu: encji, Value Objects, agregatów, repozytoriów, Domain Services i Domain Events.</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="14" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="ubiquitous-language">Ubiquitous Language</h1>
<p>Ubiquitous Language to wspólny język ekspertów domenowych, analityków i programistów. Używa się go konsekwentnie w rozmowach, dokumentacji, testach i w nazwach w kodzie, dzięki czemu kod bezpośrednio odzwierciedla model biznesowy.</p>
<div class="cols-wide">
<div>
<ul>
<li>Jednoznaczne pojęcia ograniczają błędy w interpretacji wymagań, bo ekspert i programista mówią o tym samym.</li>
<li>Język rozwija się razem z wiedzą zespołu. Gdy zmieniają się pojęcia, zmieniają się też nazwy w kodzie.</li>
<li>Język obejmuje też standardowe pojęcia modelu: encje, agregaty, Value Objects i repozytoria.</li>
<li><strong>Brak wspólnego języka</strong> widać po klasach typu <code>CardService.process()</code> czy <code>DataHelper</code>, po kilku nazwach tego samego pojęcia i po regułach ukrytych w nazwach kolumn i flagach.</li>
</ul>
</div>
<div class="card">
<h2 id="j%C4%99zyk-nale%C5%BCy-do-kontekstu">Język należy do kontekstu</h2>
<p>W domenie płatności transakcja jest <strong>wpływem</strong> albo <strong>płatnością</strong> (<code>INFLOW</code>, <code>PAYMENT</code>).</p>
<p>Publiczne API dla klientów może używać prostszych oznaczeń <code>IN</code> i <code>OUT</code>.</p>
<p>To dwa języki dla dwóch różnych odbiorców. Tłumaczenie między nimi jest zadaniem adaptera, a nie modelu domeny.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="15" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="bounded-context">Bounded Context</h1>
<p>Duży system nie ma jednego wspólnego modelu. Dzieli się go na konteksty (Bounded Contexts), z których każdy ma własny model dopasowany do swoich potrzeb, warunków i procesów.</p>
<div class="chain">
<div class="box core">Płatności<span class="sub">karta: saldo, waluta, termin ważności, transakcje</span></div>
<div class="arr">⇄</div>
<div class="box soft">Zamówienia<span class="sub">karta: tylko numer do obciążenia</span></div>
<div class="arr">⇄</div>
<div class="box soft">Wysyłki<span class="sub">zamówienie: adres i paczka</span></div>
</div>
<ul>
<li>To samo słowo, np. „karta” czy „zamówienie”, w każdym kontekście oznacza coś innego i podlega innym regułom. Jeden model dla całej firmy staje się kompromisem, który nikomu dobrze nie służy.</li>
<li>Konteksty komunikują się przez <strong>jasno określony interfejs</strong>. Zmiany modelu i logiki wewnątrz kontekstu nie mogą tego interfejsu naruszać.</li>
<li>Relacje między kontekstami mają ustalone nazwy: Customer–Supplier, Conformist, Shared Kernel, Published Language oraz <strong>Anti-Corruption Layer</strong>, który tłumaczy obcy model na własny.</li>
</ul>
<div class="takeaway">
<p>Granice kontekstów to naturalne granice modułów aplikacji, a w razie potrzeby także osobnych usług.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="16" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="model-anemiczny-i-transaction-script">Model anemiczny i Transaction Script</h1>
<p>W modelu anemicznym obiekty domeny są wyłącznie strukturami danych, a cała logika znajduje się w klasach serwisów. To popularne podejście, bo naturalnie wynika z projektowania systemu od strony tabel bazy danych.</p>
<div class="cols">
<div>
<p><strong>Jak wygląda:</strong></p>
<ul>
<li>encje odwzorowują tabele i mają gettery oraz settery dla każdego pola,</li>
<li>obiekty DAO udostępniają operacje CRUD dla poszczególnych tabel,</li>
<li>serwisy realizują logikę jako <strong>Transaction Script</strong>: pobierają dane, sprawdzają warunki i zapisują wynik.</li>
</ul>
<p><strong>Kiedy wystarcza:</strong> gdy logiki jest niewiele, a aplikacja składa się głównie z formularzy i raportów.</p>
</div>
<div class="card bad">
<h2 id="problemy-przy-rosn%C4%85cej-logice">Problemy przy rosnącej logice</h2>
<ul>
<li>Nic nie chroni niezmienników. Dowolny fragment kodu może ustawić dowolne saldo.</li>
<li>Ta sama reguła powtarza się w kilku serwisach, więc każda jej zmiana wymaga przeszukania kodu.</li>
<li>Ta sama klasa jest modelem domeny, modelem bazy i kontraktem API, więc zmiana schematu bazy wpływa na całą aplikację.</li>
<li>Przetestowanie reguły wymaga uruchomienia bazy danych i kontenera aplikacji.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="17" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="model-bogaty">Model bogaty</h1>
<p>W modelu bogatym dane i zachowanie znajdują się w tych samych obiektach. Obiekty domeny same pilnują swoich reguł, a serwisy jedynie koordynują pracę.</p>
<div class="cols">
<div>
<ul>
<li>Większość logiki znajduje się w <strong>agregatach, encjach i Value Objects</strong>.</li>
<li>Stan zmienia się wyłącznie przez metody biznesowe, np. „zarejestruj transakcję”, a nie przez settery. Obowiązuje zasada <em>Tell, Don't Ask</em>: mówimy obiektowi, co ma zrobić, zamiast pobierać jego dane i decydować za niego.</li>
<li><strong>Repozytoria</strong> obsługują całe agregaty, więc jest ich znacznie mniej niż obiektów DAO.</li>
<li><strong>Serwisy</strong> są proste: ładują agregat, wywołują jego metodę i zapisują wynik.</li>
</ul>
</div>
<div>
<table>
<thead>
<tr>
<th></th>
<th>Model anemiczny</th>
<th>Model bogaty</th>
</tr>
</thead>
<tbody>
<tr>
<td>encje</td>
<td>struktury danych</td>
<td>zachowanie i niezmienniki</td>
</tr>
<tr>
<td>logika</td>
<td>w serwisach</td>
<td>w modelu domeny</td>
</tr>
<tr>
<td>repozytoria</td>
<td>po jednym na tabelę</td>
<td>po jednym na agregat</td>
</tr>
<tr>
<td>serwisy</td>
<td>rozbudowane</td>
<td>proste, koordynujące</td>
</tr>
<tr>
<td>testy</td>
<td>integracyjne, wolne</td>
<td>jednostkowe, szybkie</td>
</tr>
</tbody>
</table>
</div>
</div>
<div class="takeaway">
<p>Model bogaty opłaca się wtedy, gdy reguł jest dużo, często się zmieniają, a błędy są kosztowne. Tak jest w przypadku płatności.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="18" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="building-blocks-modelu-domeny">Building blocks modelu domeny</h1>
<p>Tactical design w DDD wyróżnia kilka rodzajów obiektów. Każdy z nich ma inną rolę w zakresie tożsamości, spójności i odpowiedzialności.</p>
<table>
<thead>
<tr>
<th>Element</th>
<th>Cechy</th>
<th>Przykład</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Encja</strong> (Entity)</td>
<td>ma tożsamość, która trwa mimo zmian stanu</td>
<td>transakcja z własnym identyfikatorem</td>
</tr>
<tr>
<td><strong>Value Object</strong></td>
<td>nie ma tożsamości, jest niezmienny, porównuje się go po wartości i sam pilnuje swojej poprawności</td>
<td>kwota z walutą, numer karty, kurs wymiany</td>
</tr>
<tr>
<td><strong>Agregat</strong> (Aggregate)</td>
<td>grupa obiektów z korzeniem (aggregate root), która stanowi granicę spójności</td>
<td>karta wraz z jej transakcjami</td>
</tr>
<tr>
<td><strong>Repozytorium</strong> (Repository)</td>
<td>zapisuje i odczytuje całe agregaty, ukrywając sposób przechowywania</td>
<td>repozytorium kart</td>
</tr>
<tr>
<td><strong>Domain Service</strong></td>
<td>realizuje regułę, która nie pasuje do żadnego pojedynczego obiektu</td>
<td>przeliczenie waluty z prowizją</td>
</tr>
<tr>
<td><strong>Domain Event</strong></td>
<td>opisuje fakt, który zaszedł w domenie</td>
<td>„transakcja zarejestrowana”</td>
</tr>
<tr>
<td><strong>Fabryka</strong> (Factory)</td>
<td>tworzy złożone obiekty albo odtwarza je z zapisanego stanu</td>
<td>odtworzenie karty z bazy bez ponownej walidacji</td>
</tr>
</tbody>
</table>
<div class="takeaway">
<p>Value Objects chronią przed <em>primitive obsession</em>. Zamiast liczby i napisu mamy typ, który nie pozwala utworzyć ujemnej kwoty ani dodać do siebie kwot w różnych walutach.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="19" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="agregat-jako-granica-sp%C3%B3jno%C5%9Bci">Agregat jako granica spójności</h1>
<p>Agregat to grupa obiektów, które zmieniają się zawsze razem. Kod spoza agregatu ma dostęp tylko do jego korzenia (aggregate root) i tylko przez niego może zmieniać stan.</p>
<div class="cols-wide">
<div>
<ul>
<li><strong>Niezmienniki</strong>, np. „saldo po płatności nie może być ujemne”, są sprawdzane wewnątrz agregatu, więc nie da się ich obejść.</li>
<li>Przyjmuje się zasadę, że <strong>jedna transakcja bazodanowa zmienia jeden agregat</strong>. Ogranicza to zakres blokad i ryzyko konfliktów.</li>
<li>Do innych agregatów odwołujemy się przez <strong>identyfikator</strong>, a nie przez referencję do obiektu.</li>
<li>Między agregatami obowiązuje <strong>eventual consistency</strong>: spójność osiąga się przez zdarzenia, a nie przez wspólną transakcję.</li>
<li>Agregaty powinny być <strong>małe</strong>. Duży agregat oznacza więcej konfliktów przy równoległych zmianach i wolniejsze ładowanie.</li>
</ul>
</div>
<div>
<div class="vchain">
<div class="box core">Karta (aggregate root)<span class="sub">numer, waluta, saldo, termin ważności</span></div>
<div class="arr">↓ zawiera</div>
<div class="box soft">Transakcje<span class="sub">identyfikator, czas, kwota, typ</span></div>
<div class="arr">↓ publikuje</div>
<div class="box warm">transakcja zarejestrowana</div>
</div>
<p class="small mt">Granica agregatu wyznacza też zakres optimistic locking (numer wersji), jednostkę zapisu, a w Event Sourcingu jeden strumień zdarzeń.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="20" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="domena-a-infrastruktura">Domena a infrastruktura</h1>
<p>Model domeny powinien być niezależny od frameworka, bazy danych i protokołu. Aplikacja musi jednak zapisywać dane, pobierać kursy walut i publikować zdarzenia. Oba wymagania da się pogodzić dzięki odwróceniu zależności.</p>
<div class="cols">
<div>
<p><strong>Domena nie korzysta bezpośrednio z:</strong></p>
<ul>
<li>adnotacji frameworka, mapowania ORM ani HTTP,</li>
<li>zegara systemowego i generatora liczb losowych (czas i identyfikatory otrzymuje z zewnątrz),</li>
<li>konkretnego formatu zapisu i sposobu komunikacji.</li>
</ul>
<p>Dzięki temu jest <strong>deterministyczna</strong>: ten sam stan i ta sama komenda zawsze dają ten sam wynik. Testy są wtedy proste i szybkie.</p>
</div>
<div>
<p><strong>Współpraca z infrastrukturą:</strong></p>
<ul>
<li>domena i warstwa aplikacji definiują interfejsy: repozytorium, zegar, dostawcę kursów, wydawcę zdarzeń,</li>
<li>infrastruktura dostarcza ich implementacje,</li>
<li>zadania techniczne dodaje się za pomocą wzorców Proxy i Decorator,</li>
<li>konteksty komunikują się asynchronicznie przez zdarzenia.</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>Technologię można wtedy zmieniać bez wpływu na logikę. Trzeba jeszcze tak zorganizować całą aplikację, żeby ta zasada była przestrzegana trwale, a nie tylko dzięki dyscyplinie zespołu. Tym zajmuje się architektura.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="21" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="czym-jest-architektura">Czym jest architektura</h1>
<p>Architektura określa najważniejsze komponenty rozwiązania, ich odpowiedzialność, wzajemne relacje i sposób komunikacji. Jest szablonem rozwiązania, a nie jego szczegółowym projektem.</p>
<div class="cols-wide">
<div>
<ul>
<li>Architekturę opisuje się na kilku poziomach: <strong>aplikacji</strong> (warstwy, moduły, kierunek zależności), <strong>systemu</strong> (usługi i ich komunikacja) oraz <strong>infrastruktury</strong> (serwery, sieć, chmura).</li>
<li>W praktyce architekturę tworzą decyzje, których późniejsza zmiana jest <strong>kosztowna</strong>: kierunek zależności, granice modułów, sposób komunikacji, model danych.</li>
<li>Architektura nie jest celem samym w sobie. Ma umożliwić spełnienie wymagań funkcjonalnych i jakościowych przy rozsądnym koszcie zmian.</li>
<li>Dobra architektura pozwala odłożyć decyzje o szczegółach (bazie, frameworku, protokole) do chwili, w której wiadomo o nich najwięcej.</li>
</ul>
</div>
<div>
<div class="stack">
<div class="dark">infrastruktura</div>
<div>system: usługi, kontrakty, komunikacja</div>
<div>aplikacja: warstwy, porty, moduły</div>
<div class="hot">model domeny</div>
</div>
<p class="small mt">Kolejne slajdy omawiają te poziomy od środka na zewnątrz: od organizacji pojedynczej aplikacji, przez podział systemu, aż po protokoły komunikacji.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="22" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="wymagania-niefunkcjonalne-a-architektura">Wymagania niefunkcjonalne a architektura</h1>
<p>Wymagania funkcjonalne określają, co system ma robić. Wymagania niefunkcjonalne (atrybuty jakości) określają, jak dobrze ma to robić. Zależą od rodzaju aplikacji, celów biznesowych, budżetu i użytkowników, a na kształt architektury często wpływają bardziej niż same funkcje.</p>
<table>
<thead>
<tr>
<th>Wymaganie</th>
<th>Typowa konsekwencja dla architektury</th>
</tr>
</thead>
<tbody>
<tr>
<td>dostępność 24/7/365</td>
<td>redundancja, brak pojedynczego punktu awarii, wdrożenia bez przestojów</td>
</tr>
<tr>
<td>1000 równoczesnych użytkowników</td>
<td>bezstanowe instancje aplikacji, skalowanie poziome, cache</td>
</tr>
<tr>
<td>znacznie więcej odczytów niż zapisów, złożone widoki</td>
<td>osobny model odczytu (CQRS)</td>
</tr>
<tr>
<td>częste zmiany reguł</td>
<td>czytelny, dobrze przetestowany model domeny, czasem silnik reguł</td>
</tr>
<tr>
<td>kilka niezależnych zespołów</td>
<td>wyraźne granice modułów, w razie potrzeby osobne usługi</td>
</tr>
<tr>
<td>integracja z systemami zewnętrznymi</td>
<td>stabilne, wersjonowane kontrakty i Anti-Corruption Layer</td>
</tr>
</tbody>
</table>
<div class="takeaway">
<p>Architektury nie wybiera się według mody ani upodobań zespołu. O wyborze decyduje to, które atrybuty jakości są dla danego systemu najważniejsze i ile kosztuje ich zapewnienie.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="23" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="architektura-warstwowa">Architektura warstwowa</h1>
<p>To najbardziej znany styl architektury. Komponenty są pogrupowane w warstwy techniczne o określonych rolach. Każda warstwa korzysta tylko z warstwy znajdującej się pod nią.</p>
<div class="cols">
<div>
<div class="stack">
<div>prezentacja (kontrolery, widoki)</div>
<div class="down">↓</div>
<div>logika biznesowa (serwisy)</div>
<div class="down">↓</div>
<div class="hot">dostęp do danych (repozytoria, encje ORM)</div>
</div>
<ul class="pros mt">
<li>prosta i powszechnie znana</li>
<li>wystarczająca, gdy logiki jest niewiele</li>
</ul>
</div>
<div>
<ul class="cons">
<li><strong>Logika zależy od warstwy danych.</strong> Zmiana bazy danych lub ORM wymaga zmian w kodzie reguł biznesowych.</li>
<li>Model domeny upodabnia się do schematu tabel i zwykle staje się anemiczny.</li>
<li>Nowa funkcja wymaga zmian we wszystkich warstwach, bo podział jest techniczny, a nie biznesowy.</li>
<li>Do przetestowania reguły potrzebna jest baza danych, więc testy są wolne i niestabilne.</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>Problemem nie są same warstwy, tylko <strong>kierunek zależności</strong>: najważniejsza warstwa zależy od najmniej stabilnej. Wystarczy ten kierunek odwrócić.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="24" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="porty-i-adaptery-architektura-heksagonalna">Porty i adaptery (architektura heksagonalna)</h1>
<p>Alistair Cockburn (2005) zaproponował, żeby aplikacja nie wiedziała, czy wywołuje ją człowiek, test, czy inny system, ani gdzie są przechowywane jej dane. Logika znajduje się w środku i komunikuje się ze światem zewnętrznym przez porty i adaptery.</p>
<div class="chain">
<div class="stackcol"><div class="box">REST</div><div class="box">import CSV</div><div class="box">test</div></div>
<div class="arr">→</div>
<div class="box soft">port wejściowy<span class="sub"><code>AddTransactionUseCase</code></span></div>
<div class="arr">→</div>
<div class="box core">aplikacja i domena</div>
<div class="arr">→</div>
<div class="box soft">porty wyjściowe<span class="sub"><code>CardRepository</code>, <code>ExchangeRateProvider</code></span></div>
<div class="arr">←</div>
<div class="stackcol"><div class="box">JPA / JDBC</div><div class="box">API NBP</div><div class="box">Kafka</div></div>
</div>
<div class="cols">
<div>
<ul>
<li><strong>Port</strong> to interfejs, który wyraża intencję językiem aplikacji, np. „dodaj transakcję” albo „znajdź kartę”.</li>
<li><strong>Adapter</strong> realizuje tę intencję za pomocą konkretnej technologii: HTTP, SQL czy brokera komunikatów.</li>
</ul>
</div>
<div>
<ul>
<li><strong>Adaptery driving</strong> (primary) wywołują aplikację: kontroler, konsument kolejki, zadanie cykliczne.</li>
<li><strong>Adaptery driven</strong> (secondary) są wywoływane przez aplikację: baza danych, zewnętrzne API, broker.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="25" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="onion-architecture-i-clean-architecture">Onion Architecture i Clean Architecture</h1>
<p>Jeffrey Palermo (Onion Architecture, 2008) i Robert C. Martin (Clean Architecture, 2012) przedstawili tę samą ideę w postaci koncentrycznych pierścieni. Najważniejsze reguły są w środku, a szczegóły techniczne na zewnątrz.</p>
<div class="cols">
<div>
<div class="rings">
  <div class="r4">Frameworks &amp; Drivers</div>
  <div class="r3">Interface Adapters</div>
  <div class="r2">Use Cases</div>
  <div class="r1">Entities</div>
</div>
</div>
<div>
<ul>
<li>W centrum znajdują się <strong>reguły biznesowe przedsiębiorstwa</strong> (Entities), wokół nich <strong>reguły aplikacji</strong> (Use Cases), dalej adaptery, a na zewnątrz frameworki, bazy danych i interfejs użytkownika.</li>
<li><strong>Reguła zależności</strong> (dependency rule): zależności w kodzie wskazują wyłącznie do środka. Kod w pierścieniu wewnętrznym nie zna żadnych nazw z pierścieni zewnętrznych.</li>
<li>Wywołania mogą biec na zewnątrz (use case wywołuje repozytorium), ale zależność w kodzie nadal wskazuje do środka, bo interfejs repozytorium należy do pierścienia wewnętrznego.</li>
<li>Przez granice pierścieni przekazuje się proste struktury danych.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="26" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="cztery-style-jedna-regu%C5%82a">Cztery style, jedna reguła</h1>
<p>Ten sam use case można zorganizować na cztery sposoby. Trzy z nich w dużej mierze się pokrywają i różnią się przede wszystkim nazewnictwem.</p>
<table>
<thead>
<tr>
<th></th>
<th>Warstwowa</th>
<th>Onion</th>
<th>Heksagonalna</th>
<th>Clean</th>
</tr>
</thead>
<tbody>
<tr>
<td>kierunek zależności</td>
<td>w dół, do warstwy danych</td>
<td>do środka</td>
<td>do środka</td>
<td>do środka</td>
</tr>
<tr>
<td>gdzie jest interfejs repozytorium</td>
<td>w warstwie danych</td>
<td>w warstwie Domain Services</td>
<td>port wyjściowy</td>
<td>gateway w warstwie use case'ów</td>
</tr>
<tr>
<td>na co kładzie nacisk</td>
<td>podział techniczny</td>
<td>pierścienie modelu domeny</td>
<td>wymienne adaptery</td>
<td>granice i przepływ danych przez nie</td>
</tr>
</tbody>
</table>
<ul>
<li>Onion, architekturę heksagonalną i Clean Architecture łączy to, co najważniejsze: <strong>logika biznesowa jest w środku, a zależności są skierowane do niej</strong>.</li>
<li>Nazwa stylu ma mniejsze znaczenie niż konsekwentne przestrzeganie reguły zależności i automatyczne sprawdzanie, czy jest przestrzegana.</li>
</ul>
<div class="takeaway">
<p>Te architektury wymagają więcej klas i mapowań niż prosta architektura warstwowa. Ten koszt zwraca się tam, gdzie logika jest rozbudowana i ma długo żyć.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="27" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="use-case">Use case</h1>
<p>Use case (application service) realizuje jedną intencję użytkownika. Sam nie zawiera reguł biznesowych, tylko koordynuje pracę modelu domeny i infrastruktury.</p>
<div class="cols-wide">
<div>
<p>Typowy przebieg:</p>
<ol>
<li>przyjmuje <strong>komendę</strong>, czyli obiekt opisujący intencję, i sprawdza jej kompletność,</li>
<li>pobiera agregat przez port repozytorium,</li>
<li>wywołuje metodę biznesową agregatu, w której znajdują się reguły,</li>
<li>zapisuje agregat i publikuje powstałe zdarzenia,</li>
<li>zwraca <strong>model wyjściowy</strong>, a nie sam agregat.</li>
</ol>
<p>Use case jest też naturalną <strong>granicą transakcji</strong> i miejscem, w którym stosuje się aspekty: transakcje, retry i pomiar czasu.</p>
</div>
<div>
<div class="vchain">
<div class="box soft">komenda „dodaj transakcję”</div>
<div class="arr">↓</div>
<div class="box core">use case</div>
<div class="arr">↓ pobiera, wywołuje, zapisuje</div>
<div class="box">karta, repozytorium, zegar, wydawca zdarzeń</div>
<div class="arr">↓</div>
<div class="box soft">wynik: identyfikator transakcji</div>
</div>
<p class="small mt">Model wyjściowy chroni agregat: kod zewnętrzny nie może wywołać metody biznesowej z pominięciem use case'u.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="28" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="mapowanie-modeli-mi%C4%99dzy-warstwami">Mapowanie modeli między warstwami</h1>
<p>Jeśli domena, persystencja i API mają osobne modele, trzeba je mapować. To cena za niezależność warstw. Można wybrać jedną z kilku strategii, i to osobno dla każdej granicy.</p>
<table>
<thead>
<tr>
<th>Strategia</th>
<th>Na czym polega</th>
<th>Zaleta</th>
<th>Wada</th>
</tr>
</thead>
<tbody>
<tr>
<td>bez mapowania</td>
<td>jedna klasa jest encją bazy, modelem domeny i kontraktem API</td>
<td>najmniej kodu</td>
<td>zmiana schematu bazy zmienia API i reguły</td>
</tr>
<tr>
<td>dwukierunkowe</td>
<td>każda warstwa ma własny model, adapter mapuje w obie strony</td>
<td>pełna niezależność warstw</td>
<td>kod mapujący</td>
</tr>
<tr>
<td>pełne</td>
<td>osobny model dla każdej operacji, np. żądanie i komenda</td>
<td>precyzyjne kontrakty</td>
<td>najwięcej klas</td>
</tr>
<tr>
<td>jednokierunkowe</td>
<td>warstwy przekazują sobie wspólny typ tylko do odczytu</td>
<td>mniej mapowania</td>
<td>wspólny typ wiąże warstwy</td>
</tr>
</tbody>
</table>
<ul>
<li>Model persystencji powinien być ukryty w adapterze. Agregat jest z niego <strong>odtwarzany</strong> bez ponownej walidacji i bez publikowania zdarzeń, bo odtwarzany stan był już wcześniej poprawny.</li>
<li>Model API używa języka klientów, a model domeny języka ekspertów. Tłumaczy je mapper w adapterze.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="29" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="anti-corruption-layer">Anti-Corruption Layer</h1>
<p>Jeśli zewnętrzny system ma obcy model (inne pojęcia, inne nazwy, inną jakość danych), nie wpuszczamy tego modelu do domeny. Na granicy umieszczamy warstwę tłumaczącą: Anti-Corruption Layer (ACL).</p>
<div class="cols">
<div>
<div class="vchain">
<div class="box dash">API kursów walut NBP<span class="sub">tabele kursów w formacie dostawcy</span></div>
<div class="arr">↓ adapter pełniący rolę ACL</div>
<div class="box core">domena: kurs wymiany jako Value Object</div>
</div>
</div>
<div>
<ul>
<li>Chroni Ubiquitous Language przed przenikaniem cudzych pojęć do modelu.</li>
<li>Ogranicza skutki zmian: gdy dostawca zmieni format danych, poprawia się tylko adapter.</li>
<li>Pozwala testować domenę bez dostępu do sieci, bo zamiast prawdziwego dostawcy można użyć implementacji ze stałymi kursami.</li>
<li>Stosuje się go zarówno wobec systemów zewnętrznych, jak i wobec innych kontekstów tej samej firmy. Na przykład zamówienia tłumaczą wynik płatności na własne pojęcia „opłacone” i „odrzucone”.</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>Anti-Corruption Layer to adapter z dodatkowym zadaniem: tłumaczy nie tylko technologię, ale też język.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="30" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="framework-jako-szczeg%C3%B3%C5%82">Framework jako szczegół</h1>
<p>W Clean Architecture framework nie jest fundamentem aplikacji, lecz jednym z narzędzi używanych na jej obrzeżach. Domena i use case'y to zwykłe klasy, które można uruchomić i przetestować bez frameworka.</p>
<div class="cols">
<div>
<ul>
<li>Adnotacje frameworka występują w <strong>adapterach</strong> i w <strong>konfiguracji</strong>, która składa obiekty (composition root).</li>
<li>Wymiana kontenera DI, aktualizacja frameworka czy zmiana serwera aplikacji nie wpływa na reguły biznesowe.</li>
<li>Testy logiki nie wymagają uruchamiania kontekstu aplikacji, więc trwają milisekundy.</li>
<li>Aspekty, takie jak transakcje czy retry, deklaruje się własnymi adnotacjami lub w konfiguracji, a framework tylko je realizuje.</li>
</ul>
</div>
<div class="card warm">
<h2 id="%C5%9Bwiadomy-kompromis">Świadomy kompromis</h2>
<p>Wiele zespołów dopuszcza w warstwie aplikacji np. adnotację transakcji z frameworka, bo pełna izolacja wymaga dodatkowego kodu.</p>
<p>Takie rozwiązanie jest w porządku, jeśli wynika ze świadomej <strong>decyzji</strong>, a nie z przypadku. Decyzję, jej powody i konsekwencje zapisuje się w ADR (Architecture Decision Record).</p>
</div>
</div>
<div class="takeaway">
<p>Clean Architecture nie zabrania używania frameworków. Określa jedynie, która część systemu od której zależy.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="31" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="walidacja-na-trzech-poziomach">Walidacja na trzech poziomach</h1>
<p>Dane wejściowe sprawdza się w trzech miejscach, a każde z nich odpowiada na inne pytanie. Dzięki temu wiadomo, skąd pochodzi błąd i jak na niego zareagować.</p>
<div class="cols-3">
<div class="card">
<h2 id="format">Format</h2>
<p><strong>Gdzie:</strong> adapter wejściowy (DTO żądania).</p>
<p><strong>Pytanie:</strong> czy kwota jest dodatnią liczbą, czy kod waluty składa się z trzech wielkich liter, czy wymagane pola są wypełnione?</p>
<p><strong>Błąd:</strong> żądanie ma niepoprawną postać.</p>
</div>
<div class="card warm">
<h2 id="kompletno%C5%9B%C4%87">Kompletność</h2>
<p><strong>Gdzie:</strong> komenda use case'u.</p>
<p><strong>Pytanie:</strong> czy komenda zawiera wszystkie dane potrzebne do jej wykonania i czy są one ze sobą zgodne?</p>
<p><strong>Błąd:</strong> komenda jest niekompletna lub wewnętrznie sprzeczna.</p>
</div>
<div class="card good">
<h2 id="regu%C5%82y-biznesowe">Reguły biznesowe</h2>
<p><strong>Gdzie:</strong> model domeny.</p>
<p><strong>Pytanie:</strong> czy saldo wystarczy, czy karta jest ważna, czy waluta transakcji zgadza się z walutą karty?</p>
<p><strong>Błąd:</strong> żądanie jest poprawne, ale narusza reguły biznesowe.</p>
</div>
</div>
<div class="takeaway">
<p>Domena nie zna kodów odpowiedzi HTTP. To adapter decyduje, że błąd formatu oznacza odpowiedź 400, a naruszenie reguły biznesowej odpowiedź 422. Wrócimy do tego przy omawianiu protokołów.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="32" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="testy-zgodne-z-architektur%C4%85">Testy zgodne z architekturą</h1>
<p>Architektura z logiką w centrum wpływa na sposób testowania. Im bliżej środka, tym więcej testów i tym są one szybsze, bo nie wymagają infrastruktury.</p>
<div class="cols-wide">
<div>
<table>
<thead>
<tr>
<th>Poziom</th>
<th>Co sprawdzamy</th>
<th>Czego potrzeba</th>
</tr>
</thead>
<tbody>
<tr>
<td>domena</td>
<td>reguły i niezmienniki</td>
<td>niczego poza kodem</td>
</tr>
<tr>
<td>aplikacja</td>
<td>przebieg use case'u</td>
<td>prostych implementacji portów</td>
</tr>
<tr>
<td>adapter wejściowy</td>
<td>mapowanie, walidację, kody odpowiedzi</td>
<td>warstwy webowej frameworka (slice test)</td>
</tr>
<tr>
<td>adapter wyjściowy</td>
<td>zapis, odczyt, integracje</td>
<td>bazy w kontenerze (Testcontainers), mocka serwera HTTP</td>
</tr>
<tr>
<td>end-to-end</td>
<td>całą ścieżkę od żądania do bazy</td>
<td>pełnego środowiska</td>
</tr>
</tbody>
</table>
</div>
<div>
<p><strong>Contract test portu</strong> to jeden zestaw testów uruchamiany dla każdej implementacji danego portu, np. dla repozytorium JPA i dla repozytorium JDBC.</p>
<p>Gwarantuje, że wymiana adaptera nie zmieni zachowania widocznego dla aplikacji, nawet jeśli adaptery inaczej obsługują współbieżność.</p>
</div>
</div>
<div class="takeaway">
<p>Szybkie testy domeny ułatwiają bezpieczną refaktoryzację reguł, a testy adapterów sprawdzają integrację tam, gdzie rzeczywiście używa się technologii.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="33" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="architektura-jako-kod">Architektura jako kod</h1>
<p>Reguły architektury zapisane tylko w dokumentacji z czasem przestają być przestrzegane. Dlatego zapisuje się je jako testy, które uruchamiają się przy każdym buildzie i blokują zmiany naruszające te reguły.</p>
<div class="cols">
<div>
<p>Typowe reguły:</p>
<ul>
<li>kierunek zależności między warstwami lub pierścieniami,</li>
<li>brak zależności rdzenia aplikacji od frameworka i bibliotek persystencji,</li>
<li>deterministyczna domena, która nie odczytuje bezpośrednio zegara systemowego,</li>
<li>brak cykli między modułami,</li>
<li>brak zależności między adapterami,</li>
<li>konwencje nazewnicze i położenie klas w pakietach.</li>
</ul>
</div>
<div>
<p>Narzędzia:</p>
<ul>
<li><strong>ArchUnit</strong> sprawdza zależności między pakietami i klasami w zwykłych testach jednostkowych,</li>
<li><strong>Spring Modulith</strong> weryfikuje granice modułów i dozwolone zależności między nimi,</li>
<li><strong>jMolecules</strong> pozwala oznaczać pojęcia DDD (<code>@AggregateRoot</code>, <code>@ValueObject</code>) i sprawdzać związane z nimi reguły.</li>
</ul>
<p>W istniejącym projekcie reguły wprowadza się stopniowo: dotychczasowe naruszenia się „zamraża” (<code>FreezingArchRule</code>), a nowe są blokowane.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="34" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="dokumentowanie-architektury-adr-i-model-c4">Dokumentowanie architektury: ADR i model C4</h1>
<p>Na architekturę składa się nie tylko kod, ale też wiedza o tym, dlaczego wygląda ona tak, a nie inaczej, oraz jak wygląda całość. Obie te rzeczy dokumentuje się w lekkiej formie, przechowywanej razem z kodem.</p>
<div class="cols">
<div class="card">
<h2 id="architecture-decision-record-adr">Architecture Decision Record (ADR)</h2>
<p>Krótki dokument opisujący jedną decyzję architektoniczną:</p>
<ul>
<li><strong>kontekst</strong>: jaki problem rozwiązujemy i jakie czynniki trzeba uwzględnić,</li>
<li><strong>decyzja</strong>: co wybraliśmy,</li>
<li><strong>konsekwencje</strong>: co zyskujemy, a co tracimy.</li>
</ul>
<p>ADR odpowiada na pytanie „dlaczego tak?”, zanim ktoś je zada. Nieaktualnych decyzji się nie usuwa, tylko zastępuje je nowymi.</p>
</div>
<div class="card good">
<h2 id="model-c4">Model C4</h2>
<p>Opisuje architekturę na czterech poziomach szczegółowości:</p>
<ol>
<li><strong>Context</strong>: system, jego użytkownicy i systemy zewnętrzne,</li>
<li><strong>Container</strong>: aplikacje, bazy danych, brokery,</li>
<li><strong>Component</strong>: moduły wewnątrz aplikacji,</li>
<li><strong>Code</strong>: klasy (ten poziom zwykle się generuje).</li>
</ol>
<p>Diagramy można opisać tekstowo (Structurizr DSL) albo wygenerować na podstawie modułów aplikacji.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="35" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="od-aplikacji-do-systemu-spektrum-styl%C3%B3w">Od aplikacji do systemu: spektrum stylów</h1>
<p>Te same zasady wyznaczania granic stosuje się w większej skali. Style systemów różnią się liczbą jednostek wdrożenia i tym, jak mocno egzekwowane są granice między częściami systemu.</p>
<table>
<thead>
<tr>
<th>Styl</th>
<th>Jednostki wdrożenia</th>
<th>Granice modułów</th>
<th>Dane</th>
<th>Integracja</th>
</tr>
</thead>
<tbody>
<tr>
<td>monolit</td>
<td>jedna</td>
<td>umowne albo żadne</td>
<td>wspólne</td>
<td>wywołania w procesie</td>
</tr>
<tr>
<td>modularny monolit</td>
<td>jedna</td>
<td>wymuszone w kodzie i testach</td>
<td>osobne dla każdego modułu</td>
<td>API modułu, zdarzenia</td>
</tr>
<tr>
<td>SOA</td>
<td>wiele</td>
<td>kontrakty usług</td>
<td>często współdzielone</td>
<td>ESB, standardy WS-*</td>
</tr>
<tr>
<td>mikroserwisy</td>
<td>wiele, wdrażanych niezależnie</td>
<td>proces i sieć</td>
<td>wyłącznie własne</td>
<td>API sieciowe, komunikaty</td>
</tr>
</tbody>
</table>
<ul>
<li>Jakość granic i liczba jednostek wdrożenia to dwie niezależne cechy. Monolit może być dobrze podzielony, a mikroserwisy źle.</li>
<li>System rozproszony bez dobrych granic to <strong>distributed monolith</strong>: ponosi koszty sieci i wdrożeń, a nie daje niezależności.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="36" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="monolit-i-modularny-monolit">Monolit i modularny monolit</h1>
<p>Monolit nie jest z założenia zły. Problemem jest monolit bez wewnętrznych granic, w którym wszystko zależy od wszystkiego.</p>
<div class="cols">
<div class="card warm">
<h2 id="monolit">Monolit</h2>
<p>Aplikacja rozwijana, testowana i wdrażana jako jeden artefakt.</p>
<ul class="pros">
<li>nowe funkcje, także pomocnicze, dodaje się łatwo</li>
<li>prosta infrastruktura, transakcje i debugowanie</li>
</ul>
<ul class="cons">
<li>od pewnej wielkości trudny w rozwoju i utrzymaniu</li>
<li>skalować można tylko całość</li>
<li>uzależnienie od jednej technologii</li>
</ul>
</div>
<div class="card good">
<h2 id="modularny-monolit">Modularny monolit</h2>
<p>Jeden artefakt złożony z modułów, które:</p>
<ul>
<li>są od siebie niezależne,</li>
<li>mają jasno określoną odpowiedzialność, zwykle odpowiadającą jednemu kontekstowi,</li>
<li>udostępniają publiczny kontrakt i ukrywają wnętrze,</li>
<li>mogą zostać ponownie użyte albo w przyszłości wydzielone do osobnej usługi.</li>
</ul>
<p>Daje większość korzyści z podziału (granice, niezależny rozwój modułów, testy) bez kosztów komunikacji sieciowej i rozproszonej spójności.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="37" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="jak-egzekwowa%C4%87-granice-modu%C5%82u">Jak egzekwować granice modułu</h1>
<p>Granica modułu jest tyle warta, ile mechanizm, który jej pilnuje. Kolejne mechanizmy zapewniają coraz silniejszą izolację, ale są też coraz droższe.</p>
<table>
<thead>
<tr>
<th>Mechanizm</th>
<th>Co wymusza</th>
<th>Kiedy działa</th>
<th>Koszt</th>
</tr>
</thead>
<tbody>
<tr>
<td>konwencja pakietów</td>
<td>nic, tylko dobrą wolę zespołu</td>
<td>nigdy</td>
<td>zerowy</td>
</tr>
<tr>
<td>modyfikatory dostępu (package-private, <code>sealed</code>)</td>
<td>ukrycie wnętrza, zamknięte hierarchie wyników</td>
<td>podczas kompilacji, ale nie obejmują podpakietów</td>
<td>niski</td>
</tr>
<tr>
<td>moduły Maven / Gradle</td>
<td>brak dostępu do klas spoza zadeklarowanych zależności</td>
<td>podczas kompilacji</td>
<td>konfiguracja buildu</td>
</tr>
<tr>
<td>JPMS (<code>module-info.java</code>)</td>
<td><code>exports</code> dla kompilacji, <code>opens</code> dla refleksji</td>
<td>podczas kompilacji i działania</td>
<td>deskryptory modułów, problemy z refleksją</td>
</tr>
<tr>
<td>Spring Modulith</td>
<td>dozwolone zależności, komunikacja przez zdarzenia</td>
<td>w testach</td>
<td>niski</td>
</tr>
<tr>
<td>osobny proces</td>
<td>wyłącznie komunikacja przez sieć</td>
<td>zawsze</td>
<td>sieć, wdrożenia, spójność danych</td>
</tr>
</tbody>
</table>
<div class="takeaway">
<p>Moduły komunikują się przez publiczne API (fasadę) albo przez zdarzenia. Moduł, który korzysta z innego modułu, definiuje własny port i tłumaczy cudzy kontrakt na własny język.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="38" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="soa-i-mikroserwisy">SOA i mikroserwisy</h1>
<p>Oba style dzielą system na rozproszone usługi z publicznymi kontraktami. Różnią się tym, gdzie znajduje się logika integracji i czy usługi współdzielą dane.</p>
<div class="cols">
<div>
<p><strong>Architektura zorientowana na usługi (SOA)</strong></p>
<ul>
<li>usługi mają być wielokrotnie wykorzystywane w całej organizacji i często <strong>współdzielą dane</strong>,</li>
<li>powstają i są wdrażane według wspólnych standardów organizacji,</li>
<li>łączy je <strong>ESB</strong> (Enterprise Service Bus), który odpowiada za routing, transformację komunikatów i orkiestrację procesów,</li>
<li>z czasem ESB staje się centralnym elementem, który trudno zmienić.</li>
</ul>
</div>
<div>
<p><strong>Mikroserwisy</strong></p>
<ul>
<li>niewielkie usługi zbudowane wokół jednej <strong>business capability</strong>, zwykle jednego Bounded Contextu,</li>
<li><strong>nie współdzielą danych</strong>: każda ma własną bazę i komunikuje się z innymi wyłącznie przez API,</li>
<li><strong>wdraża się je niezależnie</strong> i to jest ich najważniejsza cecha,</li>
<li>obowiązuje zasada <em>smart endpoints, dumb pipes</em>: logika jest w usługach, a infrastruktura komunikacyjna tylko przekazuje komunikaty.</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>O różnicy nie decyduje wielkość usług, lecz to, gdzie znajduje się logika integracji (w ESB czy w usługach) i czy dane są współdzielone.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="39" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="mikroserwisy-zyski-i-koszty">Mikroserwisy: zyski i koszty</h1>
<p>Mikroserwisy nie usuwają złożoności. Przenoszą ją z kodu aplikacji do sieci, infrastruktury i organizacji pracy.</p>
<div class="cols">
<div>
<p><strong>Zalety</strong></p>
<ul class="pros">
<li>modularność i możliwość ponownego użycia usług</li>
<li>skalowanie tylko tych części, które są wąskim gardłem</li>
<li>lepsze wykorzystanie zasobów</li>
<li>izolacja awarii i wysoka dostępność</li>
<li>małe, zrozumiałe bazy kodu i samodzielne zespoły</li>
</ul>
<p><strong>Kwestie techniczne do rozwiązania:</strong> konfiguracja, konteneryzacja, service discovery, dostęp do danych i transakcje, monitoring i tracing, bezpieczeństwo, CI/CD, integracja z frontendem.</p>
</div>
<div>
<p><strong>Wyzwania</strong></p>
<ul class="cons">
<li>złożoność na poziomie całego systemu: infrastruktura, utrzymanie, funkcje pomocnicze w każdej usłudze</li>
<li>synchronizacja stanu i procesów bez wspólnej transakcji</li>
<li>koszty zespołu, sprzętu i utrzymania</li>
<li>niższa wydajność i większa podatność na awarie z powodu komunikacji sieciowej</li>
<li>kontrakty między usługami i ich wersjonowanie</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="40" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="jak-podzieli%C4%87-system-na-us%C5%82ugi">Jak podzielić system na usługi</h1>
<p>Podział systemu na usługi trudno później zmienić. Usługi projektuje się, zaczynając od ich odpowiedzialności i interfejsu, a nie od istniejącego kodu czy tabel.</p>
<div class="cols">
<div>
<p><strong>Podział domenowy lub procesowy</strong></p>
<ul>
<li>według kontekstów i business capabilities, np. płatności, zamówienia, wysyłki,</li>
<li>według procesu, np. składanie zamówienia od koszyka do potwierdzenia.</li>
</ul>
<p><strong>Podział techniczny</strong></p>
<ul>
<li>według wymagań jakościowych, np. wyszukiwanie pełnotekstowe ma inne potrzeby niż przeglądanie kategorii,</li>
<li>według obciążenia, wymagań bezpieczeństwa lub cyklu wydawniczego.</li>
</ul>
</div>
<div>
<ul>
<li>Ostateczny podział zależy od wymagań systemu i istniejącej funkcjonalności.</li>
<li>Granica usługi powinna pokrywać się z granicą kontekstu. Rozdzielenie agregatu między dwie usługi oznacza konieczność transakcji rozproszonej.</li>
<li>Najpierw projektuje się <strong>API</strong> i odpowiedzialność usługi, a dopiero potem jej implementację.</li>
<li>Migrację przeprowadza się stopniowo, np. według wzorca <strong>Strangler Fig</strong>: nowa usługa przejmuje kolejne fragmenty starego systemu, aż będzie można go wyłączyć.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="41" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="makro--i-mikroarchitektura-isa">Makro- i mikroarchitektura (ISA)</h1>
<p>Independent Systems Architecture (ISA) to zbiór zasad dla systemów złożonych z niezależnych modułów. Pomaga ustalić, które decyzje są wspólne dla wszystkich modułów, a które należą do każdego z nich.</p>
<div class="cols">
<div>
<p><strong>Dwa poziomy decyzji</strong></p>
<ul>
<li><strong>makroarchitektura</strong> obejmuje wszystkie moduły: protokół komunikacji, bezpieczeństwo, format metadanych, sposób integracji,</li>
<li><strong>mikroarchitektura</strong> dotyczy jednego modułu: języka programowania, bazy danych, bibliotek,</li>
<li>część decyzji ma charakter operacyjny: dostarczanie konfiguracji, monitoring, analiza logów, wdrażanie.</li>
</ul>
<p>Moduły komunikują się wyłącznie przez kontrakt i działają jako osobne procesy, kontenery lub maszyny wirtualne.</p>
</div>
<div>
<p><strong>Standaryzacja i autonomia</strong></p>
<ul>
<li>liczba sposobów integracji jest ograniczona i ustandaryzowana,</li>
<li>metadane przekazywane między modułami, np. identyfikatory korelacji, mają wspólny format,</li>
<li>konfiguracja, monitoring, tracing i wdrażanie działają w każdym module tak samo,</li>
<li>każdy moduł ma własny pipeline wdrożeniowy,</li>
<li>moduł działa dalej, nawet gdy pozostałe są niedostępne.</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>Wybór protokołu komunikacji to typowa decyzja makroarchitektoniczna: dotyczy wszystkich usług jednocześnie, a jej późniejsza zmiana jest kosztowna.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="42" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="wydzielenie-us%C5%82ugi-to-wymiana-adapter%C3%B3w">Wydzielenie usługi to wymiana adapterów</h1>
<p>Jeśli granice i porty modułu zostały dobrze zaprojektowane, przeniesienie go do osobnej usługi nie wymaga zmian w logice biznesowej. Zmieniają się tylko adaptery, czyli sposób komunikacji.</p>
<table>
<thead>
<tr>
<th>W modularnym monolicie</th>
<th>Po wydzieleniu usługi zamówień</th>
</tr>
</thead>
<tbody>
<tr>
<td>wywołanie API modułu płatności w tym samym procesie</td>
<td>żądanie HTTP z retry i limitem współbieżności</td>
</tr>
<tr>
<td>zdarzenia aplikacyjne przekazywane w pamięci</td>
<td>te same zdarzenia wysyłane do Kafki przez outbox</td>
</tr>
<tr>
<td>rozbudowana hierarchia typów w kontrakcie</td>
<td>płaski komunikat JSON, zrozumiały w każdej technologii</td>
</tr>
<tr>
<td>jedna baza danych</td>
<td>dwie bazy, każda z własnym Event Publication Registry</td>
</tr>
<tr>
<td>domena i use case'y zamówień</td>
<td><strong>bez zmian</strong></td>
</tr>
</tbody>
</table>
<div class="takeaway">
<p>Gdy moduł staje się usługą, wywołanie metody zostaje zastąpione komunikacją sieciową. Pojawiają się pytania, których wcześniej nie było: jakiego formatu danych użyć, jak opisać kontrakt, jak zgłaszać błędy, jak wersjonować API i co zrobić, gdy sieć zawiedzie.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="43" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="logika-zdalna-co-zmienia-sie%C4%87">Logika zdalna: co zmienia sieć</h1>
<p>Logika zdalna to logika udostępniana przez sieć w ramach systemu rozproszonego. Wywołanie metody w obrębie procesu jest szybkie, niezawodne i sprawdzane przez kompilator. Wywołanie przez sieć nie ma żadnej z tych cech.</p>
<div class="cols">
<div>
<p>Komunikacja sieciowa wprowadza:</p>
<ul>
<li><strong>opóźnienia</strong>, które dodatkowo bywają zmienne,</li>
<li><strong>częściowe awarie</strong>: żądanie dotarło, ale odpowiedź zginęła, więc nie wiadomo, czy operacja została wykonana,</li>
<li><strong>serializację</strong>, bo dane muszą mieć format niezależny od języka programowania,</li>
<li><strong>kontrakt</strong>, który obie strony zmieniają w różnym czasie,</li>
<li><strong>zagadnienia bezpieczeństwa</strong> na granicy zaufania.</li>
</ul>
</div>
<div class="card bad">
<h2 id="fallacies-of-distributed-computing">Fallacies of distributed computing</h2>
<p>Lista błędnych założeń, którą sformułowali inżynierowie Sun Microsystems (m.in. L. Peter Deutsch). Projektanci systemów rozproszonych często przyjmują je nieświadomie:</p>
<ol>
<li>sieć jest niezawodna,</li>
<li>opóźnienie jest zerowe,</li>
<li>przepustowość jest nieskończona,</li>
<li>sieć jest bezpieczna,</li>
<li>topologia sieci się nie zmienia,</li>
<li>siecią zarządza jeden administrator,</li>
<li>transport danych nic nie kosztuje,</li>
<li>sieć jest jednorodna.</li>
</ol>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="44" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="kr%C3%B3tka-historia-logiki-zdalnej">Krótka historia logiki zdalnej</h1>
<p>Kolejne technologie komunikacji powstawały w odpowiedzi na ograniczenia poprzednich. Ta historia wyjaśnia, dlaczego dziś w jednym systemie używa się kilku stylów jednocześnie.</p>
<div class="chain">
<div class="box soft">RPC, CORBA<span class="sub">lata 80. i 90.</span></div><div class="arr">→</div>
<div class="box soft">Java RMI, EJB<span class="sub">koniec lat 90.</span></div><div class="arr">→</div>
<div class="box">SOAP, WSDL<span class="sub">1998–2001</span></div><div class="arr">→</div>
<div class="box">REST<span class="sub">2000</span></div><div class="arr">→</div>
<div class="box core">GraphQL, gRPC<span class="sub">2015</span></div>
</div>
<div class="cols">
<div class="card">
<h2 id="obiekty-zdalne">Obiekty zdalne</h2>
<p>Komponent biznesowy, np. Stateless Session Bean w EJB, jest dostępny przez Java RMI. Klient wyszukuje go w JNDI i otrzymuje wygenerowane proxy, które wygląda jak obiekt lokalny.</p>
<p>Wniosek: <strong><em>location transparency</em> jest złudzeniem</strong>. Jeśli wywołanie zdalne wygląda jak lokalne, łatwo zaprojektować interfejs wymagający wielu wywołań (<em>chatty</em>) i zapomnieć o awariach sieci.</p>
</div>
<div class="card good">
<h2 id="kolejne-rozwi%C4%85zania">Kolejne rozwiązania</h2>
<ul>
<li>SOAP: niezależność od platformy i języka dzięki XML.</li>
<li>REST: prostota i skalowalność wzorowane na sieci WWW.</li>
<li>GraphQL: odpowiedź dopasowana do potrzeb klienta.</li>
<li>gRPC: wydajność i streaming w komunikacji między usługami.</li>
</ul>
<p>Równolegle rozwijał się model <strong>asynchroniczny</strong>, oparty na brokerach komunikatów (JMS, później Kafka).</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="45" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="cechy-komunikacji">Cechy komunikacji</h1>
<p>Protokół wybiera się dla konkretnej granicy: między przeglądarką a backendem, między usługami albo między systemem a partnerem zewnętrznym. Wybór ułatwia rozpatrzenie kilku niezależnych cech komunikacji.</p>
<table>
<thead>
<tr>
<th>Cecha</th>
<th>Warianty</th>
<th>Od czego zależy wybór</th>
</tr>
</thead>
<tbody>
<tr>
<td>czas</td>
<td><strong>synchroniczna</strong> (nadawca czeka na odpowiedź) albo <strong>asynchroniczna</strong> (nadawca nie czeka)</td>
<td>czy wynik jest potrzebny od razu i czy awaria odbiorcy może blokować nadawcę</td>
</tr>
<tr>
<td>format</td>
<td><strong>tekstowy</strong> (XML, JSON) albo <strong>binarny</strong> (Protobuf, Avro)</td>
<td>czytelność i narzędzia kontra rozmiar i szybkość</td>
</tr>
<tr>
<td>kontrakt</td>
<td>schemat <strong>obowiązkowy</strong> albo <strong>opcjonalny</strong></td>
<td>bezpieczeństwo typów kontra elastyczność</td>
</tr>
<tr>
<td>liczba odbiorców</td>
<td>jeden (request–response, queue) albo wielu (publish–subscribe)</td>
<td>czy nadawca wie, kto ma zareagować</td>
</tr>
<tr>
<td>styl</td>
<td><strong>operacje</strong>, <strong>zasoby</strong>, <strong>zapytania</strong> albo <strong>messaging</strong></td>
<td>jak klient wyraża swoją intencję</td>
</tr>
</tbody>
</table>
<div class="takeaway">
<p>Systemy zwykle łączą kilka wariantów: synchroniczne API dla użytkowników, asynchroniczne komunikaty między usługami i binarny protokół tam, gdzie liczy się wydajność.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="46" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="cztery-style-interakcji">Cztery style interakcji</h1>
<p>Styl interakcji określa, w jaki sposób klient wyraża swoją intencję wobec usługi. Od stylu zależy kształt kontraktu, sposób zgłaszania błędów i możliwość cache'owania odpowiedzi.</p>
<div class="cols-4">
<div class="card">
<h2 id="operacje-rpc">Operacje (RPC)</h2>
<p>Klient wywołuje nazwaną procedurę z parametrami, np. „dodaj transakcję do karty”.</p>
<p>Interfejs przypomina zestaw metod, a kontrakt opisuje operacje i typy danych.</p>
<p><strong>SOAP, gRPC</strong></p>
</div>
<div class="card good">
<h2 id="zasoby">Zasoby</h2>
<p>Klient zmienia lub odczytuje stan zasobu za pomocą stałego zestawu metod, np. tworzy transakcję w kolekcji transakcji karty.</p>
<p><strong>REST</strong></p>
</div>
<div class="card warm">
<h2 id="zapytania">Zapytania</h2>
<p>Klient opisuje, jakie dane chce otrzymać, np. saldo karty i trzy ostatnie transakcje, a serwer zwraca dokładnie te dane.</p>
<p><strong>GraphQL</strong></p>
</div>
<div class="card bad">
<h2 id="messaging">Messaging</h2>
<p>Nadawca publikuje polecenie lub informację o zdarzeniu i nie czeka na odpowiedź. Odbiorca przetwarza komunikat, gdy jest gotowy.</p>
<p><strong>JMS, Kafka, AMQP</strong></p>
</div>
