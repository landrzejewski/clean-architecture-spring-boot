<h1 id="ten-sam-b%C5%82%C4%85d-domenowy-w-ka%C5%BCdym-protokole">Ten sam błąd domenowy w każdym protokole</h1>
<p>Wyjątek „brak wystarczających środków” powstaje w modelu domeny karty. Domena nie wie, jak klient zobaczy ten błąd. Decyduje o tym adapter danego protokołu.</p>
<table>
<thead>
<tr>
<th>Protokół</th>
<th>Jak przekazać błąd</th>
</tr>
</thead>
<tbody>
<tr>
<td>REST</td>
<td>odpowiedź <code>422 Unprocessable Content</code> z treścią w formacie <code>application/problem+json</code></td>
</tr>
<tr>
<td>SOAP</td>
<td>element <code>soap:Fault</code> z kodem wskazującym błąd nadawcy i szczegółami w <code>Detail</code></td>
</tr>
<tr>
<td>GraphQL</td>
<td>typ <code>InsufficientFunds</code> w unii wyników mutacji albo wpis w tablicy <code>errors</code> z kodem w polu <code>extensions</code></td>
</tr>
<tr>
<td>gRPC</td>
<td>status <code>FAILED_PRECONDITION</code> ze szczegółami w <code>google.rpc.Status</code></td>
</tr>
<tr>
<td>messaging</td>
<td>zdarzenie „płatność przetworzona” ze statusem „odrzucona” i przyczyną odrzucenia</td>
</tr>
</tbody>
</table>
<div class="takeaway">
<p>W każdym protokole warto rozróżniać trzy rodzaje błędów: <strong>błąd klienta</strong> (trzeba poprawić żądanie), <strong>naruszenie reguły biznesowej</strong> (trzeba poinformować użytkownika) i <strong>błąd infrastruktury</strong> (można spróbować ponownie później). Od tego zależy reakcja klienta.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="81" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="jak-wybra%C4%87-protok%C3%B3%C5%82">Jak wybrać protokół</h1>
<p>Protokół dobiera się do konkretnej granicy systemu. Trzeba wziąć pod uwagę, kto jest klientem, jakie ma możliwości techniczne i czego potrzebuje.</p>
<table>
<thead>
<tr>
<th>Granica</th>
<th>Typowy wybór</th>
<th>Uzasadnienie</th>
</tr>
</thead>
<tbody>
<tr>
<td>publiczne API dla partnerów</td>
<td>REST z opisem w OpenAPI</td>
<td>powszechność, cache, narzędzia, niski próg wejścia</td>
</tr>
<tr>
<td>frontend z wieloma różnymi widokami</td>
<td>GraphQL albo REST w modelu BFF</td>
<td>odpowiedź dopasowana do ekranu, mniej wywołań</td>
</tr>
<tr>
<td>komunikacja wewnętrzna przy dużym ruchu</td>
<td>gRPC</td>
<td>wydajność, typowanie, streaming, deadline'y</td>
</tr>
<tr>
<td>integracja z istniejącym systemem udostępniającym WSDL</td>
<td>SOAP</td>
<td>gotowy kontrakt, wymagane standardy WS-*</td>
</tr>
<tr>
<td>proces obejmujący kilka usług</td>
<td>messaging</td>
<td>odporność na niedostępność usług, luźne powiązania</td>
</tr>
<tr>
<td>powiadomienia w czasie rzeczywistym</td>
<td>subskrypcje GraphQL, SSE, server streaming w gRPC</td>
<td>brak pollingu</td>
</tr>
</tbody>
</table>
<div class="takeaway">
<p>Wybór protokołów to decyzja makroarchitektoniczna. Niewielki, ustandaryzowany zestaw sposobów integracji ułatwia monitorowanie, zabezpieczenie i utrzymanie systemu.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="82" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="wersjonowanie-api">Wersjonowanie API</h1>
<p>Wersjonowanie to zobowiązanie wobec użytkowników API. Strategię wybiera się na początku projektu, a cykl życia wersji (okres wsparcia, wycofanie, migrację) jasno się komunikuje. Zachowanie kolejnych wersji sprawdzają testy automatyczne.</p>
<div class="cols">
<div>
<p><strong>Zmiany zgodne wstecz</strong>: dodanie opcjonalnego pola, nowej operacji lub nowego zasobu.<br />
<strong>Zmiany niezgodne</strong>: usunięcie pola lub zmiana jego znaczenia, nowe pole obowiązkowe, zmiana typu. Tylko takie zmiany wymagają nowej wersji.</p>
<table>
<thead>
<tr>
<th>Protokół</th>
<th>Sposób wersjonowania</th>
</tr>
</thead>
<tbody>
<tr>
<td>gRPC</td>
<td>numery pól, nowy pakiet <code>v2</code></td>
</tr>
<tr>
<td>GraphQL</td>
<td>rozwijanie schematu i <code>@deprecated</code></td>
</tr>
<tr>
<td>messaging</td>
<td>wersja w nazwie typu zdarzenia, Schema Registry</td>
</tr>
</tbody>
</table>
</div>
<div>
<p><strong>REST: trzy strategie</strong></p>
<table>
<thead>
<tr>
<th>Gdzie</th>
<th>Przykład</th>
<th>Cechy</th>
</tr>
</thead>
<tbody>
<tr>
<td>ścieżka URI</td>
<td><code>/v1/orders</code></td>
<td>wersja jest widoczna, łatwo cache'ować i kierować ruch</td>
</tr>
<tr>
<td>nagłówek</td>
<td><code>X-API-Version: 2</code></td>
<td>adresy pozostają bez zmian</td>
</tr>
<tr>
<td>media type</td>
<td><code>application/vnd.shop.v3+json</code></td>
<td>wykorzystuje content negotiation</td>
</tr>
</tbody>
</table>
<p><strong>Wycofywanie wersji</strong>: nagłówki <code>Deprecation</code> (RFC 9745) i <code>Sunset</code> z datą wycofania (RFC 8594), przewodnik migracji, okres przejściowy z monitorowaniem użycia, informacja w kilku kanałach.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="83" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="kontrakty-i-testy-kontraktowe">Kontrakty i testy kontraktowe</h1>
<p>Kontrakt sieciowy ma dwie strony, które są rozwijane i wdrażane niezależnie. Testy każdej strony z osobna nie wykryją, że strony przestały do siebie pasować.</p>
<div class="cols">
<div>
<p><strong>Test kontraktowy</strong> sprawdza obie strony względem wspólnego opisu:</p>
<ul>
<li><strong>provider</strong> (dostawca): czy na dane żądanie odpowiada zgodnie z kontraktem,</li>
<li><strong>consumer</strong> (konsument): czy potrafi przetworzyć odpowiedź opisaną w kontrakcie.</li>
</ul>
<p>W podejściu <strong>consumer-driven contracts</strong> (np. Pact, Spring Cloud Contract) to konsumenci określają, czego potrzebują, a dostawca sprawdza, czy spełnia oczekiwania wszystkich konsumentów.</p>
<p>Prostsza wersja: przykładowe komunikaty przechowywane razem z kontraktem i sprawdzane w testach obu stron.</p>
</div>
<div>
<p><strong>Jak projektować kontrakt sieciowy</strong></p>
<ul>
<li><strong>prosto i płasko</strong>, bez hierarchii klas specyficznych dla języka programowania,</li>
<li>w <strong>Published Language</strong>, a nie w języku wewnętrznego modelu domeny,</li>
<li>zgodnie z zasadą <strong>Tolerant Reader</strong>: konsument ignoruje nieznane pola i nie zakłada ich kolejności,</li>
<li>z jasno określonym <strong>właścicielem</strong>, który decyduje o zmianach,</li>
<li>z zachowaniem <strong>zgodności wstecz</strong> tak długo, jak to możliwe.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="84" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="niezawodno%C5%9B%C4%87-wywo%C5%82a%C5%84-zdalnych">Niezawodność wywołań zdalnych</h1>
<p>Sieć bywa zawodna, więc każde wywołanie zdalne trzeba projektować z myślą o awariach. Istnieje zestaw sprawdzonych mechanizmów, które ograniczają ich skutki.</p>
<div class="cols">
<div>
<table>
<thead>
<tr>
<th>Mechanizm</th>
<th>Przed czym chroni</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>timeout</strong> / deadline</td>
<td>blokowaniem wątków i połączeń</td>
</tr>
<tr>
<td><strong>retry</strong> z exponential backoff</td>
<td>chwilowymi awariami</td>
</tr>
<tr>
<td><strong>klucz idempotentności</strong></td>
<td>wykonaniem operacji dwa razy przy ponownej próbie</td>
</tr>
<tr>
<td><strong>bulkhead</strong> (limit współbieżności)</td>
<td>wyczerpaniem zasobów przez jedną zależność</td>
</tr>
<tr>
<td><strong>circuit breaker</strong></td>
<td>zasypywaniem żądaniami usługi, która nie działa</td>
</tr>
<tr>
<td><strong>fallback</strong></td>
<td>całkowitym brakiem odpowiedzi</td>
</tr>
</tbody>
</table>
</div>
<div>
<ul>
<li>Retry stosuje się tylko do operacji <strong>idempotentnych</strong> albo zabezpieczonych kluczem idempotentności.</li>
<li>Ponowienia na kilku poziomach się mnożą: trzy próby na trzech poziomach to 27 wywołań.</li>
<li><strong>Antywzorzec</strong>: synchroniczne wywołanie innej usługi wewnątrz transakcji bazodanowej. Połączenie z bazą pozostaje zajęte przez cały czas oczekiwania na odpowiedź.</li>
<li>Komunikacja asynchroniczna nie usuwa tych problemów, tylko je przenosi: do brokera i do odbiorcy, który musi być idempotentny.</li>
</ul>
</div>
</div>
<div class="takeaway">
<p>Jak w takim razie zachować spójność danych, skoro operacji obejmującej kilka usług nie da się zamknąć w jednej transakcji?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="85" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="granice-transakcji">Granice transakcji</h1>
<p>Gdy logika jest podzielona na agregaty, moduły i usługi, jedna transakcja bazodanowa nie obejmuje już całej operacji biznesowej. Trzeba świadomie zdecydować, gdzie kończy się silna spójność.</p>
<div class="cols">
<div>
<ul>
<li><strong>Transakcja ACID</strong> obejmuje jeden agregat w jednym module i jednej bazie danych.</li>
<li>Między agregatami, modułami i usługami obowiązuje <strong>eventual consistency</strong>: system osiąga spójny stan po pewnym czasie, a nie natychmiast.</li>
<li>To nie jest wyłącznie kompromis techniczny. Wiele procesów biznesowych działa w ten sposób od zawsze: przelew między bankami, wysyłka po zaksięgowaniu płatności, zwrot po rozpatrzeniu reklamacji.</li>
<li>Projektując proces, trzeba ustalić, jakie stany pośrednie są dopuszczalne i jak pokazać je użytkownikowi.</li>
</ul>
</div>
<div class="card bad">
<h2 id="dlaczego-nie-transakcja-rozproszona-2pc">Dlaczego nie transakcja rozproszona (2PC)</h2>
<ul>
<li>Koordynator blokuje zasoby wszystkich uczestników aż do decyzji o zatwierdzeniu.</li>
<li>System jest dostępny tylko wtedy, gdy dostępni są wszyscy uczestnicy transakcji.</li>
<li>Awaria koordynatora pozostawia uczestników w stanie niepewności.</li>
<li>Wiele baz NoSQL i nowoczesnych brokerów komunikatów nie obsługuje transakcji rozproszonych (XA).</li>
<li>Usługi, które miały być niezależne, zostają silnie powiązane w czasie.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="86" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="dual-write-i-transactional-outbox">Dual write i Transactional Outbox</h1>
<p>Typowa operacja zmienia dane w bazie i publikuje zdarzenie w brokerze. To dwie operacje na dwóch różnych systemach, więc jedna z nich może się nie powieść.</p>
<div class="cols">
<div>
<p><strong>Problem dual write</strong></p>
<ul>
<li>zapis w bazie się udał, a publikacja nie: zdarzenie przepada, a zamówienie bez końca czeka na płatność,</li>
<li>publikacja się udała, a zapis nie: inne usługi reagują na coś, co się nie wydarzyło.</li>
</ul>
<p><strong>Transactional Outbox</strong>: zdarzenie zapisuje się w osobnej tabeli w <strong>tej samej transakcji</strong> co zmianę biznesową. Osobny proces publikuje je po zatwierdzeniu transakcji i ponawia próby do skutku.</p>
<p><strong>Inbox</strong>: odbiorca zapisuje identyfikator przetworzonego komunikatu w tej samej transakcji co skutki jego obsługi. Dzięki temu rozpoznaje duplikaty.</p>
</div>
<div>
<div class="vchain">
<div class="box core">transakcja: zmiana agregatu i wpis w tabeli outbox</div>
<div class="arr">↓ po commicie</div>
<div class="box soft">relay publikuje zdarzenie i oznacza wpis jako wysłany</div>
<div class="arr">↓</div>
<div class="box warm">broker komunikatów</div>
<div class="arr">↓</div>
<div class="box soft">odbiorca: wpis w tabeli inbox i obsługa zdarzenia w jednej transakcji</div>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="87" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="gwarancje-dostarczenia-i-idempotentno%C5%9B%C4%87">Gwarancje dostarczenia i idempotentność</h1>
<p>Brokery komunikatów oferują różne gwarancje dostarczenia. W praktyce najczęściej stosuje się gwarancję at-least-once, więc odbiorca musi być przygotowany na duplikaty.</p>
<table>
<thead>
<tr>
<th>Gwarancja</th>
<th>Znaczenie</th>
<th>Konsekwencje</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>at-most-once</strong></td>
<td>komunikat może zginąć, ale nie zostanie dostarczony dwa razy</td>
<td>dopuszczalne np. dla metryk, ale nie dla płatności</td>
</tr>
<tr>
<td><strong>at-least-once</strong></td>
<td>komunikat nie zginie, ale może zostać dostarczony kilka razy</td>
<td>najczęstsza gwarancja; odbiorcy muszą być idempotentni</td>
</tr>
<tr>
<td><strong>exactly-once</strong></td>
<td>komunikat nie zginie i nie zostanie dostarczony dwa razy</td>
<td>w praktyce osiąga się ją jako at-least-once w połączeniu z idempotentnym odbiorcą</td>
</tr>
</tbody>
</table>
<div class="cols">
<div>
<p><strong>Jak zapewnić idempotentność odbiorcy</strong></p>
<ul>
<li>pomijać duplikaty na podstawie identyfikatora komunikatu (inbox),</li>
<li>stosować operacje z natury idempotentne: „ustaw status” zamiast „dodaj kwotę”, upsert zamiast insert,</li>
<li>przed zmianą sprawdzać wersję lub oczekiwany stan danych.</li>
</ul>
</div>
<div>
<p><strong>Kolejność komunikatów</strong></p>
<ul>
<li>jest zachowana najwyżej w obrębie jednego klucza lub jednej partycji,</li>
<li>odbiorca musi albo poradzić sobie ze zdarzeniami w innej kolejności, albo je odrzucić i poczekać na ponowne dostarczenie.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="88" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="cqs-i-cqrs">CQS i CQRS</h1>
<p>Oddzielenie zapisu od odczytu można stosować zarówno na poziomie pojedynczej metody, jak i całego systemu.</p>
<div class="cols">
<div>
<p><strong>Command Query Separation (CQS)</strong>, zasada sformułowana przez Bertranda Meyera, mówi, że każda metoda powinna być albo:</p>
<ul>
<li><strong>komendą</strong> (command), która zmienia stan i nic nie zwraca,</li>
<li>albo <strong>zapytaniem</strong> (query), które zwraca wynik i nie zmienia stanu.</li>
</ul>
<p>Inaczej mówiąc, zadanie pytania nie powinno zmieniać odpowiedzi. Zapytania można bezpiecznie powtarzać, cache'ować i wykonywać w dowolnej kolejności.</p>
</div>
<div>
<p><strong>Command Query Responsibility Segregation (CQRS)</strong>, spopularyzowane przez Grega Younga i Udiego Dahana, przenosi tę zasadę na poziom klas, komponentów i całego systemu. Zapis i odczyt mają <strong>osobne modele</strong>.</p>
<p>Dlaczego warto:</p>
<ul>
<li>model zapisu chroni niezmienniki (agregaty), a odczyt potrzebuje wielu widoków łączących dane z różnych miejsc,</li>
<li>odczytów jest zwykle znacznie więcej niż zapisów i mają one inne wymagania wydajnościowe,</li>
<li>jeden model, który ma obsłużyć oba cele, zwykle nie sprawdza się dobrze w żadnym z nich.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="89" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="elementy-cqrs">Elementy CQRS</h1>
<p>W pełnej architekturze CQRS są dwie ścieżki: komendy, które zmieniają stan, i zapytania, które go odczytują. Łączą je zdarzenia.</p>
<div class="grid5">
<div class="box soft">Command</div><div class="arr">→</div>
<div class="box">Command Bus</div><div class="arr">→</div>
<div class="box">Command Handler</div><div class="arr">→</div>
<div class="box core">agregat</div><div class="arr">→</div>
<div class="box">write database</div>
<div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div class="arr center">↓</div>
<div class="box soft">Query</div><div class="arr">→</div>
<div class="box good">read database</div><div class="arr">←</div>
<div class="box">Event Handler (projekcja)</div><div class="arr">←</div>
<div class="box">Event Bus</div><div class="arr">←</div>
<div class="box warm">Event</div>
</div>
<table>
<thead>
<tr>
<th>Element</th>
<th>Rola</th>
</tr>
</thead>
<tbody>
<tr>
<td>Command</td>
<td>obiekt opisujący intencję użytkownika, np. „dodaj transakcję”</td>
</tr>
<tr>
<td>Command Bus</td>
<td>kolejka lub router, który przekazuje komendę do właściwego handlera</td>
</tr>
<tr>
<td>Command Handler</td>
<td>sprawdza komendę, zmienia agregat, zapisuje go i przekazuje dalej powstałe zdarzenia</td>
</tr>
<tr>
<td>Event</td>
<td>obiekt opisujący zmianę, która zaszła w domenie</td>
</tr>
<tr>
<td>Event Bus, Event Handler</td>
<td>przekazują zdarzenia do handlerów, które aktualizują read database</td>
</tr>
<tr>
<td>Read Database Abstraction</td>
<td>kontrakt dostępu do widoków, niezależny od modelu zapisu</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="90" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="trzy-stopnie-cqrs">Trzy stopnie CQRS</h1>
<p>CQRS nie oznacza od razu osobnych baz danych. Można go wprowadzać stopniowo, a każdy kolejny stopień daje więcej możliwości za wyższą cenę.</p>
<table>
<thead>
<tr>
<th>Stopień</th>
<th>Zapis</th>
<th>Odczyt</th>
<th>Spójność</th>
<th>Koszt</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>CQRS light</strong></td>
<td>agregat i repozytorium tylko do zapisu</td>
<td>osobne zapytania SQL do tej samej bazy, bez ładowania agregatu</td>
<td>silna</td>
<td>niski</td>
</tr>
<tr>
<td><strong>osobny read store</strong></td>
<td>agregat i outbox</td>
<td>dokumenty w osobnej bazie, budowane na podstawie zdarzeń</td>
<td>ostateczna</td>
<td>średni</td>
</tr>
<tr>
<td><strong>Event Sourcing</strong></td>
<td>strumień zdarzeń</td>
<td>wyłącznie projekcje</td>
<td>ostateczna</td>
<td>wysoki</td>
</tr>
</tbody>
</table>
<p>Projekcje, które budują read model, muszą:</p>
<ul>
<li>być <strong>idempotentne</strong>, czyli dawać ten sam wynik po ponownym przetworzeniu tego samego zdarzenia,</li>
<li><strong>radzić sobie z kolejnością</strong> zdarzeń, np. przez upsert i sprawdzanie wersji,</li>
<li>dawać się <strong>odtworzyć</strong>, czyli zbudować read model od nowa w dowolnym momencie.</li>
</ul>
<div class="takeaway">
<p>Eventual consistency jest widoczna dla użytkownika: odczyt zaraz po zapisie może zwrócić poprzedni stan. Trzeba to uwzględnić w interfejsie i w API, np. zwracając wynik komendy zamiast od razu odczytywać go z read modelu.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="91" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="event-sourcing">Event Sourcing</h1>
<p>W CQRS zdarzenia służą do synchronizacji bazy zapisu z bazą odczytu. Event Sourcing idzie dalej: zdarzenia stają się jedynym źródłem prawdy, a bieżący stan jest z nich wyliczany.</p>
<div class="cols">
<div>
<ul>
<li>Stan agregatu odtwarza się, stosując po kolei zdarzenia zapisane w <strong>Event Store</strong>.</li>
<li>Event Store działa w trybie <strong>append-only</strong>: zdarzeń się nie zmienia ani nie usuwa.</li>
<li>Numer wersji strumienia zapewnia <strong>optimistic locking</strong>: z dwóch równoległych zapisów do tego samego strumienia powiedzie się tylko jeden.</li>
<li><strong>Snapshoty</strong> zapisywane co określoną liczbę zdarzeń przyspieszają odtwarzanie stanu.</li>
<li>Jeśli port repozytorium jest dobrze zaprojektowany, use case'y nie zauważą zmiany sposobu przechowywania danych.</li>
<li>Testy przyjmują naturalną postać: <strong>given</strong> (wcześniejsze zdarzenia), <strong>when</strong> (komenda), <strong>then</strong> (nowe zdarzenia).</li>
</ul>
</div>
<div>
<p><strong>Zalety</strong></p>
<ul class="pros">
<li>pełny audyt i historia wszystkich zmian</li>
<li>możliwość odtworzenia stanu z dowolnego momentu</li>
<li>nowe widoki można zbudować na podstawie całej historii</li>
<li>gotowe zdarzenia do integracji z innymi usługami</li>
</ul>
<p><strong>Koszty</strong></p>
<ul class="cons">
<li>wersjonowanie zdarzeń i ich konwersja przy zmianie formatu (upcasting)</li>
<li>historii nie można poprawić; błędy koryguje się kolejnymi zdarzeniami</li>
<li>read modele są niezbędne</li>
<li>niezmienny log utrudnia realizację prawa do usunięcia danych (RODO)</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="92" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="saga">Saga</h1>
<p>Saga to proces biznesowy obejmujący wiele modułów lub usług, z których każda ma własną transakcję. Pojęcie wprowadzili Hector Garcia-Molina i Kenneth Salem w 1987 roku.</p>
<div class="cols-wide">
<div>
<ul>
<li>Zamiast jednej transakcji rozproszonej saga jest <strong>sekwencją transakcji lokalnych</strong>.</li>
<li>Każdy krok ma <strong>kompensację</strong>, czyli operację, która odwraca jego skutki biznesowe.</li>
<li>Kompensacja ma charakter <strong>biznesowy</strong> (zwrot środków na kartę), a nie techniczny (rollback transakcji, która została już zatwierdzona).</li>
<li>Ukończone kroki kompensuje się w <strong>odwrotnej kolejności</strong>.</li>
</ul>
<p><strong>Wymagania praktyczne</strong></p>
<ul>
<li>idempotentne kroki, bo komunikaty mogą dotrzeć więcej niż raz,</li>
<li>trwały zapis stanu procesu, żeby po restarcie wiedzieć, gdzie proces się zatrzymał,</li>
<li>timeouty i ponawianie kroków,</li>
<li>plan na wypadek nieudanej kompensacji.</li>
</ul>
</div>
<div>
<div class="vchain">
<div class="box core">obciąż kartę</div>
<div class="arr">↓ powodzenie</div>
<div class="box core">zleć wysyłkę</div>
<div class="arr">↓ odmowa</div>
<div class="box bad">zwróć środki (kompensacja)</div>
<div class="arr">↓</div>
<div class="box soft">anuluj zamówienie</div>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="93" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="orkiestracja-i-choreografia">Orkiestracja i choreografia</h1>
<p>Sagą może sterować centralny orkiestrator albo może ona przebiegać bez koordynatora, gdy uczestnicy reagują na swoje zdarzenia.</p>
<div class="cols">
<div>
<p><strong>Orkiestracja</strong></p>
<div class="chain">
<div class="box soft">płatności</div><div class="arr">⇄</div>
<div class="box core">orkiestrator (zamówienia)</div><div class="arr">⇄</div>
<div class="box soft">wysyłki</div>
</div>
<p class="diagram-caption">orkiestrator wysyła polecenia i czeka na odpowiedzi</p>
<p><strong>Choreografia</strong></p>
<div class="chain">
<div class="box soft">zamówienia</div><div class="arr">→</div>
<div class="box soft">płatności</div><div class="arr">→</div>
<div class="box soft">wysyłki</div>
</div>
<p class="diagram-caption">każdy uczestnik reaguje na zdarzenia i publikuje własne</p>
</div>
<div>
<table>
<thead>
<tr>
<th></th>
<th>Orkiestracja</th>
<th>Choreografia</th>
</tr>
</thead>
<tbody>
<tr>
<td>przebieg</td>
<td>w jednym miejscu</td>
<td>rozproszony</td>
</tr>
<tr>
<td>stan procesu</td>
<td>jawnie zapisany</td>
<td>wynika ze statusów</td>
</tr>
<tr>
<td>komunikaty</td>
<td>polecenia i odpowiedzi</td>
<td>zdarzenia</td>
</tr>
<tr>
<td>zależności</td>
<td>orkiestrator zna uczestników</td>
<td>uczestnicy znają zdarzenia</td>
</tr>
<tr>
<td>timeouty</td>
<td>wbudowane</td>
<td>trzeba je dodać</td>
</tr>
<tr>
<td>ryzyko</td>
<td>rozrośnięty orkiestrator</td>
<td>trudny do prześledzenia proces</td>
</tr>
</tbody>
</table>
</div>
</div>
<div class="takeaway">
<p>Orkiestracja opiera się na poleceniach (queue), a choreografia na zdarzeniach (topic). Wybór stylu sagi jest więc też wyborem stylu komunikacji.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="94" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="gdy-regu%C5%82y-zmieniaj%C4%85-si%C4%99-szybciej-ni%C5%BC-wydania">Gdy reguły zmieniają się szybciej niż wydania</h1>
<p>Nawet dobrze zaprojektowany model domeny wymaga wydania nowej wersji aplikacji przy każdej zmianie reguły. W niektórych dziedzinach to zbyt wolno, a reguły powinni móc zmieniać sami eksperci.</p>
<div class="cols">
<div>
<p><strong>Typowe pytania</strong></p>
<ul>
<li>Jak sprawić, żeby oprogramowanie nadążało za zmianami w biznesie?</li>
<li>Jak dokładnie określić, <strong>od kiedy</strong> obowiązuje zmiana?</li>
<li>Jak wprowadzić zmianę tylko <strong>dla wybranych klientów</strong>?</li>
<li>Jak ustalić, <strong>kto</strong> może zmieniać poszczególne reguły, i jak zachować <strong>historię</strong> zmian?</li>
</ul>
</div>
<div>
<p><strong>Silniki reguł i procesów biznesowych</strong></p>
<ul>
<li>wykonują i monitorują reguły zapisane w <strong>formalnym języku</strong>,</li>
<li>pozwalają wydzielić reguły i procesy z kodu aplikacji,</li>
<li>umożliwiają ich tworzenie i zmienianie <strong>poza kodem</strong>, także przez analityków biznesowych.</li>
</ul>
<p>W architekturze z logiką w centrum silnik reguł jest szczegółem technicznym. Znajduje się za portem (np. „polityka prowizji”), a model domeny decyduje, kiedy z niego skorzystać.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="95" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="silniki-regu%C5%82-i-proces%C3%B3w-w-praktyce">Silniki reguł i procesów w praktyce</h1>
<p>Logikę wydzieloną poza kod najczęściej zapisuje się jako reguły decyzyjne albo jako wykonywalne modele procesów.</p>
<div class="cols">
<div class="card">
<h2 id="regu%C5%82y-drools-dmn">Reguły: Drools, DMN</h2>
<ul>
<li>Reguły zapisuje się w postaci <strong>„jeśli warunek, to akcja”</strong> albo jako <strong>tablice decyzyjne</strong> (decision tables).</li>
<li>Silnik dopasowuje fakty do reguł i wykonuje te, które są spełnione.</li>
<li>Sprawdza się przy wielu niezależnych, często zmienianych regułach: taryfach, rabatach, ocenie ryzyka.</li>
</ul>
<ul class="cons">
<li>logikę trudniej testować i śledzić</li>
<li>ryzyko zarządzania regułami jak arkuszem kalkulacyjnym, bez kontroli wersji i testów</li>
</ul>
</div>
<div class="card warm">
<h2 id="procesy-bpmn-20">Procesy: BPMN 2.0</h2>
<ul>
<li>Proces ma postać <strong>wykonywalnego diagramu</strong>: zadań (tasks), bramek (gateways), zdarzeń, timerów i kompensacji.</li>
<li>Silnik procesów (np. Camunda, Flowable) przechowuje stan każdej instancji procesu i pilnuje timeoutów.</li>
<li>W praktyce jest to <strong>orkiestrowana saga</strong>, którą rozumieją także osoby z biznesu.</li>
</ul>
<ul class="cons">
<li>dodatkowa infrastruktura i kolejny model do utrzymania</li>
<li>pokusa przeniesienia całej logiki biznesowej do diagramów</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="96" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="od-klasy-do-systemu-jedna-idea">Od klasy do systemu: jedna idea</h1>
<p>Wszystkie omówione zagadnienia to zastosowania tej samej zasady na różnych poziomach: logikę biznesową chroni granica z kontraktem, a przestrzeganie tej granicy sprawdza się automatycznie.</p>
<table>
<thead>
<tr>
<th>Poziom</th>
<th>Granica</th>
<th>Kontrakt</th>
<th>Jak egzekwujemy granicę</th>
</tr>
</thead>
<tbody>
<tr>
<td>agregat</td>
<td>metody biznesowe</td>
<td>niezmienniki</td>
<td>kompilator, testy domeny</td>
</tr>
<tr>
<td>aplikacja</td>
<td>porty</td>
<td>interfejsy wyrażone językiem aplikacji</td>
<td>reguła zależności, testy architektury</td>
</tr>
<tr>
<td>moduł</td>
<td>publiczne API</td>
<td>fasada, zdarzenia</td>
<td>moduły Maven, JPMS, Spring Modulith</td>
</tr>
<tr>
<td>usługa</td>
<td>protokół</td>
<td>WSDL, OpenAPI, schemat GraphQL, <code>.proto</code></td>
<td>testy kontraktowe</td>
</tr>
<tr>
<td>proces</td>
<td>komunikaty</td>
<td>schematy zdarzeń, saga</td>
<td>outbox, idempotentność, timeouty</td>
</tr>
</tbody>
</table>
<ol>
<li>Zaczynamy od <strong>modelu domeny</strong> i reguły zależności. Framework, baza danych i protokół to szczegóły.</li>
<li>Protokół wybieramy <strong>dla konkretnej granicy</strong>, a nie dla całego systemu. Każdy protokół to tylko adapter.</li>
<li>Rozproszenie daje niezależność kosztem spójności. Często wystarcza <strong>modularny monolit</strong>.</li>
<li>Każda decyzja architektoniczna jest kompromisem. Jej kontekst i konsekwencje zapisujemy w <strong>ADR</strong>.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="97" data-paginate="true" data-lang="pl" data-theme="dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq" lang="pl" data-marpit-pagination="97" style="--paginate:true;--lang:pl;--theme:dmgrizyvqtr52yqkizfmzpn5qebnpc96eld2tvn3lq;" data-marpit-pagination-total="97">
<h1 id="literatura">Literatura</h1>
<div class="cols">
<div>
<p><strong>Architektura i modelowanie</strong></p>
<ul>
<li>E. Evans, <em>Domain-Driven Design: Tackling Complexity in the Heart of Software</em></li>
<li>R. C. Martin, <em>Clean Architecture</em></li>
<li>T. Hombergs, <em>Get Your Hands Dirty on Clean Architecture</em></li>
<li>M. Richards, N. Ford, <em>Fundamentals of Software Architecture</em></li>
<li>N. Ford, M. Richards i in., <em>Software Architecture: The Hard Parts</em></li>
<li>C. Richardson, <em>Microservices Patterns</em></li>
<li>E. Gamma i in., <em>Design Patterns</em></li>
</ul>
</div>
<div>
<p><strong>Komunikacja i procesy</strong></p>
<ul>
<li>R. Fielding, <em>Architectural Styles and the Design of Network-based Software Architectures</em> (2000)</li>
<li>RFC 9110 (semantyka HTTP), RFC 9457 (Problem Details)</li>
<li>specyfikacja GraphQL: spec.graphql.org</li>
<li>gRPC i Protocol Buffers: grpc.io, protobuf.dev</li>
<li>H. Garcia-Molina, K. Salem, <em>Sagas</em> (1987)</li>
<li>zasady ISA: isa-principles.org</li>
<li>model C4: c4model.com</li>
</ul>
</div>
</div>
</section>
